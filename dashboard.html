
<div class="wage-dashboard">

<style>
#pageContainer .wage-dashboard {
  --green:#138b55;
  --green-dark:#087443;
  --green-light:#e8f7ef;
  --green-soft:#f2fbf6;
  --wd-card:var(--card-bg,var(--surface,#fff));
  --wd-text:var(--text-color,var(--text,#172033));
  --wd-muted:var(--muted-color,#7b8495);
  --wd-border:var(--border-color,#e4eee8);
  width:100%;
  color:var(--wd-text);
  font-family:inherit;
}

/* Header */
#pageContainer .wd-top {
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:12px;
  margin-bottom:20px;
}
#pageContainer .wd-heading h2 {
  margin:0 0 5px;
  font-size:24px;
  font-weight:800;
  letter-spacing:-.5px;
}
#pageContainer .wd-heading p {
  margin:0;
  color:var(--wd-muted);
  font-size:13px;
}
#pageContainer .wd-refresh {
  border:0;
  border-radius:10px;
  background:var(--green);
  color:#fff;
  padding:11px 17px;
  font-weight:700;
  cursor:pointer;
  transition:.2s;
  box-shadow:0 4px 12px rgba(19,139,85,.18);
}
#pageContainer .wd-refresh:hover {
  background:var(--green-dark);
  transform:translateY(-1px);
}
#pageContainer .wd-refresh:disabled {
  opacity:.6;
  cursor:wait;
}

/* API Status */
#pageContainer .wd-status {
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--wd-muted);
  font-size:12px;
  margin-bottom:19px;
}
#pageContainer .wd-dot {
  width:8px;
  height:8px;
  border-radius:50%;
  background:#e9a23b;
  display:inline-block;
}
#pageContainer .wd-dot.success {background:#16a34a}
#pageContainer .wd-dot.error {background:#dc2626}

/* Stats */
#pageContainer .wd-grid {
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:16px;
  margin-bottom:30px;
}
#pageContainer .wd-stat {
  position:relative;
  overflow:hidden;
  background:var(--wd-card);
  border:1px solid var(--wd-border);
  border-radius:16px;
  padding:20px;
  min-width:0;
  box-shadow:0 4px 15px rgba(0,70,35,.035);
  transition:transform .2s,border-color .2s,box-shadow .2s;
}
#pageContainer .wd-stat:hover {
  transform:translateY(-3px);
  border-color:#8ed5ad;
  box-shadow:0 8px 22px rgba(0,100,50,.08);
}
#pageContainer .wd-stat::after {
  content:"";
  position:absolute;
  width:90px;
  height:90px;
  border-radius:50%;
  background:rgba(22,163,74,.045);
  right:-30px;
  bottom:-40px;
}
#pageContainer .wd-stat-top {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:18px;
}
#pageContainer .wd-stat-label {
  color:var(--wd-muted);
  font-size:13px;
  font-weight:650;
}
#pageContainer .wd-icon {
  width:43px;
  height:43px;
  border-radius:13px;
  display:grid;
  place-items:center;
  font-size:20px;
  flex-shrink:0;
}
#pageContainer .wd-green-icon {
  background:#e6f7ed;
  color:#138b55;
}
#pageContainer .wd-stat-value {
  font-size:clamp(20px,2.2vw,28px);
  font-weight:850;
  line-height:1.35;
  overflow-wrap:anywhere;
  color:var(--wd-text);
}
#pageContainer .wd-stat-note {
  color:var(--wd-muted);
  font-size:11px;
  margin-top:8px;
}
#pageContainer .wd-error {
  color:#dc2626;
  font-size:11px;
  margin-top:8px;
  display:none;
  overflow-wrap:anywhere;
}

/* Section */
#pageContainer .wd-section-title {
  font-size:18px;
  font-weight:800;
  margin:0 0 15px;
  display:flex;
  align-items:center;
  gap:9px;
}
#pageContainer .wd-section-title::before {
  content:"";
  width:4px;
  height:19px;
  border-radius:5px;
  background:var(--green);
}

/* Quick Access */
#pageContainer .wd-links {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
}
#pageContainer .wd-link {
  background:var(--wd-card);
  border:1px solid var(--wd-border);
  border-radius:14px;
  padding:17px;
  text-align:left;
  color:var(--wd-text);
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:13px;
  width:100%;
  transition:.2s;
}
#pageContainer .wd-link:hover {
  transform:translateY(-3px);
  border-color:#80cba0;
  background:var(--wd-card);
  box-shadow:0 6px 18px rgba(19,139,85,.08);
}
#pageContainer .wd-link-icon {
  width:44px;
  height:44px;
  display:grid;
  place-items:center;
  border-radius:13px;
  background:var(--green-light);
  color:var(--green);
  font-size:20px;
  flex-shrink:0;
}
#pageContainer .wd-link strong {
  display:block;
  font-size:13px;
  margin-bottom:4px;
  font-weight:750;
}
#pageContainer .wd-link small {
  color:var(--wd-muted);
  font-size:11px;
}
#pageContainer .wd-arrow {
  margin-left:auto;
  color:var(--green);
  font-size:21px;
}

/* Dark theme */
body.dark #pageContainer .wage-dashboard,
#pageContainer .wage-dashboard.dark {
  --green:#25b875;
  --green-dark:#16945b;
  --green-light:rgba(37,184,117,.15);
  --green-soft:rgba(37,184,117,.07);
  --wd-border:rgba(255,255,255,.09);
}
body.dark #pageContainer .wd-stat::after {
  background:rgba(37,184,117,.06);
}
body.dark #pageContainer .wd-green-icon,
body.dark #pageContainer .wd-link-icon {
  background:rgba(37,184,117,.15);
  color:#42d58e;
}

/* Responsive */
@media(max-width:1000px) {
  #pageContainer .wd-grid {
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
  #pageContainer .wd-links {
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}
@media(max-width:560px) {
  #pageContainer .wd-top {
    align-items:flex-start;
  }
  #pageContainer .wd-heading h2 {
    font-size:21px;
  }
  #pageContainer .wd-stat {
    padding:14px;
    border-radius:13px;
  }
  #pageContainer .wd-stat-top {
    margin-bottom:13px;
  }
  #pageContainer .wd-icon {
    width:35px;
    height:35px;
    font-size:17px;
    border-radius:11px;
  }
  #pageContainer .wd-stat-label {
    font-size:11px;
  }
  #pageContainer .wd-stat-value {
    font-size:19px;
  }
  #pageContainer .wd-stat-note {
    font-size:10px;
  }
  #pageContainer .wd-grid {
    gap:10px;
  }
  #pageContainer .wd-links {
    grid-template-columns:1fr;
    gap:10px;
  }
  #pageContainer .wd-link {
    padding:13px;
  }
  #pageContainer .wd-refresh {
    padding:9px 13px;
    font-size:12px;
  }
}
</style>

<!-- Dashboard Header -->
<div class="wd-top">

<!-- API Status -->
<div class="wd-status">

</div>

<!-- Dashboard Cards -->

<script>
(function () {
  "use strict";

  // =========================================
  // THREE API URLS
  // =========================================

  const API = {
    userAccount:
      "https://script.google.com/macros/s/AKfycbzlabjyglodpoiPmupmA2buZqMyFiSPScIrTPm0T8Il7Z7bKtAkZglsfDk9WZAFOHgk/exec",

    wageHistory:
      "https://script.google.com/macros/s/AKfycbygdxmo_sur5KYs3XhYHnyaMGQQ_G5_Prc9NUozP9dxRVhrwVmezX2ozhkhqQ4KeWKxPQ/exec",

    userPayment:
      "https://script.google.com/macros/s/AKfycbwTP0v21FArPYP3SN2Ch2gTBXTplbkRDDu49iAp4C5mSEN0BAxxmtlAPJxGXRSIaF-p/exec"
  };

  const CURRENCY = "৳";
  let loading = false;

  // =========================================
  // HELPERS
  // =========================================

  function setText(id, value) {
    const el = document.getElementById(id);
    if (el) el.textContent = value;
  }

  function setError(id, message) {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = message || "";
    el.style.display = message ? "block" : "none";
  }

  function setStatus(message, type) {
    setText("wdStatusText", message);
    const dot = document.getElementById("wdStatusDot");
    if (dot) dot.className = "wd-dot " + (type || "");
  }

  function money(value) {
    return CURRENCY + " " + (Number(value) || 0).toLocaleString("en-BD", {
      maximumFractionDigits:2
    });
  }

  function numberValue(value) {
    if (typeof value === "number") return value;
    if (value === null || value === undefined) return 0;
    return Number(String(value).replace(/[৳,\s]/g,"")) || 0;
  }

  function getArray(data, keys) {
    if (Array.isArray(data)) return data;

    for (const key of keys) {
      if (data && Array.isArray(data[key])) return data[key];
    }

    if (data && data.data) {
      if (Array.isArray(data.data)) return data.data;

      for (const key of keys) {
        if (Array.isArray(data.data[key])) return data.data[key];
      }
    }

    return [];
  }

  function getAmount(item) {
    const keys = [
      "amount","wage","payment","total",
      "paidAmount","wageAmount","paymentAmount"
    ];

    for (const key of keys) {
      if (item && item[key] !== undefined && item[key] !== null) {
        return numberValue(item[key]);
      }
    }
    return 0;
  }

  function sumRecords(records) {
    return records.reduce((sum,item) => sum + getAmount(item),0);
  }

  // =========================================
  // API REQUEST
  // =========================================

  function makeUrl(base, action) {
    const url = new URL(base);
    url.searchParams.set("api",action);
    return url.toString();
  }

  async function fetchApi(base, action) {
    const response = await fetch(makeUrl(base,action), {
      method:"GET",
      cache:"no-store",
      redirect:"follow"
    });

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const raw = await response.text();
    let result;

    try {
      result = JSON.parse(raw);
    } catch (e) {
      throw new Error("Invalid JSON response");
    }

    if (result && result.success === false) {
      throw new Error(result.message || result.error || "API request failed");
    }

    return result;
  }

  // =========================================
  // USER ACCOUNT
  // =========================================

  async function loadUsers() {
    const data = await fetchApi(API.userAccount,"active");

    const users = getArray(data,[
      "users","accounts","activeUsers","records"
    ]);

    return users.filter(user => {
      const status = String(user.status || "active").toLowerCase();
      return !["inactive","deleted","disabled"].includes(status);
    }).length;
  }

  // =========================================
  // WAGE HISTORY
  // =========================================

  async function loadWages() {
    const data = await fetchApi(API.wageHistory,"wages");

    const wages = getArray(data,[
      "entries","wages","history","records"
    ]);

    return sumRecords(wages);
  }

  // =========================================
  // USER PAYMENT
  // =========================================

  async function loadPayments() {
    const data = await fetchApi(API.userPayment,"payments");

    const payments = getArray(data,[
      "entries","payments","history","records"
    ]);

    return sumRecords(payments);
  }

  // =========================================
  // DASHBOARD REFRESH
  // =========================================

  window.wdLoadDashboard = async function () {
    if (loading) return;
    loading = true;

    const button = document.getElementById("wdRefresh");
    if (button) button.disabled = true;

    setStatus("Connecting to 3 APIs...","");

    ["wdUserError","wdWageError","wdPaymentError"]
      .forEach(id => setError(id,""));

    const results = await Promise.allSettled([
      loadUsers(),
      loadWages(),
      loadPayments()
    ]);

    let totalUsers = null;
    let totalWage = null;
    let totalPayment = null;

    if (results[0].status === "fulfilled") {
      totalUsers = results[0].value;
      setText("wdTotalUsers",totalUsers.toLocaleString("en-BD"));
    } else {
      setText("wdTotalUsers","Error");
      setError("wdUserError",results[0].reason.message);
    }

    if (results[1].status === "fulfilled") {
      totalWage = results[1].value;
      setText("wdTotalWage",money(totalWage));
    } else {
      setText("wdTotalWage","Error");
      setError("wdWageError",results[1].reason.message);
    }

    if (results[2].status === "fulfilled") {
      totalPayment = results[2].value;
      setText("wdTotalPayment",money(totalPayment));
    } else {
      setText("wdTotalPayment","Error");
      setError("wdPaymentError",results[2].reason.message);
    }

    if (totalWage !== null && totalPayment !== null) {
      setText("wdRemaining",money(totalWage-totalPayment));
    } else {
      setText("wdRemaining","—");
    }

    const successCount = results.filter(
      item => item.status === "fulfilled"
    ).length;

    if (successCount === 3) {
      setStatus("All 3 APIs connected successfully","success");
    } else if (successCount > 0) {
      setStatus(successCount+" of 3 APIs connected. Check failed API.","error");
    } else {
      setStatus("API connection failed. Check API settings.","error");
    }

    loading = false;
    if (button) button.disabled = false;
  };

  // =========================================
  // INDEX.HTML PAGE NAVIGATION
  // =========================================

  window.dashboardOpenPage = function(page) {
    if (typeof window.loadPage === "function") {
      window.loadPage(page,true);
    } else {
      console.error("Index page loader not found");
    }
  };

  // Initial load
  window.wdLoadDashboard();

})();
</script>
