
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deleted Payment | RS NETWORK</title>

<style>
:root{
  --dp-primary:var(--primary,#087f5b);
  --dp-accent:var(--accent,#12b886);
  --dp-bg:var(--bg,#f5f7fb);
  --dp-card:var(--card,#ffffff);
  --dp-text:var(--text,#172033);
  --dp-muted:var(--muted,#8490a3);
  --dp-border:var(--border,#e8edf3);
  --dp-danger:#e05252;
  --dp-shadow:0 5px 18px rgba(20,40,60,.055);
}
*{box-sizing:border-box}
body{
  margin:0;padding:18px;background:var(--dp-bg);
  color:var(--dp-text);font-family:Arial,Helvetica,sans-serif;
}
button,input{font:inherit}
.dp-container{width:100%;max-width:1250px;margin:auto}
.dp-header{
  display:flex;align-items:center;justify-content:space-between;
  gap:14px;flex-wrap:wrap;margin-bottom:20px;
}
.dp-title h2{margin:0;font-size:22px;font-weight:750}
.dp-title p{margin:6px 0 0;color:var(--dp-muted);font-size:12px}
.dp-btn{
  border:0;border-radius:9px;padding:11px 15px;cursor:pointer;
  font-size:12px;font-weight:700;transition:.2s;
}
.dp-btn:disabled{opacity:.55;cursor:not-allowed}
.dp-refresh{background:var(--dp-primary);color:#fff}
.dp-refresh:hover{filter:brightness(.92)}
.dp-stats{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:13px;margin-bottom:18px;
}
.dp-stat{
  min-width:0;padding:16px;background:var(--dp-card);
  border:1px solid var(--dp-border);border-radius:12px;
  box-shadow:var(--dp-shadow);
}
.dp-stat-label{color:var(--dp-muted);font-size:11px;font-weight:650;margin-bottom:8px}
.dp-stat-value{font-size:22px;font-weight:750;overflow-wrap:anywhere}
.dp-toolbar{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:13px;background:var(--dp-card);
  border:1px solid var(--dp-border);border-radius:12px;
  margin-bottom:15px;box-shadow:var(--dp-shadow);
}
.dp-search{flex:1;min-width:200px}
.dp-search input{
  width:100%;height:43px;padding:0 13px;
  border:1px solid var(--dp-border);border-radius:9px;
  outline:none;background:var(--dp-bg);color:var(--dp-text);font-size:13px;
}
.dp-search input:focus{border-color:var(--dp-primary)}
.dp-count{font-size:12px;color:var(--dp-muted)}
.dp-list{display:grid;gap:13px}
.dp-item{
  min-width:0;padding:17px;border:1px solid var(--dp-border);
  border-radius:12px;background:var(--dp-card);box-shadow:var(--dp-shadow);
}
.dp-item-head{
  display:flex;justify-content:space-between;align-items:flex-start;
  flex-wrap:wrap;gap:10px;margin-bottom:14px;
}
.dp-user-name{font-size:15px;font-weight:750;overflow-wrap:anywhere}
.dp-id{margin-top:5px;color:var(--dp-muted);font-size:11px;overflow-wrap:anywhere}
.dp-tag{
  padding:6px 10px;border-radius:20px;background:rgba(224,82,82,.10);
  color:var(--dp-danger);font-size:10px;font-weight:750;white-space:nowrap;
}
.dp-details{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
  gap:14px;padding:14px 0;border-top:1px solid var(--dp-border);
  border-bottom:1px solid var(--dp-border);
}
.dp-detail{min-width:0}
.dp-label{color:var(--dp-muted);font-size:10px;margin-bottom:6px}
.dp-value{font-size:12px;font-weight:650;overflow-wrap:anywhere;line-height:1.5}
.dp-amount{color:var(--dp-primary);font-size:16px;font-weight:800}
.dp-comment{color:var(--dp-muted);font-size:12px;margin-top:11px;line-height:1.5;overflow-wrap:anywhere}
.dp-actions{
  display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:14px;
}
.dp-view{background:var(--dp-bg);border:1px solid var(--dp-border);color:var(--dp-text)}
.dp-restore{background:var(--dp-primary);color:#fff}
.dp-delete{background:var(--dp-danger);color:white}
.dp-delete:hover,.dp-restore:hover{filter:brightness(.92)}
.dp-loading,.dp-empty,.dp-error{
  padding:35px 15px;text-align:center;background:var(--dp-card);
  border:1px solid var(--dp-border);border-radius:11px;
  color:var(--dp-muted);font-size:13px;line-height:1.6;
}
.dp-error{color:var(--dp-danger)}
.dp-overlay{
  position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.55);
  display:none;align-items:center;justify-content:center;padding:15px;
}
.dp-overlay.show{display:flex}
.dp-modal{
  width:100%;max-width:410px;padding:23px;border-radius:14px;
  background:var(--dp-card);color:var(--dp-text);
  border:1px solid var(--dp-border);box-shadow:0 18px 60px rgba(0,0,0,.2);
  max-height:90vh;overflow:auto;
}
.dp-modal-icon{
  width:42px;height:42px;display:grid;place-items:center;
  border-radius:50%;background:rgba(224,82,82,.12);
  color:var(--dp-danger);font-size:22px;font-weight:800;margin-bottom:13px;
}
.dp-modal h3{margin:0 0 9px;font-size:18px}
.dp-modal p{margin:0;font-size:13px;line-height:1.6;color:var(--dp-muted)}
.dp-modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:22px}
.dp-cancel{background:var(--dp-bg);border:1px solid var(--dp-border);color:var(--dp-text)}
.dp-confirm{background:var(--dp-danger);color:white}
.dp-toast{
  position:fixed;z-index:100000;bottom:20px;right:20px;
  max-width:calc(100vw - 40px);padding:12px 17px;border-radius:9px;
  color:white;background:#172033;font-size:13px;display:none;
}
.dp-toast.show{display:block}
.dp-toast.success{background:#087f5b}
.dp-toast.error{background:#c83e3e}
.dp-view-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}
.dp-view-cell{padding:11px;border:1px solid var(--dp-border);border-radius:9px;min-width:0}
.dp-view-cell .dp-label{margin-bottom:5px}
.dp-view-cell .dp-value{font-size:13px;overflow-wrap:anywhere}
@media(max-width:850px){.dp-details{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){
  body{padding:12px}
  .dp-header{align-items:flex-start}
  .dp-title h2{font-size:19px}
  .dp-title p{font-size:11px;line-height:1.5}
  .dp-refresh{padding:10px 12px;font-size:11px}
  .dp-stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .dp-stat{padding:12px;border-radius:10px}
  .dp-stat:last-child{grid-column:1/-1}
  .dp-stat-label{font-size:10px}
  .dp-stat-value{font-size:19px}
  .dp-toolbar{padding:11px;gap:9px}
  .dp-search{min-width:100%}
  .dp-search input{height:42px;font-size:12px}
  .dp-count{width:100%;font-size:11px}
  .dp-item{padding:13px;border-radius:11px}
  .dp-user-name{font-size:14px}
  .dp-id{font-size:10px;line-height:1.6}
  .dp-details{gap:13px 10px;padding:13px 0}
  .dp-label{font-size:9px}
  .dp-value{font-size:11px}
  .dp-amount{font-size:14px}
  .dp-actions{margin-top:13px}
  .dp-actions button{flex:1;min-width:90px;min-height:42px;padding:9px 7px}
  .dp-modal{padding:19px}
  .dp-modal-actions button{flex:1;padding:12px 8px}
  .dp-toast{left:12px;right:12px;bottom:12px;text-align:center}
  .dp-view-grid{gap:9px}
}
@media(max-width:350px){
  .dp-details{grid-template-columns:1fr 1fr}
  .dp-title h2{font-size:17px}
  .dp-refresh{padding:9px}
  .dp-actions{gap:5px}
  .dp-actions button{font-size:10px}
}
</style>
</head>

<body>
<div class="dp-container">
  <header class="dp-header">
    <div class="dp-title">
      <h2>Deleted Payment History</h2>
      <p>View, restore and permanently delete payment records.</p>
    </div>
    <button class="dp-btn dp-refresh" id="refreshBtn">↻ Refresh</button>
  </header>

  <section class="dp-stats">
    <div class="dp-stat">
      <div class="dp-stat-label">Deleted Payments</div>
      <div class="dp-stat-value" id="totalDeleted">0</div>
    </div>
    <div class="dp-stat">
      <div class="dp-stat-label">Total Deleted Amount</div>
      <div class="dp-stat-value" id="totalAmount">0</div>
    </div>
    <div class="dp-stat">
      <div class="dp-stat-label">Showing Records</div>
      <div class="dp-stat-value" id="showingCount">0</div>
    </div>
  </section>

  <section class="dp-toolbar">
    <div class="dp-search">
      <input type="search" id="searchInput"
        placeholder="Search user, Payment ID, transaction ID...">
    </div>
    <div class="dp-count" id="resultLabel">Loading...</div>
  </section>

  <section class="dp-list" id="paymentList">
    <div class="dp-loading">Loading deleted payments...</div>
  </section>
</div>

<!-- ACTION CONFIRMATION MODAL -->
<div class="dp-overlay" id="confirmOverlay">
  <div class="dp-modal">
    <div class="dp-modal-icon" id="confirmIcon">!</div>
    <h3 id="confirmTitle">Confirm Action</h3>
    <p id="confirmMessage"></p>
    <div class="dp-modal-actions">
      <button class="dp-btn dp-cancel" id="cancelBtn">Cancel</button>
      <button class="dp-btn dp-confirm" id="confirmBtn">Confirm</button>
    </div>
  </div>
</div>

<!-- VIEW PAYMENT MODAL -->
<div class="dp-overlay" id="viewOverlay">
  <div class="dp-modal" style="max-width:600px">
    <h3>Payment Details</h3>
    <p>Complete information about this deleted payment.</p>
    <div class="dp-view-grid" id="viewDetails"></div>
    <div class="dp-modal-actions">
      <button class="dp-btn dp-cancel" id="closeViewBtn">Close</button>
    </div>
  </div>
</div>

<div class="dp-toast" id="toast"></div>

<script>
"use strict";

const PAYMENT_API =
"https://script.google.com/macros/s/AKfycbwTP0v21FArPYP3SN2Ch2gTBXTplbkRDDu49iAp4C5mSEN0BAxxmtlAPJxGXRSIaF-p/exec";

let deletedPayments = [];
let pendingAction = null;
let busy = false;
let jsonpCounter = 0;

const $ = id => document.getElementById(id);

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g,char=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  })[char]);
}

/* Keep the theme variables connected to the parent index page.
   This supports a parent page that supplies --primary, --bg,
   --card, --text, --muted and --border. */
function syncParentTheme(){
  try{
    if(window.parent === window) return;
    const root = getComputedStyle(window.parent.document.documentElement);
    const names = ["primary","accent","bg","card","text","muted","border"];
    names.forEach(name=>{
      const value = root.getPropertyValue("--"+name).trim();
      if(value) document.documentElement.style.setProperty("--"+name,value);
    });
  }catch(e){}
}
syncParentTheme();
try{
  if(window.parent !== window){
    const observer = new MutationObserver(syncParentTheme);
    observer.observe(window.parent.document.documentElement,{
      attributes:true,attributeFilter:["class","style"]
    });
    observer.observe(window.parent.document.body,{
      attributes:true,attributeFilter:["class","style"]
    });
  }
}catch(e){}

/* JSONP request works with Apps Script redirects and CORS restrictions. */
function jsonpRequest(params){
  return new Promise((resolve,reject)=>{
    const callback = "__dpCallback" + Date.now() + (++jsonpCounter);
    const script = document.createElement("script");
    const url = new URL(PAYMENT_API);
    let finished = false;

    Object.entries(params).forEach(([key,value])=>{
      if(value !== undefined && value !== null && value !== ""){
        url.searchParams.set(key,String(value));
      }
    });
    url.searchParams.set("callback",callback);
    url.searchParams.set("_",String(Date.now()));

    const timer = setTimeout(()=>{
      finish(new Error("API request timed out. Check Apps Script deployment."));
    },25000);

    function finish(error,data){
      if(finished) return;
      finished = true;
      clearTimeout(timer);
      script.onerror = null;
      script.remove();
      try{delete window[callback]}catch(e){window[callback]=undefined}
      if(error) return reject(error);
      if(!data || data.success !== true){
        return reject(new Error(data?.message || "API request failed."));
      }
      resolve(data);
    }

    window[callback] = data => finish(null,data);
    script.onerror = ()=>finish(new Error("Cannot connect to Payment API."));
    script.src = url.toString();
    document.head.appendChild(script);
  });
}

function apiGet(api){
  return jsonpRequest({api});
}

function apiAction(action,paymentId){
  return jsonpRequest({action,paymentId});
}

let toastTimer;
function showToast(message,type=""){
  const el = $("toast");
  el.textContent = message;
  el.className = "dp-toast show " + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.className="dp-toast",3500);
}

function money(value,currency){
  const amount = Number(value || 0).toLocaleString("en-US",{
    maximumFractionDigits:2
  });
  return amount + (currency ? " " + currency : "");
}

function updateStats(){
  $("totalDeleted").textContent = deletedPayments.length.toLocaleString("en-US");

  /* Amounts in different currencies are not combined into one false total. */
  const totals = {};
  deletedPayments.forEach(item=>{
    const code = String(item.currencyCode || "").trim() || "Amount";
    totals[code] = (totals[code] || 0) + Number(item.amount || 0);
  });

  const totalText = Object.entries(totals).map(([code,amount])=>
    money(amount,code === "Amount" ? "" : code)
  ).join(" · ");

  $("totalAmount").textContent = totalText || "0";
}

async function loadDeletedPayments(){
  if(busy) return;
  const refresh = $("refreshBtn");
  refresh.disabled = true;
  refresh.textContent = "Loading...";
  $("paymentList").innerHTML =
    '<div class="dp-loading">Loading deleted payments...</div>';

  try{
    const result = await apiGet("deletedPayments");
    deletedPayments = Array.isArray(result.deletedPayments)
      ? result.deletedPayments : [];
    updateStats();
    renderPayments();
  }catch(error){
    console.error(error);
    $("paymentList").innerHTML =
      '<div class="dp-error">'+escapeHTML(error.message)+'</div>';
    $("resultLabel").textContent = "Loading failed";
    showToast(error.message,"error");
  }finally{
    refresh.disabled = false;
    refresh.textContent = "↻ Refresh";
  }
}

function getFilteredPayments(){
  const query = $("searchInput").value.trim().toLowerCase();
  if(!query) return deletedPayments;

  return deletedPayments.filter(item=>{
    const content = [
      item.paymentId,item.userId,item.userName,item.transactionId,
      item.paymentMethod,item.currencyCode,item.paymentDate,
      item.deletedAt,item.comment
    ].join(" ").toLowerCase();
    return content.includes(query);
  });
}

function renderPayments(){
  const list = $("paymentList");
  const records = getFilteredPayments();

  $("showingCount").textContent = records.length.toLocaleString("en-US");
  $("resultLabel").textContent =
    records.length + " of " + deletedPayments.length + " records";

  if(!records.length){
    list.innerHTML = '<div class="dp-empty">'+
      (deletedPayments.length
        ? "No matching payment records found."
        : "No deleted payments found.")+'</div>';
    return;
  }

  list.innerHTML = records.map((item,index)=>{
    const id = escapeHTML(item.paymentId || "");
    const amountText = money(item.amount,item.currencyCode || "");
    const safeIndex = deletedPayments.indexOf(item);

    return `
      <article class="dp-item">
        <div class="dp-item-head">
          <div>
            <div class="dp-user-name">${escapeHTML(item.userName || "Unknown User")}</div>
            <div class="dp-id">
              Payment ID: ${id || "—"}
              &nbsp; | &nbsp;
              User ID: ${escapeHTML(item.userId || "—")}
            </div>
          </div>
          <span class="dp-tag">DELETED</span>
        </div>

        <div class="dp-details">
          <div class="dp-detail">
            <div class="dp-label">Payment Amount</div>
            <div class="dp-amount">${escapeHTML(amountText)}</div>
          </div>
          <div class="dp-detail">
            <div class="dp-label">Payment Method</div>
            <div class="dp-value">${escapeHTML(item.paymentMethod || "—")}</div>
          </div>
          <div class="dp-detail">
            <div class="dp-label">Payment Date</div>
            <div class="dp-value">${escapeHTML(item.paymentDate || "—")}</div>
          </div>
          <div class="dp-detail">
            <div class="dp-label">Transaction ID</div>
            <div class="dp-value">${escapeHTML(item.transactionId || "—")}</div>
          </div>
          <div class="dp-detail">
            <div class="dp-label">Deleted At</div>
            <div class="dp-value">${escapeHTML(item.deletedAt || "—")}</div>
          </div>
        </div>

        ${item.comment
          ? `<div class="dp-comment">Comment: ${escapeHTML(item.comment)}</div>`
          : ""}

        <div class="dp-actions">
          <button class="dp-btn dp-view" onclick="viewPayment(${safeIndex})">View</button>
          <button class="dp-btn dp-restore" onclick="askAction('restore',${safeIndex})">Restore</button>
          <button class="dp-btn dp-delete" onclick="askAction('delete',${safeIndex})">Permanently Delete</button>
        </div>
      </article>
    `;
  }).join("");
}

window.viewPayment = function(index){
  const item = deletedPayments[index];
  if(!item) return;

  const fields = [
    ["Payment ID",item.paymentId],
    ["User ID",item.userId],
    ["User Name",item.userName],
    ["Payment Amount",money(item.amount,item.currencyCode)],
    ["Currency",item.currencyCode],
    ["Payment Method",item.paymentMethod],
    ["Transaction ID",item.transactionId],
    ["Payment Date",item.paymentDate],
    ["Deleted At",item.deletedAt],
    ["Comment",item.comment]
  ];

  $("viewDetails").innerHTML = fields.map(([label,value])=>`
    <div class="dp-view-cell">
      <div class="dp-label">${escapeHTML(label)}</div>
      <div class="dp-value">${escapeHTML(value || "—")}</div>
    </div>
  `).join("");

  $("viewOverlay").classList.add("show");
};

function closeView(){
  $("viewOverlay").classList.remove("show");
}

function askAction(type,index){
  const item = deletedPayments[index];
  if(!item || !item.paymentId){
    showToast("Payment ID not found. Refresh and try again.","error");
    return;
  }

  pendingAction = {
    type,
    paymentId:String(item.paymentId)
  };

  if(type === "restore"){
    $("confirmIcon").textContent = "↶";
    $("confirmTitle").textContent = "Restore Payment?";
    $("confirmMessage").textContent =
      "This payment will be moved back to PAYMENT HISTORY and will appear with the active payment records.";
    $("confirmBtn").textContent = "Restore Payment";
    $("confirmBtn").className = "dp-btn dp-restore";
  }else{
    $("confirmIcon").textContent = "!";
    $("confirmTitle").textContent = "Permanent Delete?";
    $("confirmMessage").textContent =
      "This payment will be permanently removed from DELETE HISTORY. This action cannot be undone.";
    $("confirmBtn").textContent = "Permanently Delete";
    $("confirmBtn").className = "dp-btn dp-confirm";
  }

  $("confirmOverlay").classList.add("show");
}

function closeConfirm(){
  if(busy) return;
  pendingAction = null;
  $("confirmOverlay").classList.remove("show");
}

async function executeAction(){
  if(!pendingAction || busy) return;

  busy = true;
  const action = pendingAction.type === "restore"
    ? "restorePayment"
    : "permanentDeletePayment";
  const paymentId = pendingAction.paymentId;

  $("confirmBtn").disabled = true;
  $("cancelBtn").disabled = true;
  $("confirmBtn").textContent =
    pendingAction.type === "restore" ? "Restoring..." : "Deleting...";

  try{
    const result = await apiAction(action,paymentId);

    $("confirmOverlay").classList.remove("show");
    pendingAction = null;

    showToast(
      result.message || (action === "restorePayment"
        ? "Payment restored successfully."
        : "Payment permanently deleted."),
      "success"
    );

    await loadDeletedPayments();
  }catch(error){
    console.error(error);
    showToast(error.message || "Operation failed.","error");
  }finally{
    busy = false;
    $("confirmBtn").disabled = false;
    $("cancelBtn").disabled = false;
    $("confirmBtn").textContent = "Confirm";
  }
}

$("refreshBtn").addEventListener("click",loadDeletedPayments);
$("searchInput").addEventListener("input",renderPayments);
$("cancelBtn").addEventListener("click",closeConfirm);
$("confirmBtn").addEventListener("click",executeAction);
$("closeViewBtn").addEventListener("click",closeView);

$("confirmOverlay").addEventListener("click",event=>{
  if(event.target === $("confirmOverlay")) closeConfirm();
});
$("viewOverlay").addEventListener("click",event=>{
  if(event.target === $("viewOverlay")) closeView();
});

loadDeletedPayments();
</script>
</body>
</html>
