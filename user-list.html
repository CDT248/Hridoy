
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User List</title>

<style>
:root {
  --bg: #ffffff;
  --text: #171717;
  --muted: #777777;
  --border: #e5e5e5;
  --soft: #f7f7f7;
  --black: #171717;
  --green: #16834b;
  --red: #dc3545;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 25px;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
}

.container {
  width: 100%;
  max-width: 1500px;
  margin: auto;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  flex-wrap: wrap;
  margin-bottom: 25px;
}

.header h2 {
  margin: 0;
  font-size: 25px;
  font-weight: 750;
}

.header p {
  margin: 7px 0 0;
  font-size: 13px;
  color: var(--muted);
}

button {
  cursor: pointer;
  font-family: inherit;
}

.btn {
  padding: 11px 16px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: white;
  color: var(--text);
  font-size: 13px;
  font-weight: 650;
}

.btn-black {
  background: var(--black);
  color: white;
  border-color: var(--black);
}

.btn-black:hover {
  background: #333;
}

.btn-danger {
  color: var(--red);
  border-color: #f1c6ca;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  margin-bottom: 20px;
}

.stat-card {
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 18px;
  background: white;
}

.stat-card small {
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
}

.stat-card h2 {
  margin: 9px 0 0;
  font-size: 27px;
}

.panel {
  border: 1px solid var(--border);
  border-radius: 13px;
  overflow: hidden;
  background: white;
}

.toolbar {
  display: flex;
  gap: 10px;
  padding: 15px;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}

.search {
  flex: 1;
  min-width: 220px;
}

.search input,
select {
  width: 100%;
  height: 42px;
  padding: 0 13px;
  border: 1px solid var(--border);
  border-radius: 8px;
  outline: none;
  background: white;
  color: var(--text);
  font-size: 13px;
}

.search input:focus,
select:focus {
  border-color: #555;
}

.filter {
  width: 155px;
}

.table-wrap {
  width: 100%;
  overflow-x: auto;
}

table {
  width: 100%;
  min-width: 850px;
  border-collapse: collapse;
}

th {
  padding: 14px;
  background: var(--soft);
  color: var(--muted);
  text-align: left;
  font-size: 11px;
  text-transform: uppercase;
  white-space: nowrap;
}

td {
  padding: 13px 14px;
  border-top: 1px solid var(--border);
  font-size: 13px;
}

tr:hover td {
  background: #fafafa;
}

.user-info {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 175px;
}

.avatar {
  height: 38px;
  width: 38px;
  border-radius: 50%;
  background: #eeeeee;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  overflow: hidden;
  flex-shrink: 0;
}

.avatar img {
  height: 100%;
  width: 100%;
  object-fit: cover;
}

.user-name {
  font-weight: 700;
}

.user-id {
  color: var(--muted);
  font-size: 11px;
  margin-top: 4px;
}

.status {
  display: inline-block;
  padding: 5px 10px;
  border-radius: 20px;
  background: #e9f7ee;
  color: var(--green);
  font-size: 11px;
  font-weight: bold;
}

.status.inactive {
  background: #f0f0f0;
  color: #777;
}

.actions {
  display: flex;
  gap: 7px;
}

.action-btn {
  width: 33px;
  height: 33px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: white;
  color: #222;
}

.action-btn.delete {
  color: var(--red);
  border-color: #f1c6ca;
}

.empty {
  text-align: center;
  padding: 40px;
  color: var(--muted);
}

.footer {
  padding: 15px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.count {
  color: var(--muted);
  font-size: 12px;
}

.pagination {
  display: flex;
  gap: 5px;
}

.page-btn {
  min-width: 35px;
  height: 34px;
  padding: 0 9px;
  border: 1px solid var(--border);
  background: white;
  border-radius: 7px;
  color: var(--text);
}

.page-btn.active {
  background: var(--black);
  color: white;
  border-color: var(--black);
}

.page-btn:disabled {
  opacity: .4;
  cursor: not-allowed;
}

.loading {
  padding: 35px;
  text-align: center;
  color: var(--muted);
}

.modal-bg {
  position: fixed;
  inset: 0;
  background: #0008;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 15px;
  z-index: 9999;
}

.modal {
  background: white;
  padding: 25px;
  border-radius: 13px;
  width: 100%;
  max-width: 390px;
}

.modal h3 {
  margin: 0 0 10px;
}

.modal p {
  color: #777;
  font-size: 13px;
  line-height: 1.5;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 20px;
}

.toast {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #171717;
  color: white;
  padding: 13px 18px;
  border-radius: 9px;
  display: none;
  z-index: 10000;
  font-size: 13px;
}

@media(max-width:650px) {
  body { padding: 15px; }
  .stats { gap: 8px; }
  .stat-card { padding: 13px; }
  .stat-card h2 { font-size: 22px; }
  .header h2 { font-size: 22px; }
}

@media(max-width:420px) {
  .stats { grid-template-columns: 1fr 1fr; }
  .stat-card:last-child { grid-column: 1/-1; }
  .header .btn { width: 100%; }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div>
      <h2>User List</h2>
      <p>Manage all registered user accounts</p>
    </div>

    <button class="btn btn-black" onclick="goAddUser()">
      + Add New User
    </button>
  </div>

  <div class="stats">
    <div class="stat-card">
      <small>Total Users</small>
      <h2 id="totalUsers">0</h2>
    </div>

    <div class="stat-card">
      <small>Active Users</small>
      <h2 id="activeUsers">0</h2>
    </div>

    <div class="stat-card">
      <small>Inactive Users</small>
      <h2 id="inactiveUsers">0</h2>
    </div>
  </div>

  <div class="panel">

    <div class="toolbar">

      <div class="search">
        <input
          type="search"
          id="searchInput"
          placeholder="Search name, ID, phone, Gmail or area..."
        >
      </div>

      <div class="filter">
        <select id="statusFilter">
          <option value="all">All Status</option>
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>
      </div>

      <button class="btn" onclick="loadUsers()">↻ Refresh</button>

    </div>

    <div class="table-wrap">

      <table>
        <thead>
          <tr>
            <th>User</th>
            <th>Phone</th>
            <th>Gmail</th>
            <th>Area</th>
            <th>Active Date</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody id="userTable">
          <tr>
            <td colspan="7" class="loading">Loading users...</td>
          </tr>
        </tbody>
      </table>

    </div>

    <div class="footer">
      <div class="count" id="showCount">
        Showing 0–0 of 0 users
      </div>

      <div class="pagination" id="pagination"></div>
    </div>

  </div>

</div>

<div class="modal-bg" id="deleteModal">
  <div class="modal">
    <h3>Delete User?</h3>
    <p>
      This user will be moved to the Deleted Users section.
      You can restore the account later.
    </p>

    <div class="modal-actions">
      <button class="btn" onclick="closeDelete()">Cancel</button>
      <button class="btn btn-danger" id="confirmDeleteBtn" onclick="confirmDelete()">
        Delete User
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =====================================
   API CONFIGURATION
===================================== */

const API_URL =
'https://script.google.com/macros/s/AKfycbzlabjyglodpoiPmupmA2buZqMyFiSPScIrTPm0T8Il7Z7bKtAkZglsfDk9WZAFOHgk/exec';

const PAGE_SIZE = 10;

let users = [];
let currentPage = 1;
let selectedDeleteId = null;


/* =====================================
   HELPERS
===================================== */

function getValue(obj, ...keys) {
  for (const key of keys) {
    if (obj && obj[key] !== undefined && obj[key] !== null) {
      return obj[key];
    }
  }
  return '';
}

function escapeHTML(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[char]));
}

function isUserActive(user) {
  const status = String(
    getValue(user, 'status', 'Status') || 'Active'
  ).toLowerCase();

  return ['active', 'enabled', 'true', '1'].includes(status);
}

function showToast(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.style.display = 'block';

  clearTimeout(window.userToastTimer);

  window.userToastTimer = setTimeout(() => {
    toast.style.display = 'none';
  }, 3000);
}


/* =====================================
   NAVIGATION
===================================== */

function goAddUser() {
  window.__wageEditUserId = null;

  if (typeof window.loadPage === 'function') {
    window.loadPage('add-user');
  } else {
    window.location.href = 'add-user.html';
  }
}

function editUser(userId) {
  const user = users.find(u =>
    String(getValue(u, 'userId', 'User ID', 'userID')) === String(userId)
  );

  if (!user) {
    showToast('User not found');
    return;
  }

  window.__wageEditUserId = userId;

  if (typeof window.loadPage === 'function') {
    window.loadPage('add-user');
  } else {
    window.location.href =
      'add-user.html?userId=' + encodeURIComponent(userId);
  }
}


/* =====================================
   LOAD USERS
===================================== */

async function loadUsers() {
  const table = document.getElementById('userTable');

  table.innerHTML = `
    <tr>
      <td colspan="7" class="loading">Loading users...</td>
    </tr>
  `;

  try {
    const response = await fetch(
      API_URL + '?api=active&t=' + Date.now(),
      { cache: 'no-store' }
    );

    if (!response.ok) {
      throw new Error('Server connection failed');
    }

    const data = await response.json();

    users = Array.isArray(data)
      ? data
      : (data.users || data.data || []);

    if (!Array.isArray(users)) {
      users = [];
    }

    currentPage = 1;
    renderUsers();

  } catch (error) {
    table.innerHTML = `
      <tr>
        <td colspan="7" class="empty">
          Unable to load users. Please check API connection.
        </td>
      </tr>
    `;

    showToast(error.message || 'Failed to load users');
  }
}


/* =====================================
   FILTER USERS
===================================== */

function getFilteredUsers() {
  const search = document
    .getElementById('searchInput')
    .value.trim().toLowerCase();

  const filter = document
    .getElementById('statusFilter').value;

  return users.filter(user => {

    const active = isUserActive(user);

    if (filter === 'active' && !active) return false;
    if (filter === 'inactive' && active) return false;

    const searchText = [
      getValue(user, 'userId', 'User ID', 'userID'),
      getValue(user, 'userName', 'User Name', 'name'),
      getValue(user, 'phone', 'Phone'),
      getValue(user, 'gmail', 'Gmail', 'email'),
      getValue(user, 'area', 'Area')
    ].join(' ').toLowerCase();

    return !search || searchText.includes(search);
  });
}


/* =====================================
   RENDER USERS
===================================== */

function renderUsers() {

  const activeCount = users.filter(isUserActive).length;

  document.getElementById('totalUsers').textContent = users.length;
  document.getElementById('activeUsers').textContent = activeCount;
  document.getElementById('inactiveUsers').textContent =
    users.length - activeCount;

  const filtered = getFilteredUsers();

  const total = filtered.length;
  const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));

  if (currentPage > totalPages) {
    currentPage = totalPages;
  }

  const start = (currentPage - 1) * PAGE_SIZE;
  const pageUsers = filtered.slice(start, start + PAGE_SIZE);

  const table = document.getElementById('userTable');

  if (!pageUsers.length) {
    table.innerHTML = `
      <tr>
        <td colspan="7" class="empty">No users found.</td>
      </tr>
    `;
  } else {

    table.innerHTML = pageUsers.map(user => {

      const id = getValue(user, 'userId', 'User ID', 'userID');
      const name = getValue(user, 'userName', 'User Name', 'name') || 'Unnamed User';
      const phone = getValue(user, 'phone', 'Phone');
      const gmail = getValue(user, 'gmail', 'Gmail', 'email');
      const area = getValue(user, 'area', 'Area');
      const date = getValue(user, 'activeDate', 'Active Date', 'active_date');
      const picture = getValue(user, 'profilePicture', 'Profile Picture', 'profile_picture');
      const active = isUserActive(user);

      const initial = escapeHTML(
        String(name).trim().charAt(0).toUpperCase() || 'U'
      );

      const avatar = picture
        ? `<img src="${escapeHTML(picture)}" alt=""
             onerror="this.parentElement.textContent='${initial}'">`
        : initial;

      return `
        <tr>
          <td>
            <div class="user-info">
              <div class="avatar">${avatar}</div>
              <div>
                <div class="user-name">${escapeHTML(name)}</div>
                <div class="user-id">ID: ${escapeHTML(id || '—')}</div>
              </div>
            </div>
          </td>

          <td>${escapeHTML(phone || '—')}</td>
          <td>${escapeHTML(gmail || '—')}</td>
          <td>${escapeHTML(area || '—')}</td>
          <td>${escapeHTML(date || '—')}</td>

          <td>
            <span class="status ${active ? '' : 'inactive'}">
              ${active ? '● Active' : '● Inactive'}
            </span>
          </td>

          <td>
            <div class="actions">
              <button class="action-btn"
                title="Edit"
                onclick="editUser('${escapeHTML(id)}')">✎</button>

              <button class="action-btn delete"
                title="Delete"
                onclick="openDelete('${escapeHTML(id)}')">⌫</button>
            </div>
          </td>
        </tr>
      `;

    }).join('');
  }

  document.getElementById('showCount').textContent =
    total
      ? `Showing ${start + 1}–${Math.min(start + PAGE_SIZE, total)} of ${total} users`
      : 'Showing 0–0 of 0 users';

  renderPagination(totalPages);
}


/* =====================================
   PAGINATION
===================================== */

function renderPagination(totalPages) {

  const pagination = document.getElementById('pagination');

  pagination.innerHTML = '';

  function addButton(label, page, disabled, active) {

    const button = document.createElement('button');

    button.className = 'page-btn' + (active ? ' active' : '');
    button.textContent = label;
    button.disabled = disabled;

    button.onclick = () => {
      currentPage = page;
      renderUsers();
    };

    pagination.appendChild(button);
  }

  addButton('‹', currentPage - 1, currentPage === 1, false);

  let first = Math.max(1, currentPage - 2);
  let last = Math.min(totalPages, first + 4);

  first = Math.max(1, last - 4);

  for (let page = first; page <= last; page++) {
    addButton(
      page,
      page,
      false,
      page === currentPage
    );
  }

  addButton(
    '›',
    currentPage + 1,
    currentPage === totalPages,
    false
  );
}


/* =====================================
   DELETE USER
===================================== */

function openDelete(userId) {
  selectedDeleteId = userId;
  document.getElementById('deleteModal').style.display = 'flex';
}

function closeDelete() {
  selectedDeleteId = null;
  document.getElementById('deleteModal').style.display = 'none';
}

async function confirmDelete() {

  if (!selectedDeleteId) return;

  const button = document.getElementById('confirmDeleteBtn');

  button.disabled = true;
  button.textContent = 'Deleting...';

  try {

    const response = await fetch(API_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'text/plain;charset=utf-8'
      },
      body: JSON.stringify({
        action: 'deleteUser',
        userId: selectedDeleteId
      })
    });

    const result = await response.json();

    if (result.success === false || result.error) {
      throw new Error(
        result.message || result.error || 'Delete failed'
      );
    }

    closeDelete();

    showToast(result.message || 'User moved to Deleted Users');

    await loadUsers();

  } catch (error) {

    showToast(error.message || 'Could not delete user');

  } finally {

    button.disabled = false;
    button.textContent = 'Delete User';

  }
}


/* =====================================
   SEARCH & FILTER EVENTS
===================================== */

document.getElementById('searchInput')
  .addEventListener('input', () => {
    currentPage = 1;
    renderUsers();
  });

document.getElementById('statusFilter')
  .addEventListener('change', () => {
    currentPage = 1;
    renderUsers();
  });


/* =====================================
   START
===================================== */

loadUsers();

</script>

</body>
</html>
