
<style>
.ul-page{width:100%}
.ul-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.ul-head h2{font-size:21px}
.ul-head p{font-size:12px;color:var(--muted);margin-top:5px}
.ul-btn{padding:10px 15px;border:0;border-radius:8px;background:var(--primary);color:white;font-size:12px;font-weight:700;cursor:pointer}
.ul-card{background:var(--card);border:1px solid var(--border);border-radius:13px;overflow:hidden;box-shadow:var(--shadow)}
.ul-toolbar{padding:16px;border-bottom:1px solid var(--border)}
.ul-search{width:100%;max-width:350px;padding:11px 13px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);outline:none;font-size:13px}
.ul-table-wrap{width:100%;overflow-x:auto}
.ul-table{width:100%;border-collapse:collapse;min-width:850px}
.ul-table th{background:var(--bg);color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.5px;text-align:left;padding:14px}
.ul-table td{padding:13px 14px;border-top:1px solid var(--border);font-size:12px}
.ul-name{font-weight:800}
.ul-sub{font-size:10px;color:var(--muted);margin-top:4px}
.ul-avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--primary-light)}
.ul-user{display:flex;align-items:center;gap:10px}
.ul-actions{display:flex;gap:6px}
.ul-action{padding:7px 10px;border:0;border-radius:6px;font-size:10px;font-weight:700;cursor:pointer}
.ul-edit{background:#e8f1ff;color:#2463b5}
.ul-delete{background:#fff0f0;color:#d04444}
.ul-empty{text-align:center;padding:40px;color:var(--muted);font-size:13px}
.ul-status{background:#e8f7ef;color:#087f5b;padding:5px 8px;border-radius:20px;font-size:10px;font-weight:800}
.ul-count{font-size:11px;color:var(--muted);padding:12px 16px}
</style>

<div class="ul-page">

  <div class="ul-head">
    <div>
      <h2>User List</h2>
      <p>View, edit and delete active users</p>
    </div>

    <button class="ul-btn" onclick="window.loadPage('add-user')">
      + Add New User
    </button>
  </div>

  <div class="ul-card">

    <div class="ul-toolbar">
      <input id="ulSearch" class="ul-search"
        placeholder="Search name, ID, phone, Gmail or area...">
    </div>

    <div class="ul-table-wrap">
      <table class="ul-table">
        <thead>
          <tr>
            <th>User</th>
            <th>User ID</th>
            <th>Phone</th>
            <th>Gmail</th>
            <th>Area</th>
            <th>Active Date</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody id="ulBody">
          <tr>
            <td colspan="8" class="ul-empty">Loading users...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="ul-count" id="ulCount">Loading...</div>

  </div>

</div>

<script>
(function(){

  const API_URL =
    "https://script.google.com/macros/s/AKfycbzlabjyglodpoiPmupmA2buZqMyFiSPScIrTPm0T8Il7Z7bKtAkZglsfDk9WZAFOHgk/exec";

  const body = document.getElementById("ulBody");
  const search = document.getElementById("ulSearch");
  const count = document.getElementById("ulCount");

  let users = [];

  function escapeHTML(value){

    return String(value == null ? "" : value)
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#039;");

  }

  function render(list){

    count.textContent = "Total Active Users: " + list.length;

    if(!list.length){

      body.innerHTML = `
        <tr>
          <td colspan="8" class="ul-empty">
            No users found
          </td>
        </tr>
      `;

      return;

    }

    body.innerHTML = list.map(function(u){

      const avatar = u.profilePicture
        ? `<img class="ul-avatar" src="${escapeHTML(u.profilePicture)}" onerror="this.style.display='none'">`
        : `<div class="ul-avatar"></div>`;

      return `
        <tr>

          <td>
            <div class="ul-user">
              ${avatar}
              <div>
                <div class="ul-name">${escapeHTML(u.userName)}</div>
                <div class="ul-sub">${escapeHTML(u.comment)}</div>
              </div>
            </div>
          </td>

          <td>${escapeHTML(u.userId)}</td>

          <td>${escapeHTML(u.phone)}</td>

          <td>${escapeHTML(u.gmail)}</td>

          <td>${escapeHTML(u.area)}</td>

          <td>${escapeHTML(u.activeDate)}</td>

          <td><span class="ul-status">Active</span></td>

          <td>
            <div class="ul-actions">

              <button class="ul-action ul-edit"
                data-edit="${escapeHTML(u.userId)}">
                Edit
              </button>

              <button class="ul-action ul-delete"
                data-delete="${escapeHTML(u.userId)}">
                Delete
              </button>

            </div>
          </td>

        </tr>
      `;

    }).join("");

  }


  async function loadUsers(){

    body.innerHTML = `
      <tr><td colspan="8" class="ul-empty">Loading users...</td></tr>
    `;

    try{

      const response = await fetch(API_URL + "?api=active");

      const result = await response.json();

      if(!result.success){
        throw new Error(result.message || "Could not load users");
      }

      users = result.users || [];

      render(users);

    }catch(error){

      body.innerHTML = `
        <tr>
          <td colspan="8" class="ul-empty">
            ${escapeHTML(error.message)}
          </td>
        </tr>
      `;

      count.textContent = "Unable to load users";

    }

  }


  search.addEventListener("input",function(){

    const keyword = this.value.toLowerCase().trim();

    const filtered = users.filter(function(u){

      return [
        u.userId,
        u.userName,
        u.phone,
        u.gmail,
        u.area,
        u.comment
      ].some(function(v){

        return String(v || "")
          .toLowerCase()
          .includes(keyword);

      });

    });

    render(filtered);

  });


  body.addEventListener("click",async function(e){

    const editButton = e.target.closest("[data-edit]");

    const deleteButton = e.target.closest("[data-delete]");


    if(editButton){

      const id = editButton.dataset.edit;

      window.__wageEditUserId = id;

      window.loadPage("add-user");

      return;

    }


    if(deleteButton){

      const id = deleteButton.dataset.delete;

      const confirmed = confirm(
        "Are you sure you want to move this user to Deleted Users?"
      );

      if(!confirmed) return;

      deleteButton.disabled = true;
      deleteButton.textContent = "Deleting...";

      try{

        const response = await fetch(API_URL,{
          method:"POST",
          body:JSON.stringify({
            action:"delete",
            userId:id
          })
        });

        const result = await response.json();

        if(!result.success){
          throw new Error(result.message || "Delete failed");
        }

        alert(result.message);

        await loadUsers();

      }catch(error){

        alert(error.message);

        deleteButton.disabled = false;
        deleteButton.textContent = "Delete";

      }

    }

  });


  loadUsers();

})();
</script>
