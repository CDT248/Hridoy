
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Payment Method Settings</title>
<style>
#methodPage{font-family:inherit;color:var(--text,#172033);max-width:1100px;margin:auto}
#methodPage *{box-sizing:border-box}
#methodPage .hero{padding:24px;border-radius:18px;color:#fff;background:linear-gradient(120deg,#4338ca,#6366f1,#8b5cf6);margin-bottom:20px}
#methodPage .hero h2{margin:0 0 7px;color:#fff;font-size:24px}
#methodPage .hero p{margin:0;color:#e0e7ff;font-size:13px}
#methodPage .card{background:var(--card,#fff);border:1px solid var(--border,#e5e7eb);border-radius:16px;padding:21px;margin-bottom:20px;box-shadow:0 7px 25px #00000008}
#methodPage .card h3{font-size:17px;margin:0 0 18px}
#methodPage label{display:block;font-size:12px;font-weight:700;margin-bottom:8px}
#methodPage input{width:100%;height:46px;padding:11px 13px;border-radius:10px;border:1px solid var(--border,#ddd);background:var(--bg,#f8fafc);color:var(--text,#172033);font:inherit;outline:none}
#methodPage input:focus{border-color:#6366f1;box-shadow:0 0 0 3px #6366f11c}
#methodPage .formrow{display:flex;gap:12px;align-items:end}
#methodPage .formrow .field{flex:1}
#methodPage .btn{border:0;border-radius:9px;padding:12px 17px;font-weight:800;cursor:pointer;font:inherit}
#methodPage .primary{background:linear-gradient(120deg,#4338ca,#7c3aed);color:white}
#methodPage .secondary{background:var(--bg,#f1f5f9);color:var(--text,#172033);border:1px solid var(--border,#ddd)}
#methodPage .danger{background:#fee2e2;color:#b91c1c}
#methodPage button:disabled{opacity:.55;cursor:not-allowed}
#methodPage .formactions{display:flex;gap:10px;margin-top:17px;flex-wrap:wrap}
#methodPage .toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:15px}
#methodPage .search{max-width:330px;flex:1}
#methodPage .tablewrap{overflow-x:auto}
#methodPage table{width:100%;border-collapse:collapse;min-width:550px}
#methodPage th,#methodPage td{text-align:left;padding:14px 12px;border-bottom:1px solid var(--border,#ddd);font-size:13px}
#methodPage th{color:var(--muted,#777);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
#methodPage .pill{display:inline-block;padding:5px 10px;border-radius:20px;background:#dcfce7;color:#166534;font-size:11px;font-weight:800}
#methodPage .actions{display:flex;gap:7px}
#methodPage .actions button{padding:7px 10px;font-size:11px}
#methodPage .message{display:none;padding:12px;border-radius:10px;margin-bottom:15px;font-size:13px}
#methodPage .message.success{display:block;background:#dcfce7;color:#166534}
#methodPage .message.error{display:block;background:#fee2e2;color:#991b1b}
#methodPage .empty{text-align:center;padding:30px;color:var(--muted,#888)}
#methodPage .count{font-size:12px;color:var(--muted,#888)}
@media(max-width:600px){#methodPage .formrow{flex-direction:column;align-items:stretch}#methodPage .formrow .field{width:100%}#methodPage .card{padding:15px}#methodPage .hero h2{font-size:21px}}
</style>
</head>
<body>
<div id="methodPage">

  <div class="hero">
    <h2>💳 Payment Method Settings</h2>
    <p>Add, edit and manage your payment methods.</p>
  </div>

  <div class="card">
    <h3 id="metFormTitle">＋ Add New Payment Method</h3>
    <div id="metMessage" class="message"></div>

    <form id="metForm">
      <div class="formrow">
        <div class="field">
          <label>Payment Method Name *</label>
          <input id="metName" type="text" required maxlength="100" placeholder="Example: Cash, bKash, Bank, Nagad">
        </div>
        <button class="btn primary" type="submit" id="metSave">＋ Add Method</button>
      </div>

      <div class="formactions">
        <button class="btn secondary" type="button" id="metCancel" style="display:none">Cancel Edit</button>
      </div>
    </form>
  </div>

  <div class="card">
    <div class="toolbar">
      <div>
        <h3 style="margin:0 0 5px">Payment Method List</h3>
        <div class="count" id="metCount">Loading...</div>
      </div>
      <input class="search" id="metSearch" placeholder="Search payment method...">
      <button class="btn secondary" type="button" id="metRefresh">↻ Refresh</button>
    </div>

    <div id="metTableMessage" class="message"></div>

    <div class="tablewrap">
      <table>
        <thead>
          <tr>
            <th>Payment Method</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="metRows">
          <tr><td colspan="3" class="empty">Loading methods...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script>
(function(){
  const root=document.getElementById("methodPage");
  if(root.dataset.ready==="1")return;
  root.dataset.ready="1";

  const API="https://script.google.com/macros/s/AKfycbygdxmo_sur5KYs3XhYHnyaMGQQ_G5_Prc9NUozP9dxRVhrwVmezX2ozhkhqQ4KeWKxPQ/exec";
  const $=id=>root.querySelector("#"+id);

  let methods=[];
  let editingId=null;
  let busy=false;

  function escapeHTML(value){
    return String(value??"").replace(/[&<>"']/g,c=>({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
  }

  function showMessage(id,text,type){
    $(id).textContent=text;
    $(id).className="message "+type;
  }

  function hideMessage(id){
    $(id).textContent="";
    $(id).className="message";
  }

  async function get(api){
    const r=await fetch(API+"?api="+encodeURIComponent(api)+"&_="+Date.now(),{cache:"no-store"});
    if(!r.ok)throw Error("HTTP "+r.status);
    return r.json();
  }

  async function post(data){
    const r=await fetch(API,{
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify(data)
    });
    if(!r.ok)throw Error("HTTP "+r.status);
    return r.json();
  }

  async function loadMethods(){
    $("metRows").innerHTML='<tr><td colspan="3" class="empty">Loading...</td></tr>';
    try{
      const result=await get("methods");
      if(!result.success)throw Error(result.message||"Could not load methods");
      methods=result.methods||[];
      render();
    }catch(e){
      $("metRows").innerHTML='<tr><td colspan="3" class="empty">Failed to load: '+escapeHTML(e.message)+'</td></tr>';
      $("metCount").textContent="Unable to load methods";
    }
  }

  function render(){
    const q=$("metSearch").value.trim().toLowerCase();
    const list=methods.filter(x=>
      [x.name,x.status].join(" ").toLowerCase().includes(q)
    );

    $("metCount").textContent=list.length+" payment methods";

    if(!list.length){
      $("metRows").innerHTML='<tr><td colspan="3" class="empty">No payment method found.</td></tr>';
      return;
    }

    $("metRows").innerHTML=list.map(x=>`
      <tr>
        <td><strong>${escapeHTML(x.name)}</strong></td>
        <td><span class="pill">${escapeHTML(x.status||"Active")}</span></td>
        <td>
          <div class="actions">
            <button class="btn secondary" data-edit="${escapeHTML(x.methodId)}">Edit</button>
            <button class="btn danger" data-delete="${escapeHTML(x.methodId)}">Delete</button>
          </div>
        </td>
      </tr>
    `).join("");
  }

  function resetForm(){
    editingId=null;
    $("metForm").reset();
    $("metFormTitle").textContent="＋ Add New Payment Method";
    $("metSave").textContent="＋ Add Method";
    $("metCancel").style.display="none";
    hideMessage("metMessage");
  }

  $("metForm").addEventListener("submit",async e=>{
    e.preventDefault();
    if(busy)return;

    const name=$("metName").value.trim();

    if(!name){
      showMessage("metMessage","Payment Method Name দিতে হবে।","error");
      return;
    }

    const payload=editingId
      ?{action:"editMethod",methodId:editingId,name}
      :{action:"addMethod",name};

    busy=true;
    $("metSave").disabled=true;
    $("metSave").textContent="Saving...";

    try{
      const result=await post(payload);
      if(!result.success)throw Error(result.message||"Operation failed");

      showMessage("metMessage","✓ "+result.message,"success");
      resetForm();
      await loadMethods();
    }catch(err){
      showMessage("metMessage",err.message,"error");
    }finally{
      busy=false;
      $("metSave").disabled=false;
      $("metSave").textContent=editingId?"Save Changes":"＋ Add Method";
    }
  });

  $("metRows").addEventListener("click",async e=>{
    const edit=e.target.closest("[data-edit]");
    const del=e.target.closest("[data-delete]");

    if(edit){
      const item=methods.find(x=>String(x.methodId)===edit.dataset.edit);
      if(!item)return;

      editingId=item.methodId;
      $("metName").value=item.name||"";
      $("metFormTitle").textContent="✎ Edit Payment Method";
      $("metSave").textContent="Save Changes";
      $("metCancel").style.display="inline-block";
      hideMessage("metMessage");
      root.scrollIntoView({behavior:"smooth",block:"start"});
    }

    if(del){
      const item=methods.find(x=>String(x.methodId)===del.dataset.delete);
      if(!item)return;

      if(!confirm("Delete payment method: "+item.name+"?"))return;

      del.disabled=true;
      try{
        const result=await post({action:"deleteMethod",methodId:item.methodId});
        if(!result.success)throw Error(result.message||"Delete failed");
        showMessage("metTableMessage","✓ "+result.message,"success");
        await loadMethods();
      }catch(err){
        showMessage("metTableMessage",err.message,"error");
      }finally{
        del.disabled=false;
      }
    }
  });

  $("metCancel").addEventListener("click",resetForm);
  $("metRefresh").addEventListener("click",loadMethods);
  $("metSearch").addEventListener("input",render);

  loadMethods();
})();
</script>
</body>
</html>
