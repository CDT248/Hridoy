
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wage History</title>

<style>
#pageContainer #wageHistoryPage,
#wageHistoryPage {
  width:100%;
  color:var(--text,#172033);
  font-family:Arial, sans-serif;
  box-sizing:border-box;
}
#wageHistoryPage *,
#wageHistoryPage *::before,
#wageHistoryPage *::after {
  box-sizing:border-box;
}
#wageHistoryPage .wh-hero {
  background:linear-gradient(120deg,#4338ca,#6366f1,#8b5cf6);
  color:#fff;
  padding:26px;
  border-radius:18px;
  margin-bottom:22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
}
#wageHistoryPage .wh-hero h2 {
  margin:0 0 7px;
  font-size:25px;
}
#wageHistoryPage .wh-hero p {
  margin:0;
  opacity:.9;
  font-size:14px;
}
#wageHistoryPage button {
  cursor:pointer;
  border:0;
  font-family:inherit;
}
#wageHistoryPage .wh-btn {
  padding:11px 17px;
  border-radius:9px;
  font-size:13px;
  font-weight:600;
  transition:.2s;
}
#wageHistoryPage .wh-refresh {
  background:#fff;
  color:#4338ca;
}
#wageHistoryPage .wh-refresh:hover {
  transform:translateY(-2px);
}
#wageHistoryPage .wh-stats {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:16px;
  margin-bottom:22px;
}
#wageHistoryPage .wh-stat {
  background:var(--card,#fff);
  border:1px solid var(--border,#e8edf3);
  border-radius:14px;
  padding:20px;
  min-width:0;
}
#wageHistoryPage .wh-stat-label {
  color:var(--muted,#8490a3);
  font-size:13px;
  margin-bottom:10px;
}
#wageHistoryPage .wh-stat-value {
  font-size:25px;
  font-weight:750;
  color:var(--text,#172033);
  overflow-wrap:anywhere;
}
#wageHistoryPage .wh-stat-icon {
  width:38px;
  height:38px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--primary-light,#e8f7ef);
  margin-bottom:13px;
  font-size:19px;
}
#wageHistoryPage .wh-card {
  background:var(--card,#fff);
  border:1px solid var(--border,#e8edf3);
  border-radius:15px;
  padding:20px;
  margin-bottom:20px;
  min-width:0;
}
#wageHistoryPage .wh-card-title {
  font-size:17px;
  font-weight:700;
  margin:0 0 17px;
  color:var(--text,#172033);
}
#wageHistoryPage .wh-filters {
  display:grid;
  grid-template-columns:2fr 1fr 1fr 1fr auto;
  gap:12px;
  align-items:end;
}
#wageHistoryPage .wh-field label {
  display:block;
  font-size:12px;
  font-weight:650;
  color:var(--muted,#8490a3);
  margin-bottom:7px;
}
#wageHistoryPage .wh-field input,
#wageHistoryPage .wh-field select {
  width:100%;
  height:42px;
  padding:0 12px;
  border:1px solid var(--border,#e8edf3);
  border-radius:9px;
  outline:none;
  background:var(--bg,#f5f7fb);
  color:var(--text,#172033);
  font-size:13px;
}
#wageHistoryPage .wh-field input:focus,
#wageHistoryPage .wh-field select:focus {
  border-color:var(--primary,#087f5b);
}
#wageHistoryPage .wh-clear {
  height:42px;
  padding:0 16px;
  background:var(--primary-light,#e8f7ef);
  color:var(--primary,#087f5b);
  border-radius:9px;
  font-weight:650;
  white-space:nowrap;
}
#wageHistoryPage .wh-table-wrap {
  width:100%;
  overflow-x:auto;
}
#wageHistoryPage table {
  width:100%;
  border-collapse:collapse;
  min-width:950px;
}
#wageHistoryPage th {
  background:var(--bg,#f5f7fb);
  color:var(--muted,#8490a3);
  font-size:11px;
  font-weight:750;
  text-transform:uppercase;
  letter-spacing:.4px;
  padding:14px 12px;
  text-align:left;
  border-bottom:1px solid var(--border,#e8edf3);
  white-space:nowrap;
}
#wageHistoryPage td {
  padding:14px 12px;
  border-bottom:1px solid var(--border,#e8edf3);
  font-size:13px;
  color:var(--text,#172033);
  vertical-align:middle;
}
#wageHistoryPage tbody tr:hover {
  background:var(--hover,#f1f8f5);
}
#wageHistoryPage .wh-company {
  font-weight:700;
  margin-bottom:4px;
}
#wageHistoryPage .wh-sub {
  color:var(--muted,#8490a3);
  font-size:11px;
}
#wageHistoryPage .wh-amount {
  font-weight:750;
  color:var(--primary,#087f5b);
  white-space:nowrap;
}
#wageHistoryPage .wh-delete {
  background:#fee2e2;
  color:#dc2626;
  padding:8px 11px;
  border-radius:7px;
  font-size:12px;
  font-weight:650;
}
#wageHistoryPage .wh-delete:hover {
  background:#fecaca;
}
#wageHistoryPage .wh-empty {
  text-align:center;
  padding:40px 15px;
  color:var(--muted,#8490a3);
}
#wageHistoryPage .wh-loading {
  text-align:center;
  padding:35px;
  color:var(--muted,#8490a3);
}
#wageHistoryPage .wh-footer {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin-top:15px;
  color:var(--muted,#8490a3);
  font-size:12px;
}
#wageHistoryPage .wh-message {
  display:none;
  padding:12px 15px;
  border-radius:9px;
  margin-bottom:15px;
  font-size:13px;
}
#wageHistoryPage .wh-message.success {
  display:block;
  background:#dcfce7;
  color:#166534;
}
#wageHistoryPage .wh-message.error {
  display:block;
  background:#fee2e2;
  color:#991b1b;
}
@media(max-width:900px) {
  #wageHistoryPage .wh-filters {
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
  #wageHistoryPage .wh-stats {
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}
@media(max-width:560px) {
  #wageHistoryPage .wh-hero {
    padding:20px;
  }
  #wageHistoryPage .wh-hero h2 {
    font-size:21px;
  }
  #wageHistoryPage .wh-stats {
    grid-template-columns:1fr;
    gap:11px;
  }
  #wageHistoryPage .wh-stat {
    padding:16px;
  }
  #wageHistoryPage .wh-stat-value {
    font-size:22px;
  }
  #wageHistoryPage .wh-card {
    padding:14px;
  }
  #wageHistoryPage .wh-filters {
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>
<div id="wageHistoryPage">

  <div class="wh-hero">
    <div>
      <h2>Wage History</h2>
      <p>View, search and manage all your wage records.</p>
    </div>
    <button class="wh-btn wh-refresh" id="whRefreshBtn" onclick="whLoadData()">
      ↻ Refresh Data
    </button>
  </div>

  <div id="whMessage" class="wh-message"></div>

  <div class="wh-stats">
    <div class="wh-stat">
      <div class="wh-stat-icon">📋</div>
      <div class="wh-stat-label">Total Records</div>
      <div class="wh-stat-value" id="whTotalRecords">0</div>
    </div>
    <div class="wh-stat">
      <div class="wh-stat-icon">💰</div>
      <div class="wh-stat-label">Total Wage Amount</div>
      <div class="wh-stat-value" id="whTotalAmount">0</div>
    </div>
    <div class="wh-stat">
      <div class="wh-stat-icon">🕒</div>
      <div class="wh-stat-label">Latest Wage</div>
      <div class="wh-stat-value" id="whLatestDate">—</div>
    </div>
  </div>

  <div class="wh-card">
    <h3 class="wh-card-title">Search & Filter</h3>

    <div class="wh-filters">
      <div class="wh-field">
        <label>Search</label>
        <input type="text" id="whSearch"
          placeholder="Company, Wage ID, Transaction ID..."
          oninput="whApplyFilters()">
      </div>

      <div class="wh-field">
        <label>From Date</label>
        <input type="date" id="whFromDate" onchange="whApplyFilters()">
      </div>

      <div class="wh-field">
        <label>To Date</label>
        <input type="date" id="whToDate" onchange="whApplyFilters()">
      </div>

      <div class="wh-field">
        <label>Currency</label>
        <select id="whCurrency" onchange="whApplyFilters()">
          <option value="">All Currencies</option>
        </select>
      </div>

      <button class="wh-clear" onclick="whClearFilters()">Clear Filter</button>
    </div>
  </div>

  <div class="wh-card">
    <h3 class="wh-card-title">All Wage Records</h3>

    <div class="wh-table-wrap">
      <table>
        <thead>
          <tr>
            <th>SL</th>
            <th>Company / Wage ID</th>
            <th>Wage Amount</th>
            <th>Currency</th>
            <th>Transaction ID</th>
            <th>Date</th>
            <th>Comment</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="whTableBody">
          <tr>
            <td colspan="8" class="wh-loading">Loading wage history...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="wh-footer">
      <span id="whShowing">Showing 0 records</span>
      <span>WAGE HISTORY</span>
    </div>
  </div>

</div>

<script>
(function () {
  const API_URL =
    "https://script.google.com/macros/s/AKfycbygdxmo_sur5KYs3XhYHnyaMGQQ_G5_Prc9NUozP9dxRVhrwVmezX2ozhkhqQ4KeWKxPQ/exec";

  let whAllWages = [];
  let whFilteredWages = [];

  function whValue(obj, keys) {
    for (const key of keys) {
      if (obj && obj[key] !== undefined && obj[key] !== null) {
        return obj[key];
      }
    }
    return "";
  }

  function whEscape(value) {
    return String(value ?? "").replace(/[&<>"']/g, function (char) {
      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char];
    });
  }

  function whAmount(wage) {
    return Number(whValue(wage, ["wageAmount", "amount", "Wage Amount"])) || 0;
  }

  function whCurrency(wage) {
    return String(whValue(wage, [
      "wageCurrency", "currencyCode", "currency", "Wage Currency"
    ]) || "");
  }

  function whSymbol(wage) {
    return String(whValue(wage, [
      "currencySymbol", "symbol", "Currency Symbol"
    ]) || "");
  }

  function whDate(wage) {
    return String(whValue(wage, ["date", "Date"]) || "").slice(0, 10);
  }

  function whDateDisplay(date) {
    if (!date) return "—";
    const d = new Date(date + "T00:00:00");
    if (isNaN(d.getTime())) return date;
    return d.toLocaleDateString("en-GB", {
      day: "2-digit",
      month: "short",
      year: "numeric"
    });
  }

  function whShowMessage(message, type) {
    const box = document.getElementById("whMessage");
    if (!box) return;
    box.textContent = message;
    box.className = "wh-message " + type;

    setTimeout(function () {
      if (box) box.className = "wh-message";
    }, 4000);
  }

  function whUpdateStats(data) {
    const total = data.length;
    const totalAmount = data.reduce((sum, wage) => sum + whAmount(wage), 0);

    const sorted = [...data].sort((a, b) =>
      whDate(b).localeCompare(whDate(a))
    );

    document.getElementById("whTotalRecords").textContent =
      total.toLocaleString();

    document.getElementById("whTotalAmount").textContent =
      totalAmount.toLocaleString(undefined, {
        maximumFractionDigits: 2
      });

    document.getElementById("whLatestDate").textContent =
      sorted.length ? whDateDisplay(whDate(sorted[0])) : "—";
  }

  function whBuildCurrencyOptions() {
    const select = document.getElementById("whCurrency");
    const selected = select.value;

    const currencies = [...new Set(
      whAllWages.map(whCurrency).filter(Boolean)
    )].sort();

    select.innerHTML = '<option value="">All Currencies</option>';

    currencies.forEach(currency => {
      const option = document.createElement("option");
      option.value = currency;
      option.textContent = currency;
      select.appendChild(option);
    });

    select.value = currencies.includes(selected) ? selected : "";
  }

  function whRenderTable(data) {
    const tbody = document.getElementById("whTableBody");

    if (!data.length) {
      tbody.innerHTML = `
        <tr>
          <td colspan="8" class="wh-empty">
            No wage records found.
          </td>
        </tr>`;
      document.getElementById("whShowing").textContent =
        "Showing 0 records";
      return;
    }

    tbody.innerHTML = data.map((wage, index) => {
      const wageId = whValue(wage, ["wageId", "Wage ID"]);
      const company = whValue(wage, [
        "companyName", "Company Name"
      ]) || "Unnamed";

      const transaction = whValue(wage, [
        "transactionId", "Transaction ID"
      ]) || "—";

      const comment = whValue(wage, ["comment", "Comment"]) || "—";
      const amount = whAmount(wage);
      const currency = whCurrency(wage);
      const symbol = whSymbol(wage);
      const date = whDate(wage);

      return `
        <tr>
          <td>${index + 1}</td>
          <td>
            <div class="wh-company">${whEscape(company)}</div>
            <div class="wh-sub">${whEscape(wageId || "—")}</div>
          </td>
          <td>
            <span class="wh-amount">
              ${whEscape(symbol)}${amount.toLocaleString(undefined, {
                maximumFractionDigits: 2
              })}
            </span>
          </td>
          <td>${whEscape(currency || "—")}</td>
          <td>${whEscape(transaction)}</td>
          <td>${whEscape(whDateDisplay(date))}</td>
          <td>${whEscape(comment)}</td>
          <td>
            <button class="wh-delete"
              onclick="whDeleteWage('${whEscape(String(wageId))}')">
              Delete
            </button>
          </td>
        </tr>`;
    }).join("");

    document.getElementById("whShowing").textContent =
      "Showing " + data.length + " of " + whAllWages.length + " records";
  }

  window.whApplyFilters = function () {
    const search = document.getElementById("whSearch").value
      .trim().toLowerCase();

    const from = document.getElementById("whFromDate").value;
    const to = document.getElementById("whToDate").value;
    const currency = document.getElementById("whCurrency").value;

    whFilteredWages = whAllWages.filter(wage => {
      const company = whValue(wage, ["companyName", "Company Name"]);
      const wageId = whValue(wage, ["wageId", "Wage ID"]);
      const transaction = whValue(wage, ["transactionId", "Transaction ID"]);
      const comment = whValue(wage, ["comment", "Comment"]);
      const date = whDate(wage);

      const searchText = [
        company, wageId, transaction, comment,
        whCurrency(wage), whAmount(wage)
      ].join(" ").toLowerCase();

      if (search && !searchText.includes(search)) return false;
      if (from && date < from) return false;
      if (to && date > to) return false;
      if (currency && whCurrency(wage) !== currency) return false;

      return true;
    });

    whUpdateStats(whFilteredWages);
    whRenderTable(whFilteredWages);
  };

  window.whClearFilters = function () {
    document.getElementById("whSearch").value = "";
    document.getElementById("whFromDate").value = "";
    document.getElementById("whToDate").value = "";
    document.getElementById("whCurrency").value = "";
    window.whApplyFilters();
  };

  window.whLoadData = async function () {
    const tbody = document.getElementById("whTableBody");
    const button = document.getElementById("whRefreshBtn");

    tbody.innerHTML = `
      <tr><td colspan="8" class="wh-loading">Loading wage history...</td></tr>`;

    button.disabled = true;
    button.textContent = "Loading...";

    try {
      const response = await fetch(API_URL + "?api=wages", {
        method: "GET",
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error("Server error: " + response.status);
      }

      const result = await response.json();

      if (!result.success) {
        throw new Error(result.message || "Could not load wage history.");
      }

      whAllWages = Array.isArray(result.wages) ? result.wages : [];

      whBuildCurrencyOptions();
      window.whApplyFilters();

    } catch (error) {
      console.error("Wage History Error:", error);
      tbody.innerHTML = `
        <tr>
          <td colspan="8" class="wh-empty">
            Failed to load wage history. Please refresh and try again.
          </td>
        </tr>`;
      whShowMessage(error.message || "Failed to load data.", "error");
    } finally {
      button.disabled = false;
      button.textContent = "↻ Refresh Data";
    }
  };

  window.whDeleteWage = async function (wageId) {
    if (!wageId) {
      whShowMessage("Wage ID not found.", "error");
      return;
    }

    if (!confirm("Are you sure you want to delete this wage record? It will be moved to Deleted Wage.")) {
      return;
    }

    try {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify({
          action: "deleteWage",
          wageId: wageId
        })
      });

      const result = await response.json();

      if (!result.success) {
        throw new Error(result.message || "Delete failed.");
      }

      whShowMessage("Wage record moved to Deleted Wage successfully.", "success");
      await window.whLoadData();

    } catch (error) {
      console.error("Delete Wage Error:", error);
      whShowMessage(error.message || "Could not delete wage record.", "error");
    }
  };

  window.whLoadData();
})();
</script>
</body>
</html>
