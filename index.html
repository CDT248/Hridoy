
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wage Management System</title>

<style>
:root{
  --primary:#087f5b;
  --primary-light:#e8f7ef;
  --bg:#f5f7fb;
  --card:#ffffff;
  --sidebar:#ffffff;
  --text:#172033;
  --muted:#8490a3;
  --border:#e8edf3;
  --hover:#f1f8f5;
  --shadow:0 3px 15px rgba(20,35,60,.045);
}

body.dark{
  --bg:#101722;
  --card:#192432;
  --sidebar:#151f2c;
  --text:#edf2f7;
  --muted:#9aa8b9;
  --border:#293748;
  --hover:#203329;
  --primary-light:#17392e;
  --shadow:0 3px 15px rgba(0,0,0,.15);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Inter,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
  transition:background .2s,color .2s;
}

button{
  font-family:inherit;
}

/* =========================
   MAIN LAYOUT
========================= */

.app{
  min-height:100vh;
}

/* SIDEBAR */

.sidebar{
  width:255px;
  height:100vh;
  position:fixed;
  top:0;
  left:0;
  background:var(--sidebar);
  border-right:1px solid var(--border);
  z-index:1000;
  display:flex;
  flex-direction:column;
  transition:transform .25s,background .2s;
}

.brand{
  height:76px;
  padding:0 22px;
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:1px solid var(--border);
}

.brand-logo{
  width:39px;
  height:39px;
  border-radius:12px;
  background:var(--primary);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  font-size:17px;
}

.brand-name{
  font-size:17px;
  font-weight:800;
  letter-spacing:-.4px;
}

.brand-sub{
  font-size:10px;
  color:var(--muted);
  margin-top:3px;
  letter-spacing:1px;
}

.sidebar-content{
  flex:1;
  overflow-y:auto;
  padding:20px 13px;
}

.nav-label{
  font-size:10px;
  color:var(--muted);
  font-weight:800;
  letter-spacing:1.2px;
  padding:12px 12px 9px;
}

.nav-item{
  width:100%;
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 13px;
  border:0;
  border-radius:9px;
  background:transparent;
  color:var(--muted);
  font-size:13px;
  font-weight:600;
  text-align:left;
  cursor:pointer;
  margin-bottom:4px;
  transition:.2s;
}

.nav-item:hover{
  background:var(--hover);
  color:var(--primary);
}

.nav-item.active{
  background:var(--primary-light);
  color:var(--primary);
  font-weight:800;
}

.nav-icon{
  width:20px;
  text-align:center;
  font-size:17px;
}

.sidebar-bottom{
  border-top:1px solid var(--border);
  padding:15px;
}

.sidebar-user{
  display:flex;
  align-items:center;
  gap:11px;
}

.sidebar-avatar{
  width:36px;
  height:36px;
  border-radius:50%;
  background:var(--primary-light);
  color:var(--primary);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
}

.sidebar-user-name{
  font-size:12px;
  font-weight:800;
}

.sidebar-user-role{
  color:var(--muted);
  font-size:10px;
  margin-top:3px;
}

/* =========================
   MAIN AREA
========================= */

.main{
  margin-left:255px;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* HEADER */

.topbar{
  height:76px;
  background:var(--card);
  border-bottom:1px solid var(--border);
  padding:0 28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:500;
}

.topbar-left{
  display:flex;
  align-items:center;
  gap:14px;
}

.page-heading{
  font-size:18px;
  font-weight:800;
}

.page-breadcrumb{
  font-size:11px;
  color:var(--muted);
  margin-top:4px;
}

.topbar-right{
  display:flex;
  align-items:center;
  gap:10px;
}

.icon-btn{
  width:39px;
  height:39px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  cursor:pointer;
  font-size:17px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.icon-btn:hover{
  background:var(--hover);
  color:var(--primary);
}

.menu-toggle{
  display:none;
}

/* CONTENT */

.content{
  padding:27px;
  flex:1;
  min-width:0;
}

#pageContainer{
  width:100%;
  min-height:300px;
}

.loading-box{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:50px 20px;
  text-align:center;
  color:var(--muted);
}

.loading-spinner{
  width:30px;
  height:30px;
  border:3px solid var(--border);
  border-top-color:var(--primary);
  border-radius:50%;
  animation:spin .7s linear infinite;
  margin:0 auto 15px;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.error-box{
  background:var(--card);
  border:1px solid #f3b9b9;
  border-radius:14px;
  padding:25px;
  text-align:center;
  color:var(--text);
}

.error-box h3{
  margin-bottom:9px;
  color:#d64545;
}

.error-box p{
  font-size:13px;
  color:var(--muted);
  margin-bottom:16px;
}

.error-box button{
  padding:10px 18px;
  border:0;
  background:var(--primary);
  color:white;
  border-radius:8px;
  cursor:pointer;
  font-weight:700;
}

/* FOOTER */

.footer{
  padding:15px 27px;
  border-top:1px solid var(--border);
  font-size:11px;
  color:var(--muted);
  display:flex;
  justify-content:space-between;
  gap:10px;
}

/* MOBILE OVERLAY */

.mobile-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:900;
  display:none;
}

.mobile-overlay.show{
  display:block;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px){

  .sidebar{
    transform:translateX(-100%);
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{
    margin-left:0;
  }

  .menu-toggle{
    display:flex;
  }

  .content{
    padding:20px;
  }

}

@media(max-width:600px){

  .topbar{
    height:65px;
    padding:0 14px;
  }

  .page-heading{
    font-size:16px;
  }

  .content{
    padding:14px;
  }

  .footer{
    padding:13px;
    font-size:10px;
  }

  .brand{
    height:68px;
  }

}

</style>
</head>

<body>

<div class="app">

  <!-- =========================
       SIDEBAR
  ========================== -->

  <aside class="sidebar" id="sidebar">

    <div class="brand">

      <div class="brand-logo">W</div>

      <div>
        <div class="brand-name">WAGE MANAGER</div>
        <div class="brand-sub">MANAGEMENT SYSTEM</div>
      </div>

    </div>


    <div class="sidebar-content">

      <div class="nav-label">MAIN MENU</div>

      <button class="nav-item active"
        data-page="dashboard">
        <span class="nav-icon">▦</span>
        Dashboard
      </button>


      <div class="nav-label">USER MANAGEMENT</div>

      <button class="nav-item"
        data-page="add-user">
        <span class="nav-icon">＋</span>
        Add User
      </button>

      <button class="nav-item"
        data-page="user-list">
        <span class="nav-icon">♙</span>
        User List
      </button>

      <button class="nav-item"
        data-page="deleted-user">
        <span class="nav-icon">▤</span>
        Deleted Users
      </button>


      <div class="nav-label">WAGE MANAGEMENT</div>

      <button class="nav-item"
        data-page="add-wage">
        <span class="nav-icon">＋</span>
        Add Wage
      </button>

      <button class="nav-item"
        data-page="wage-history">
        <span class="nav-icon">◷</span>
        Wage History
      </button>


      <div class="nav-label">PAYMENT MANAGEMENT</div>

      <button class="nav-item"
        data-page="payment">
        <span class="nav-icon">৳</span>
        User Payment
      </button>

      <button class="nav-item"
        data-page="payment-history">
        <span class="nav-icon">▤</span>
        Payment History
      </button>

    </div>


    <div class="sidebar-bottom">

      <div class="sidebar-user">

        <div class="sidebar-avatar">W</div>

        <div>
          <div class="sidebar-user-name">
            Administrator
          </div>

          <div class="sidebar-user-role">
            System Admin
          </div>
        </div>

      </div>

    </div>

  </aside>


  <!-- MOBILE OVERLAY -->

  <div class="mobile-overlay"
    id="mobileOverlay"></div>


  <!-- =========================
       MAIN SECTION
  ========================== -->

  <main class="main">

    <!-- HEADER -->

    <header class="topbar">

      <div class="topbar-left">

        <button class="icon-btn menu-toggle"
          id="menuToggle"
          aria-label="Open menu">
          ☰
        </button>

        <div>

          <div class="page-heading"
            id="pageTitle">
            Dashboard
          </div>

          <div class="page-breadcrumb"
            id="pageBreadcrumb">
            Home / Dashboard
          </div>

        </div>

      </div>


      <div class="topbar-right">

        <button class="icon-btn"
          id="themeToggle"
          title="Change Theme">
          ☾
        </button>

      </div>

    </header>


    <!-- PAGE CONTENT -->

    <section class="content">

      <div id="pageContainer">

        <div class="loading-box">
          <div class="loading-spinner"></div>
          Loading Dashboard...
        </div>

      </div>

    </section>


    <!-- FOOTER -->

    <footer class="footer">

      <span>Wage Management System</span>

      <span>© 2026 All Rights Reserved</span>

    </footer>

  </main>

</div>


<!-- =========================
     APPLICATION SCRIPT
========================== -->

<script>

/* =====================================
   ROOT DIRECTORY PAGE CONFIGURATION
===================================== */

const PAGE_CONFIG = {

  "dashboard": {
    file: "dashboard.html",
    title: "Dashboard",
    section: "Main Menu"
  },

  "add-user": {
    file: "add-user.html",
    title: "Add User",
    section: "User Management"
  },

  "user-list": {
    file: "user-list.html",
    title: "User List",
    section: "User Management"
  },

  "deleted-user": {
    file: "deleted-user.html",
    title: "Deleted Users",
    section: "User Management"
  },

  "add-wage": {
    file: "add-wage.html",
    title: "Add Wage",
    section: "Wage Management"
  },

  "wage-history": {
    file: "wage-history.html",
    title: "Wage History",
    section: "Wage Management"
  },

  "payment": {
    file: "payment.html",
    title: "User Payment",
    section: "Payment Management"
  },

  "payment-history": {
    file: "payment-history.html",
    title: "Payment History",
    section: "Payment Management"
  }

};


/* =====================================
   ELEMENTS
===================================== */

const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("mobileOverlay");
const pageContainer = document.getElementById("pageContainer");
const pageTitle = document.getElementById("pageTitle");
const pageBreadcrumb = document.getElementById("pageBreadcrumb");


/* =====================================
   THEME SYSTEM
===================================== */

function applyTheme(theme){

  document.body.classList.toggle(
    "dark",
    theme === "dark"
  );

  document.getElementById("themeToggle").textContent =
    theme === "dark" ? "☀" : "☾";

  localStorage.setItem("wage_theme",theme);

}


const savedTheme =
  localStorage.getItem("wage_theme") || "light";

applyTheme(savedTheme);


document.getElementById("themeToggle")
.addEventListener("click",function(){

  const isDark =
    document.body.classList.contains("dark");

  applyTheme(isDark ? "light" : "dark");

});


/* =====================================
   MOBILE SIDEBAR
===================================== */

function openSidebar(){

  sidebar.classList.add("open");
  overlay.classList.add("show");

}


function closeSidebar(){

  sidebar.classList.remove("open");
  overlay.classList.remove("show");

}


document.getElementById("menuToggle")
.addEventListener("click",openSidebar);


overlay.addEventListener("click",closeSidebar);


/* =====================================
   PAGE ROUTING
===================================== */

function getPageFromHash(){

  let page = location.hash.replace("#","");

  if(!page) return "dashboard";

  page = decodeURIComponent(page);

  if(!PAGE_CONFIG[page]){
    return "dashboard";
  }

  return page;

}


/* =====================================
   ACTIVE SIDEBAR MENU
===================================== */

function updateActiveMenu(page){

  document.querySelectorAll(".nav-item")
  .forEach(item=>{

    item.classList.toggle(
      "active",
      item.dataset.page === page
    );

  });

}


/* =====================================
   HEADER TITLE
===================================== */

function updatePageHeader(page){

  const config = PAGE_CONFIG[page];

  pageTitle.textContent = config.title;

  pageBreadcrumb.textContent =
    "Home / " +
    config.section +
    " / " +
    config.title;

}


/* =====================================
   EXECUTE LOADED PAGE SCRIPTS
===================================== */

async function executePageScripts(container){

  const scripts = Array.from(
    container.querySelectorAll("script")
  );

  for(const oldScript of scripts){

    const newScript = document.createElement("script");

    Array.from(oldScript.attributes).forEach(attr=>{
      newScript.setAttribute(attr.name,attr.value);
    });

    if(oldScript.src){

      newScript.src = new URL(
        oldScript.getAttribute("src"),
        location.href
      ).href;

      await new Promise((resolve,reject)=>{

        newScript.onload = resolve;

        newScript.onerror = ()=>{
          reject(
            new Error("Could not load script: "+newScript.src)
          );
        };

        oldScript.replaceWith(newScript);

      });

    }else{

      newScript.textContent = oldScript.textContent;

      oldScript.replaceWith(newScript);

    }

  }

}


/* =====================================
   MAIN PAGE LOADER
   All HTML files are in ROOT DIRECTORY
===================================== */

let currentPage = "";
let loadCounter = 0;


async function loadPage(page,addHistory=true){

  if(!PAGE_CONFIG[page]){
    page = "dashboard";
  }

  const config = PAGE_CONFIG[page];

  const thisLoad = ++loadCounter;

  closeSidebar();

  updateActiveMenu(page);
  updatePageHeader(page);

  if(addHistory){

    const newHash = "#" + page;

    if(location.hash !== newHash){

      history.pushState(
        {page:page},
        "",
        newHash
      );

    }

  }

  pageContainer.innerHTML = `
    <div class="loading-box">
      <div class="loading-spinner"></div>
      Loading ${config.title}...
    </div>
  `;

  try{

    /*
      IMPORTANT:
      Files are loaded directly from ROOT.
      No pages/ folder.
    */

    const response = await fetch(
      "./" + config.file,
      {
        method:"GET",
        cache:"no-store"
      }
    );

    if(!response.ok){

      throw new Error(
        config.file+" not found. HTTP "+response.status
      );

    }

    const html = await response.text();

    if(thisLoad !== loadCounter) return;

    /*
      Extract body content.
      Also supports HTML fragments.
    */

    const parser = new DOMParser();

    const doc = parser.parseFromString(
      html,
      "text/html"
    );

    const bodyContent = doc.body.innerHTML;

    pageContainer.innerHTML = bodyContent;

    /*
      Execute inline and external scripts
      inside the newly loaded page.
    */

    await executePageScripts(pageContainer);

    if(thisLoad !== loadCounter) return;

    currentPage = page;

    window.currentPage = page;

  }catch(error){

    if(thisLoad !== loadCounter) return;

    console.error("Page loading error:",error);

    pageContainer.innerHTML = `
      <div class="error-box">

        <h3>Unable to Load Page</h3>

        <p>
          ${config.file} could not be loaded.
          Make sure this file exists in the
          GitHub repository root directory.
        </p>

        <p>
          ${String(error.message)}
        </p>

        <button onclick="window.loadPage('${page}',false)">
          Try Again
        </button>

      </div>
    `;

  }

}


/* =====================================
   GLOBAL NAVIGATION
   Child HTML pages can call:
   window.loadPage('user-list')
===================================== */

window.loadPage = loadPage;


/* =====================================
   SIDEBAR CLICK EVENTS
===================================== */

document.querySelectorAll(".nav-item")
.forEach(item=>{

  item.addEventListener("click",function(){

    const page = this.dataset.page;

    loadPage(page,true);

  });

});


/* =====================================
   BROWSER BACK / FORWARD
===================================== */

window.addEventListener("popstate",function(){

  const page = getPageFromHash();

  loadPage(page,false);

});


window.addEventListener("hashchange",function(){

  const page = getPageFromHash();

  if(page !== currentPage){

    loadPage(page,false);

  }

});


/* =====================================
   GLOBAL USER EDIT SUPPORT

   User List page can call:

   window.__wageEditUserId = id;
   window.loadPage('add-user');

===================================== */

window.__wageEditUserId = "";


/* =====================================
   INITIAL PAGE
===================================== */

const initialPage = getPageFromHash();

loadPage(initialPage,false);

</script>

</body>
</html>
