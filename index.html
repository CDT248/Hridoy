
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wage Management System</title>

<style>
:root{
  --bg:#f4f7fb;
  --panel:#ffffff;
  --text:#172033;
  --muted:#788399;
  --border:#e6eaf0;
  --primary:#087f5b;
  --primary-light:#e6f5ef;
  --sidebar:#ffffff;
  --shadow:0 4px 18px rgba(20,35,60,.05);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial, sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
}

body.dark{
  --bg:#101827;
  --panel:#192538;
  --text:#edf2f7;
  --muted:#a0aec0;
  --border:#2b3a50;
  --primary:#20a879;
  --primary-light:#183c35;
  --sidebar:#192538;
  --shadow:0 4px 18px rgba(0,0,0,.15);
}

button{
  font-family:inherit;
  cursor:pointer;
  border:0;
}

.app{
  display:flex;
  min-height:100vh;
}

/* SIDEBAR */

.sidebar{
  width:255px;
  height:100vh;
  background:var(--sidebar);
  border-right:1px solid var(--border);
  position:fixed;
  top:0;
  left:0;
  z-index:100;
  display:flex;
  flex-direction:column;
  transition:.25s;
}

.brand{
  height:72px;
  padding:0 22px;
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:1px solid var(--border);
}

.brand-logo{
  width:38px;
  height:38px;
  border-radius:11px;
  background:var(--primary);
  color:white;
  display:grid;
  place-items:center;
  font-size:20px;
  font-weight:bold;
}

.brand-name{
  font-size:17px;
  font-weight:800;
}

.brand-sub{
  font-size:10px;
  color:var(--muted);
  margin-top:3px;
  letter-spacing:1px;
}

.sidebar-content{
  flex:1;
  padding:18px 13px;
  overflow-y:auto;
}

.nav-title{
  font-size:10px;
  color:var(--muted);
  font-weight:700;
  letter-spacing:1.2px;
  padding:12px 12px 9px;
}

.nav-btn{
  width:100%;
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 13px;
  margin:3px 0;
  background:transparent;
  color:var(--muted);
  border-radius:9px;
  text-align:left;
  font-size:13px;
  font-weight:600;
  transition:.2s;
}

.nav-btn:hover{
  background:var(--bg);
  color:var(--primary);
}

.nav-btn.active{
  background:var(--primary-light);
  color:var(--primary);
}

.nav-icon{
  width:20px;
  text-align:center;
  font-size:17px;
}

.sidebar-bottom{
  padding:15px;
  border-top:1px solid var(--border);
}

.version{
  text-align:center;
  color:var(--muted);
  font-size:11px;
}

/* MAIN */

.main{
  flex:1;
  min-width:0;
  margin-left:255px;
}

/* HEADER */

.header{
  height:72px;
  background:var(--panel);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 27px;
  position:sticky;
  top:0;
  z-index:50;
}

.header-left{
  display:flex;
  align-items:center;
  gap:14px;
}

.menu-toggle{
  width:38px;
  height:38px;
  border-radius:9px;
  background:var(--bg);
  color:var(--text);
  font-size:19px;
  display:none;
}

.page-heading{
  font-size:17px;
  font-weight:750;
}

.page-subtitle{
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
}

.header-right{
  display:flex;
  align-items:center;
  gap:12px;
}

.icon-btn{
  width:38px;
  height:38px;
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--text);
  border-radius:9px;
  font-size:17px;
}

.profile{
  display:flex;
  align-items:center;
  gap:9px;
  padding-left:12px;
  border-left:1px solid var(--border);
}

.profile-avatar{
  width:36px;
  height:36px;
  border-radius:50%;
  background:var(--primary-light);
  color:var(--primary);
  display:grid;
  place-items:center;
  font-weight:bold;
}

.profile-name{
  font-size:12px;
  font-weight:700;
}

.profile-role{
  font-size:10px;
  color:var(--muted);
  margin-top:3px;
}

/* CONTENT */

.content{
  padding:25px;
  min-height:calc(100vh - 72px);
}

#pageContainer{
  width:100%;
  min-height:500px;
}

.loading{
  min-height:350px;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  gap:14px;
  color:var(--muted);
}

.spinner{
  width:35px;
  height:35px;
  border:3px solid var(--border);
  border-top-color:var(--primary);
  border-radius:50%;
  animation:spin .7s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.error-box{
  max-width:600px;
  margin:70px auto;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:15px;
  padding:30px;
  text-align:center;
  box-shadow:var(--shadow);
}

.error-icon{
  font-size:40px;
  margin-bottom:15px;
}

.error-box h2{
  font-size:19px;
  margin-bottom:10px;
}

.error-box p{
  font-size:13px;
  color:var(--muted);
  line-height:1.7;
}

.retry-btn{
  background:var(--primary);
  color:white;
  padding:11px 20px;
  border-radius:8px;
  margin-top:18px;
  font-weight:600;
}

/* MOBILE */

.overlay{
  display:none;
}

@media(max-width:800px){

  .sidebar{
    transform:translateX(-100%);
    width:265px;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .overlay.show{
    display:block;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.4);
    z-index:90;
  }

  .main{
    margin-left:0;
    width:100%;
  }

  .menu-toggle{
    display:block;
  }

  .header{
    padding:0 15px;
  }

  .content{
    padding:15px;
  }

  .profile-info{
    display:none;
  }

  .page-heading{
    font-size:15px;
  }
}

@media(max-width:420px){
  .header-right{
    gap:7px;
  }

  .content{
    padding:11px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">

    <div class="brand">
      <div class="brand-logo">W</div>
      <div>
        <div class="brand-name">WAGE MANAGER</div>
        <div class="brand-sub">MANAGEMENT SYSTEM</div>
      </div>
    </div>

    <div class="sidebar-content">

      <div class="nav-title">MAIN MENU</div>

      <button class="nav-btn active"
        data-page="dashboard"
        onclick="loadPage('dashboard')">
        <span class="nav-icon">▦</span>
        Dashboard
      </button>

      <div class="nav-title">USER MANAGEMENT</div>

      <button class="nav-btn"
        data-page="add-user"
        onclick="loadPage('add-user')">
        <span class="nav-icon">＋</span>
        Add User
      </button>

      <button class="nav-btn"
        data-page="user-list"
        onclick="loadPage('user-list')">
        <span class="nav-icon">♙</span>
        User List
      </button>

      <button class="nav-btn"
        data-page="deleted-user"
        onclick="loadPage('deleted-user')">
        <span class="nav-icon">♲</span>
        Deleted User
      </button>

      <div class="nav-title">WAGE MANAGEMENT</div>

      <button class="nav-btn"
        data-page="add-wage"
        onclick="loadPage('add-wage')">
        <span class="nav-icon">＋</span>
        Add Wage
      </button>

      <button class="nav-btn"
        data-page="wage-history"
        onclick="loadPage('wage-history')">
        <span class="nav-icon">▤</span>
        Wage History
      </button>

      <button class="nav-btn"
        data-page="undo-wage"
        onclick="loadPage('undo-wage')">
        <span class="nav-icon">↶</span>
        Undo Wage
      </button>

      <div class="nav-title">PAYMENT MANAGEMENT</div>

      <button class="nav-btn"
        data-page="payment"
        onclick="loadPage('payment')">
        <span class="nav-icon">৳</span>
        Make Payment
      </button>

      <button class="nav-btn"
        data-page="payment-history"
        onclick="loadPage('payment-history')">
        <span class="nav-icon">▤</span>
        Payment History
      </button>

      <button class="nav-btn"
        data-page="undo-payment"
        onclick="loadPage('undo-payment')">
        <span class="nav-icon">↶</span>
        Undo Payment
      </button>

      <div class="nav-title">REPORT & SETTINGS</div>

      <button class="nav-btn"
        data-page="report"
        onclick="loadPage('report')">
        <span class="nav-icon">▥</span>
        Report
      </button>

      <button class="nav-btn"
        data-page="currency"
        onclick="loadPage('currency')">
        <span class="nav-icon">◉</span>
        Currency Setting
      </button>

      <button class="nav-btn"
        data-page="settings"
        onclick="loadPage('settings')">
        <span class="nav-icon">⚙</span>
        Settings
      </button>

    </div>

    <div class="sidebar-bottom">
      <div class="version">Wage Management v1.0</div>
    </div>

  </aside>

  <div class="overlay" id="overlay"
       onclick="closeSidebar()"></div>

  <!-- MAIN AREA -->
  <main class="main">

    <!-- HEADER -->
    <header class="header">

      <div class="header-left">

        <button class="menu-toggle"
          onclick="toggleSidebar()">☰</button>

        <div>
          <div class="page-heading" id="pageTitle">
            Dashboard
          </div>
          <div class="page-subtitle">
            Welcome to Wage Management System
          </div>
        </div>

      </div>

      <div class="header-right">

        <button class="icon-btn"
          onclick="toggleTheme()"
          title="Change Theme">◐</button>

        <div class="profile">
          <div class="profile-avatar">A</div>
          <div class="profile-info">
            <div class="profile-name">Administrator</div>
            <div class="profile-role">Admin Account</div>
          </div>
        </div>

      </div>

    </header>


    <section class="content">

      <div id="pageContainer">

        <div class="loading">
          <div class="spinner"></div>
          Loading Dashboard...
        </div>

      </div>

    </section>

  </main>

</div>

<script>


const PAGE_FOLDER = "./pages/";

const PAGE_CONFIG = {

  "dashboard": {
    file: "dashboard.html",
    title: "Dashboard"
  },

  "add-user": {
    file: "add-user.html",
    title: "Add User"
  },

  "user-list": {
    file: "user-list.html",
    title: "User List"
  },

  "deleted-user": {
    file: "deleted-user.html",
    title: "Deleted User"
  },

  "add-wage": {
    file: "add-wage.html",
    title: "Add Wage"
  },

  "wage-history": {
    file: "wage-history.html",
    title: "Wage History"
  },

  "undo-wage": {
    file: "undo-wage.html",
    title: "Undo Wage"
  },

  "payment": {
    file: "payment.html",
    title: "Make Payment"
  },

  "payment-history": {
    file: "payment-history.html",
    title: "Payment History"
  },

  "undo-payment": {
    file: "undo-payment.html",
    title: "Undo Payment"
  },

  "report": {
    file: "report.html",
    title: "Report"
  },

  "currency": {
    file: "currency.html",
    title: "Currency Setting"
  },

  "settings": {
    file: "settings.html",
    title: "Settings"
  }

};

let currentPage = "";

async function loadPage(page, addHistory = true){

  const config = PAGE_CONFIG[page];

  if(!config){
    showError("Page configuration not found.");
    return;
  }

  currentPage = page;


  document.querySelectorAll(".nav-btn").forEach(btn=>{
    btn.classList.toggle(
      "active",
      btn.dataset.page === page
    );
  });


  document.getElementById("pageTitle").textContent =
    config.title;


  closeSidebar();

  // Loading state
  const container =
    document.getElementById("pageContainer");

  container.innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      Loading ${config.title}...
    </div>
  `;


  if(addHistory){
    history.pushState(
      {page:page},
      "",
      "#" + page
    );
  }

  try{

    const url = PAGE_FOLDER + config.file;

    const response = await fetch(url, {
      cache:"no-store"
    });

    if(!response.ok){
      throw new Error(
        "HTTP Error: " + response.status
      );
    }

    const html = await response.text();


    const parser = new DOMParser();

    const doc = parser.parseFromString(
      html,
      "text/html"
    );


    const bodyContent = doc.body.innerHTML;

    if(!bodyContent.trim()){
      throw new Error("HTML page is empty.");
    }


    container.innerHTML = bodyContent;


    const scripts = Array.from(
      doc.querySelectorAll("script")
    );

    for(const oldScript of scripts){

      const newScript =
        document.createElement("script");

      if(oldScript.src){

        newScript.src = new URL(
          oldScript.getAttribute("src"),
          url
        ).href;

        newScript.async = false;

        await new Promise((resolve,reject)=>{

          newScript.onload = resolve;

          newScript.onerror = ()=>reject(
            new Error("Script load failed: "+newScript.src)
          );

          document.body.appendChild(newScript);

        });

      }else{

        newScript.textContent =
          oldScript.textContent;

        document.body.appendChild(newScript);

      }

    }

    if(typeof window.onPageLoaded === "function"){
      window.onPageLoaded(page);
    }

    window.scrollTo({
      top:0,
      behavior:"instant"
    });

  }catch(error){

    console.error(error);

    showError(
      "Could not load " + config.file +
      ". Check that the file exists inside the pages folder."
    );

  }

}

function showError(message){

  document.getElementById("pageContainer").innerHTML = `

    <div class="error-box">

      <div class="error-icon">⚠️</div>

      <h2>Page Load Failed</h2>

      <p>${message}</p>

      <button class="retry-btn"
        onclick="loadPage(currentPage,false)">
        Try Again
      </button>

    </div>

  `;

}

window.addEventListener("popstate",function(event){

  const page = location.hash.replace("#","")
    || "dashboard";

  loadPage(
    PAGE_CONFIG[page] ? page : "dashboard",
    false
  );

});


function toggleSidebar(){

  document.getElementById("sidebar")
    .classList.toggle("open");

  document.getElementById("overlay")
    .classList.toggle("show");

}

function closeSidebar(){

  document.getElementById("sidebar")
    .classList.remove("open");

  document.getElementById("overlay")
    .classList.remove("show");

}


function toggleTheme(){

  document.body.classList.toggle("dark");

  const theme =
    document.body.classList.contains("dark")
    ? "dark"
    : "light";

  localStorage.setItem(
    "wage_manager_theme",
    theme
  );

}

(function(){

  const theme =
    localStorage.getItem("wage_manager_theme");

  if(theme === "dark"){
    document.body.classList.add("dark");
  }

})();

(function(){

  let initialPage =
    location.hash.replace("#","");

  if(!PAGE_CONFIG[initialPage]){
    initialPage = "dashboard";
  }

  history.replaceState(
    {page:initialPage},
    "",
    "#" + initialPage
  );

  loadPage(initialPage,false);

})();

</script>

</body>
</html>
