<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RS NETWORK | Payment History</title>

<style>
:root{
  --primary:#087f5b;
  --primaryDark:#066447;
  --bg:#f4f7fb;
  --card:#fff;
  --text:#172033;
  --muted:#64748b;
  --border:#e5eaf1;
  --danger:#dc3545;
  --shadow:0 6px 22px rgba(15,23,42,.05);
}
*{box-sizing:border-box}
body{
  margin:0;padding:22px;background:var(--bg);
  color:var(--text);font-family:Arial,Helvetica,sans-serif
}
.container{max-width:1450px;margin:auto}
.header{
  display:flex;justify-content:space-between;align-items:center;
  gap:12px;flex-wrap:wrap;margin-bottom:20px
}
.heading h2{margin:0;font-size:25px}
.heading p{margin:7px 0 0;color:var(--muted);font-size:13px}
.btn{
  border:0;border-radius:8px;padding:10px 15px;
  font-size:13px;font-weight:700;cursor:pointer
}
.btn:disabled{opacity:.5;cursor:not-allowed}
.primary{background:var(--primary);color:#fff}
.primary:hover{background:var(--primaryDark)}
.light{background:#eef2f7;color:#334155}
.danger{background:#fff0f1;color:var(--danger)}
.stats{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:14px;margin-bottom:20px
}
.stat{
  background:var(--card);border:1px solid var(--border);
  border-radius:12px;padding:18px;box-shadow:var(--shadow);
  min-width:0
}
.stat small{color:var(--muted);font-size:12px}
.stat h3{font-size:23px;margin:9px 0 0;overflow-wrap:anywhere}
.stat .currency-code{
  display:inline-block;margin-top:7px;font-size:11px;
  color:var(--primary);font-weight:700
}
.panel{
  background:var(--card);border:1px solid var(--border);
  border-radius:13px;box-shadow:var(--shadow);overflow:hidden
}
.toolbar{
  padding:17px;display:flex;justify-content:space-between;
  align-items:center;gap:12px;flex-wrap:wrap;
  border-bottom:1px solid var(--border)
}
.toolbar h3{font-size:16px;margin:0}
.filters{display:flex;gap:9px;flex-wrap:wrap}
input,select,textarea{
  width:100%;padding:11px 12px;border:1px solid #dce3ec;
  border-radius:8px;background:#fff;color:var(--text);
  outline:none;font:inherit;font-size:13px
}
input:focus,select:focus,textarea:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(8,127,91,.08)
}
.search{width:260px}
.filter{width:160px}
.table-wrap{width:100%;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:900px}
th,td{
  padding:14px 13px;text-align:left;
  border-bottom:1px solid var(--border);font-size:13px
}
th{
  background:#f8fafc;color:#64748b;
  font-size:11px;text-transform:uppercase;letter-spacing:.4px
}
tbody tr:hover{background:#fbfdfc}
.user-name{font-weight:700}
.user-id{font-size:11px;color:var(--muted);margin-top:4px}
.amount{font-weight:700;color:var(--primary)}
.actions{display:flex;gap:6px;white-space:nowrap}
.action-btn{
  border:1px solid var(--border);background:#fff;
  padding:7px 10px;border-radius:7px;
  font-size:11px;font-weight:700;cursor:pointer
}
.action-btn:hover{background:#f1f5f9}
.action-btn.delete{color:var(--danger)}
.empty{padding:35px;text-align:center;color:var(--muted);font-size:13px}
.footer{
  padding:14px 17px;display:flex;justify-content:space-between;
  align-items:center;gap:10px;flex-wrap:wrap;
  color:var(--muted);font-size:12px
}
.pagination{display:flex;gap:7px}
.pagination button{
  border:1px solid var(--border);background:#fff;
  padding:8px 12px;border-radius:7px;cursor:pointer
}
.pagination button:disabled{opacity:.4;cursor:not-allowed}
.modal{
  position:fixed;inset:0;background:rgba(15,23,42,.55);
  display:none;align-items:center;justify-content:center;
  padding:15px;z-index:1000
}
.modal.show{display:flex}
.modal-box{
  background:#fff;width:100%;max-width:600px;
  max-height:92vh;overflow:auto;border-radius:14px;
  box-shadow:0 20px 70px rgba(0,0,0,.2)
}
.modal-head{
  display:flex;justify-content:space-between;align-items:center;
  padding:18px 20px;border-bottom:1px solid var(--border)
}
.modal-head h3{margin:0;font-size:17px}
.close{
  border:0;background:#f1f5f9;width:31px;height:31px;
  border-radius:50%;font-size:19px;cursor:pointer
}
.modal-body{padding:20px}
.modal-footer{
  display:flex;justify-content:flex-end;gap:9px;
  padding:15px 20px;border-top:1px solid var(--border)
}
.form-grid,.detail-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:14px
}
.field label{
  display:block;font-size:12px;font-weight:700;
  margin-bottom:7px;color:#475569
}
.field.full{grid-column:1/-1}
textarea{min-height:85px;resize:vertical}
.detail{
  padding:12px;background:#f8fafc;border-radius:9px;
  border:1px solid var(--border);min-width:0
}
.detail small{display:block;color:var(--muted);font-size:11px;margin-bottom:6px}
.detail strong{font-size:13px;overflow-wrap:anywhere}
#toast{
  position:fixed;right:20px;bottom:20px;background:#172033;
  color:#fff;padding:13px 18px;border-radius:9px;
  font-size:13px;z-index:2000;display:none;max-width:90%
}
#loading{
  position:fixed;inset:0;background:rgba(255,255,255,.82);
  display:none;align-items:center;justify-content:center;
  z-index:1500;font-size:14px;font-weight:700;color:var(--primary)
}
.spinner{
  width:17px;height:17px;border:2px solid #d1fae5;
  border-top-color:var(--primary);border-radius:50%;
  display:inline-block;vertical-align:middle;
  animation:spin .7s linear infinite;margin-right:8px
}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:700px){
  body{padding:12px}
  .heading h2{font-size:21px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .stat{padding:13px}
  .stat h3{font-size:19px}
  .filters{width:100%}
  .filters>*{width:100%}
  .search,.filter{width:100%}
  .form-grid,.detail-grid{grid-template-columns:1fr}
  .field.full{grid-column:auto}
}
</style>
</head>

<body>
<div class="container">

  <div class="header">
    <div class="heading">
      <h2>Payment History</h2>
      <p>View, edit and manage all active payment records.</p>
    </div>
    <button class="btn primary" id="refreshBtn">↻ Refresh</button>
  </div>

  <!-- DYNAMIC CURRENCY CARDS -->
  <div class="stats" id="currencyCards">
    <div class="stat">
      <small>Total Payment Records</small>
      <h3 id="totalCount">0</h3>
    </div>
    <div class="stat">
      <small>Today's Payment Records</small>
      <h3 id="todayCount">0</h3>
    </div>
  </div>

  <div class="panel">
    <div class="toolbar">
      <h3>All Payment Records</h3>
      <div class="filters">
        <input class="search" id="searchInput"
          placeholder="Search user, ID, transaction...">
        <select class="filter" id="currencyFilter">
          <option value="">All Currencies</option>
        </select>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>User</th>
            <th>Amount</th>
            <th>Method</th>
            <th>Transaction ID</th>
            <th>Payment Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="6" class="empty">Loading...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="footer">
      <span id="pageInfo">Showing 0 records</span>
      <div class="pagination">
        <button id="prevBtn">Previous</button>
        <button id="nextBtn">Next</button>
      </div>
    </div>
  </div>
</div>

<!-- VIEW -->
<div class="modal" id="viewModal">
  <div class="modal-box">
    <div class="modal-head">
      <h3>Payment Details</h3>
      <button class="close" data-close="viewModal">×</button>
    </div>
    <div class="modal-body" id="viewContent"></div>
    <div class="modal-footer">
      <button class="btn light" data-close="viewModal">Close</button>
    </div>
  </div>
</div>

<!-- EDIT -->
<div class="modal" id="editModal">
  <form id="editForm">
    <div class="modal-head">
      <h3>Edit Payment</h3>
      <button type="button" class="close" data-close="editModal">×</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="field full">
          <label>User</label>
          <select id="editUser" required></select>
        </div>
        <div class="field">
          <label>Payment Amount</label>
          <input type="number" id="editAmount" min="0.01" step="any" required>
        </div>
        <div class="field">
          <label>Currency</label>
          <select id="editCurrency" required></select>
        </div>
        <div class="field">
          <label>Payment Method</label>
          <select id="editMethod" required></select>
        </div>
        <div class="field">
          <label>Transaction ID</label>
          <input id="editTransaction">
        </div>
        <div class="field full">
          <label>Payment Date</label>
          <input id="editDate" type="date" required>
        </div>
        <div class="field full">
          <label>Comment</label>
          <textarea id="editComment"></textarea>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn light" data-close="editModal">Cancel</button>
      <button type="submit" class="btn primary" id="saveEditBtn">Save Changes</button>
    </div>
  </form>
</div>

<div id="toast"></div>
<div id="loading"><span class="spinner"></span><span id="loadingText">Please wait...</span></div>

<script>
"use strict";

/* ================ API CONFIG ================ */

const PAYMENT_API =
"https://script.google.com/macros/s/AKfycbwTP0v21FArPYP3SN2Ch2gTBXTplbkRDDu49iAp4C5mSEN0BAxxmtlAPJxGXRSIaF-p/exec";

/* ================ STATE ================ */

let payments = [];
let users = [];
let currencies = [];
let methods = [];
let currentPage = 1;
const PAGE_SIZE = 15;
let editingPaymentId = "";
let busy = false;
let editOptionsLoaded = false;

const $ = id => document.getElementById(id);

function escapeHTML(value){
  return String(value == null ? "" : value).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function money(value){
  return Number(value||0).toLocaleString(undefined,{
    maximumFractionDigits:2
  });
}

function today(){
  const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

function dateText(value){
  if(!value) return "—";
  const s=String(value).slice(0,10);
  const p=s.split("-");
  return p.length===3 ? p[2]+"/"+p[1]+"/"+p[0] : escapeHTML(value);
}

function toast(message){
  const el=$("toast");
  el.textContent=message;
  el.style.display="block";
  clearTimeout(toast.timer);
  toast.timer=setTimeout(()=>el.style.display="none",3500);
}

function setLoading(show,message){
  $("loading").style.display=show?"flex":"none";
  $("loadingText").textContent=message||"Please wait...";
}

function closeModal(id){
  $(id).classList.remove("show");
}

document.querySelectorAll("[data-close]").forEach(btn=>{
  btn.addEventListener("click",()=>closeModal(btn.dataset.close));
});

/* ================ API REQUEST ================ */

/*
  GET uses one direct request for payments.
  JSONP is used for write actions because the current
  Code.gs supports action + callback in doGet().
*/

async function getJSON(api){
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),20000);

  try{
    const url=PAYMENT_API+"?api="+encodeURIComponent(api)+"&_="+Date.now();
    const response=await fetch(url,{
      method:"GET",
      cache:"no-store",
      signal:controller.signal
    });

    if(!response.ok) throw new Error("Server error: "+response.status);

    const data=await response.json();

    if(!data || data.success!==true){
      throw new Error(data?.message||"Invalid API response.");
    }
    return data;
  }catch(err){
    if(err.name==="AbortError"){
      throw new Error("Payment API response is taking too long. Check the Apps Script deployment.");
    }
    throw new Error(
      err.message==="Failed to fetch"
      ? "Payment API connection failed. Check the deployed Web App URL and access permission."
      : err.message
    );
  }finally{
    clearTimeout(timeout);
  }
}

function jsonpAction(payload){
  return new Promise((resolve,reject)=>{
    const callbackName="__rsPayHistory_"+Date.now()+"_"+Math.random().toString(36).slice(2);
    const params=new URLSearchParams({
      ...Object.fromEntries(Object.entries(payload).map(([k,v])=>[k,String(v??"")])),
      callback:callbackName,
      _:String(Date.now())
    });

    const script=document.createElement("script");
    let done=false;

    function cleanup(){
      if(done)return;
      done=true;
      clearTimeout(timer);
      delete window[callbackName];
      script.remove();
    }

    const timer=setTimeout(()=>{
      cleanup();
      reject(new Error("Server did not respond. Please check the latest Code.gs deployment."));
    },30000);

    window[callbackName]=data=>{
      cleanup();
      if(data && data.success===true) resolve(data);
      else reject(new Error(data?.message||"Payment operation failed."));
    };

    script.onerror=()=>{
      cleanup();
      reject(new Error("Could not connect to Payment API."));
    };

    script.src=PAYMENT_API+"?"+params.toString();
    document.body.appendChild(script);
  });
}

/* ================ LOAD PAYMENTS ONLY ================ */

async function loadPayments(){
  const data=await getJSON("payments");
  payments=Array.isArray(data.payments)?data.payments:[];
}

/* Load extra data only when user opens Edit */
async function loadEditOptions(){
  if(editOptionsLoaded) return;

  const results=await Promise.all([
    getJSON("users"),
    getJSON("currencies"),
    getJSON("methods")
  ]);

  users=Array.isArray(results[0].users)?results[0].users:[];
  currencies=Array.isArray(results[1].currencies)?results[1].currencies:[];
  methods=Array.isArray(results[2].methods)?results[2].methods:[];

  editOptionsLoaded=true;
  renderEditOptions();
}

/* ================ CURRENCY CARDS ================ */

function currencyKey(p){
  return String(p.currencyCode||p.currencyName||p.currencyId||"Unknown").trim()||"Unknown";
}

function renderCurrencyCards(){
  const totals=new Map();

  payments.forEach(p=>{
    const key=currencyKey(p);
    const current=totals.get(key)||{
      code:key,
      name:p.currencyName||key,
      symbol:p.currencySymbol||"",
      amount:0,
      count:0
    };

    current.amount+=Number(p.amount||0);
    current.count++;
    totals.set(key,current);
  });

  const todayRecords=payments.filter(p=>
    String(p.paymentDate||"").slice(0,10)===today()
  ).length;

  let html=`
    <div class="stat">
      <small>Total Payment Records</small>
      <h3>${payments.length}</h3>
    </div>
    <div class="stat">
      <small>Today's Payment Records</small>
      <h3>${todayRecords}</h3>
    </div>
  `;

  totals.forEach(item=>{
    html+=`
      <div class="stat">
        <small>${escapeHTML(item.name)} Total</small>
        <h3>${escapeHTML(item.symbol)} ${money(item.amount)}</h3>
        <span class="currency-code">
          ${escapeHTML(item.code)} · ${item.count} Payments
        </span>
      </div>
    `;
  });

  $("currencyCards").innerHTML=html;

  const selected=$("currencyFilter").value;
  const codes=[...totals.keys()];

  $("currencyFilter").innerHTML=
    '<option value="">All Currencies</option>'+
    codes.map(code=>
      `<option value="${escapeHTML(code)}">${escapeHTML(code)}</option>`
    ).join("");

  if(codes.includes(selected)) $("currencyFilter").value=selected;
}

/* ================ FILTER ================ */

function filteredPayments(){
  const q=$("searchInput").value.trim().toLowerCase();
  const currency=$("currencyFilter").value;

  return payments.filter(p=>{
    const searchable=[
      p.paymentId,p.userId,p.userName,p.transactionId,
      p.paymentMethod,p.currencyCode,p.currencyName,p.comment
    ].join(" ").toLowerCase();

    return (!q||searchable.includes(q)) &&
      (!currency||currencyKey(p)===currency);
  }).sort((a,b)=>
    String(b.paymentDate||"").localeCompare(String(a.paymentDate||""))
  );
}

/* ================ TABLE ================ */

function renderPayments(){
  renderCurrencyCards();

  const list=filteredPayments();
  const totalPages=Math.max(1,Math.ceil(list.length/PAGE_SIZE));
  currentPage=Math.min(currentPage,totalPages);

  const start=(currentPage-1)*PAGE_SIZE;
  const visible=list.slice(start,start+PAGE_SIZE);

  $("pageInfo").textContent=list.length
    ? `Showing ${start+1}-${Math.min(start+PAGE_SIZE,list.length)} of ${list.length}`
    : "Showing 0 records";

  $("prevBtn").disabled=currentPage<=1;
  $("nextBtn").disabled=currentPage>=totalPages;

  if(!visible.length){
    $("tableBody").innerHTML=
      '<tr><td colspan="6" class="empty">No payment records found.</td></tr>';
    return;
  }

  $("tableBody").innerHTML=visible.map(p=>`
    <tr>
      <td>
        <div class="user-name">${escapeHTML(p.userName||"Unknown User")}</div>
        <div class="user-id">${escapeHTML(p.userId||"")}</div>
      </td>
      <td class="amount">
        ${escapeHTML(p.currencyCode||p.currencyName||"")} ${money(p.amount)}
      </td>
      <td>${escapeHTML(p.paymentMethod||"—")}</td>
      <td>${escapeHTML(p.transactionId||"—")}</td>
      <td>${dateText(p.paymentDate)}</td>
      <td>
        <div class="actions">
          <button class="action-btn" data-action="view"
            data-id="${escapeHTML(p.paymentId)}">View</button>
          <button class="action-btn" data-action="edit"
            data-id="${escapeHTML(p.paymentId)}">Edit</button>
          <button class="action-btn delete" data-action="delete"
            data-id="${escapeHTML(p.paymentId)}">Delete</button>
        </div>
      </td>
    </tr>
  `).join("");
}

/* ================ VIEW ================ */

function viewPayment(id){
  const p=payments.find(x=>String(x.paymentId)===String(id));
  if(!p)return toast("Payment record not found.");

  const fields=[
    ["Payment ID",p.paymentId],
    ["User Name",p.userName],
    ["User ID",p.userId],
    ["Amount",(p.currencyCode||"")+" "+money(p.amount)],
    ["Currency",p.currencyName||p.currencyCode],
    ["Payment Method",p.paymentMethod],
    ["Transaction ID",p.transactionId],
    ["Payment Date",dateText(p.paymentDate)],
    ["Created At",p.createdAt],
    ["Updated At",p.updatedAt]
  ];

  $("viewContent").innerHTML=`
    <div class="detail-grid">
      ${fields.map(([a,b])=>`
        <div class="detail">
          <small>${escapeHTML(a)}</small>
          <strong>${escapeHTML(b||"—")}</strong>
        </div>
      `).join("")}
      <div class="detail" style="grid-column:1/-1">
        <small>Comment</small>
        <strong>${escapeHTML(p.comment||"No comment")}</strong>
      </div>
    </div>
  `;
  $("viewModal").classList.add("show");
}

/* ================ EDIT ================ */

async function editPayment(id){
  if(busy)return;

  const p=payments.find(x=>String(x.paymentId)===String(id));
  if(!p)return toast("Payment record not found.");

  busy=true;
  setLoading(true,"Loading edit information...");

  try{
    await loadEditOptions();

    editingPaymentId=String(p.paymentId);

    $("editUser").value=String(p.userId||"");
    $("editAmount").value=p.amount??"";
    $("editCurrency").value=String(p.currencyId||"");
    $("editMethod").value=String(p.methodId||"");
    $("editTransaction").value=p.transactionId||"";
    $("editDate").value=String(p.paymentDate||"").slice(0,10);
    $("editComment").value=p.comment||"";

    $("editModal").classList.add("show");
  }catch(err){
    toast(err.message);
  }finally{
    setLoading(false);
    busy=false;
  }
}

function renderEditOptions(){
  $("editUser").innerHTML=
    '<option value="">Select User</option>'+
    users.map(u=>`
      <option value="${escapeHTML(u.userId)}">
        ${escapeHTML(u.userName)} (${escapeHTML(u.userId)})
      </option>
    `).join("");

  $("editCurrency").innerHTML=
    '<option value="">Select Currency</option>'+
    currencies.map(c=>`
      <option value="${escapeHTML(c.id)}">
        ${escapeHTML(c.code||c.name)} - ${escapeHTML(c.name||"")}
      </option>
    `).join("");

  $("editMethod").innerHTML=
    '<option value="">Select Method</option>'+
    methods.map(m=>`
      <option value="${escapeHTML(m.id)}">${escapeHTML(m.name)}</option>
    `).join("");
}

$("editForm").addEventListener("submit",async e=>{
  e.preventDefault();
  if(busy||!editingPaymentId)return;

  const payload={
    action:"editPayment",
    requestId:"EDIT-"+editingPaymentId+"-"+Date.now(),
    paymentId:editingPaymentId,
    userId:$("editUser").value,
    amount:Number($("editAmount").value),
    currencyId:$("editCurrency").value,
    methodId:$("editMethod").value,
    transactionId:$("editTransaction").value.trim(),
    paymentDate:$("editDate").value,
    comment:$("editComment").value.trim()
  };

  if(!payload.userId)return toast("Please select a user.");
  if(!Number.isFinite(payload.amount)||payload.amount<=0)
    return toast("Payment amount must be greater than zero.");
  if(!payload.currencyId)return toast("Please select currency.");
  if(!payload.methodId)return toast("Please select payment method.");
  if(!payload.paymentDate)return toast("Please select payment date.");

  busy=true;
  $("saveEditBtn").disabled=true;
  $("saveEditBtn").textContent="Updating...";
  closeModal("editModal");
  setLoading(true,"Updating payment...");

  try{
    const result=await jsonpAction(payload);
    await loadPayments();
    renderPayments();
    editingPaymentId="";
    toast(result.message||"Payment updated successfully.");
  }catch(err){
    toast(err.message);
  }finally{
    busy=false;
    setLoading(false);
    $("saveEditBtn").disabled=false;
    $("saveEditBtn").textContent="Save Changes";
  }
});

/* ================ DELETE ================ */

async function deletePayment(id){
  if(busy)return;

  const p=payments.find(x=>String(x.paymentId)===String(id));
  if(!p)return toast("Payment record not found.");

  const yes=confirm(
    "Delete this payment record?\n\n"+
    "Payment ID: "+p.paymentId+"\n"+
    "User: "+p.userName+"\n"+
    "Amount: "+(p.currencyCode||"")+" "+money(p.amount)+
    "\n\nThis will move the record to DELETE HISTORY. It will not be permanently deleted."
  );

  if(!yes)return;

  busy=true;
  setLoading(true,"Moving payment to DELETE HISTORY...");

  try{
    const result=await jsonpAction({
      action:"deletePayment",
      requestId:"DELETE-"+id+"-"+Date.now(),
      paymentId:id
    });

    await loadPayments();
    renderPayments();
    toast(result.message||"Payment moved to DELETE HISTORY.");
  }catch(err){
    toast(err.message);
  }finally{
    busy=false;
    setLoading(false);
  }
}

/* ================ EVENTS ================ */

$("tableBody").addEventListener("click",e=>{
  const btn=e.target.closest("[data-action]");
  if(!btn)return;

  const id=btn.dataset.id;
  if(btn.dataset.action==="view")viewPayment(id);
  if(btn.dataset.action==="edit")editPayment(id);
  if(btn.dataset.action==="delete")deletePayment(id);
});

$("searchInput").addEventListener("input",()=>{
  currentPage=1;
  renderPayments();
});

$("currencyFilter").addEventListener("change",()=>{
  currentPage=1;
  renderPayments();
});

$("prevBtn").addEventListener("click",()=>{
  if(currentPage>1){
    currentPage--;
    renderPayments();
  }
});

$("nextBtn").addEventListener("click",()=>{
  const pages=Math.max(1,Math.ceil(filteredPayments().length/PAGE_SIZE));
  if(currentPage<pages){
    currentPage++;
    renderPayments();
  }
});

$("refreshBtn").addEventListener("click",refreshData);

/* ================ REFRESH ================ */

async function refreshData(){
  if(busy)return;

  busy=true;
  $("refreshBtn").disabled=true;
  setLoading(true,"Loading payment records...");

  try{
    await loadPayments();
    currentPage=1;
    renderPayments();
  }catch(err){
    $("tableBody").innerHTML=
      `<tr><td colspan="6" class="empty">${escapeHTML(err.message)}</td></tr>`;
    toast(err.message);
  }finally{
    busy=false;
    $("refreshBtn").disabled=false;
    setLoading(false);
  }
}

/* ================ START ================ */

refreshData();

</script>
</body>
</html>
