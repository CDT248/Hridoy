
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment History</title>

<style>
#paymentHistoryPage{
  --ph-primary:var(--primary,#087f5b);
  --ph-bg:var(--bg,#f5f7fb);
  --ph-card:var(--card,#fff);
  --ph-text:var(--text,#172033);
  --ph-muted:var(--muted,#8490a3);
  --ph-border:var(--border,#e8edf3);
  color:var(--ph-text);
  font-family:inherit;
  width:100%;
}
#paymentHistoryPage *{box-sizing:border-box}
#paymentHistoryPage .ph-wrap{width:100%;padding:4px}
#paymentHistoryPage .ph-heading{
  display:flex;justify-content:space-between;align-items:center;
  gap:12px;flex-wrap:wrap;margin-bottom:20px
}
#paymentHistoryPage .ph-heading h2{
  font-size:23px;margin:0 0 5px;font-weight:800
}
#paymentHistoryPage .ph-sub{
  font-size:13px;color:var(--ph-muted)
}
#paymentHistoryPage button,
#paymentHistoryPage input,
#paymentHistoryPage select{font:inherit}
#paymentHistoryPage button{cursor:pointer}
#paymentHistoryPage .ph-btn{
  border:1px solid var(--ph-border);background:var(--ph-card);
  color:var(--ph-text);padding:10px 15px;border-radius:10px;
  font-size:13px;font-weight:700
}
#paymentHistoryPage .ph-btn.primary{
  background:var(--ph-primary);color:#fff;
  border-color:var(--ph-primary)
}
#paymentHistoryPage .ph-btn:disabled{
  opacity:.5;cursor:not-allowed
}
#paymentHistoryPage .ph-stats{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
  gap:13px;margin-bottom:20px
}
#paymentHistoryPage .ph-stat{
  background:var(--ph-card);border:1px solid var(--ph-border);
  border-radius:14px;padding:17px
}
#paymentHistoryPage .ph-stat small{
  display:block;color:var(--ph-muted);font-size:12px;margin-bottom:9px
}
#paymentHistoryPage .ph-stat strong{
  font-size:22px;display:block;overflow-wrap:anywhere
}
#paymentHistoryPage .ph-panel{
  background:var(--ph-card);border:1px solid var(--ph-border);
  border-radius:15px;padding:18px;margin-bottom:18px
}
#paymentHistoryPage .ph-panel-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;flex-wrap:wrap;margin-bottom:15px
}
#paymentHistoryPage .ph-panel-head h3{
  margin:0;font-size:16px
}
#paymentHistoryPage .ph-pill{
  display:inline-block;padding:5px 9px;border-radius:20px;
  background:var(--ph-bg);font-size:10px;font-weight:800
}

/* PROFILE SEARCH */
#paymentHistoryPage .ph-profile-search{
  display:flex;gap:10px;align-items:center;margin-bottom:15px
}
#paymentHistoryPage .ph-profile-search input{
  flex:1;min-width:0;border:1px solid var(--ph-border);
  border-radius:10px;padding:12px;background:var(--ph-bg);
  color:var(--ph-text);outline:none;min-height:44px
}
#paymentHistoryPage .ph-profile-search input:focus{
  border-color:var(--ph-primary)
}
#paymentHistoryPage .ph-profile-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:10px
}
#paymentHistoryPage .ph-profile-card{
  display:flex;align-items:center;gap:10px;
  width:100%;padding:11px;border:1px solid var(--ph-border);
  border-radius:12px;background:var(--ph-card);
  color:var(--ph-text);text-align:left;cursor:pointer;
  transition:.15s
}
#paymentHistoryPage .ph-profile-card:hover{
  border-color:var(--ph-primary)
}
#paymentHistoryPage .ph-profile-card.active{
  border-color:var(--ph-primary);
  background:var(--ph-bg);
  box-shadow:0 0 0 1px var(--ph-primary)
}
#paymentHistoryPage .ph-avatar{
  width:42px;height:42px;flex:0 0 42px;
  border-radius:50%;background:var(--ph-primary);
  color:#fff;display:flex;align-items:center;
  justify-content:center;font-size:13px;font-weight:800;
  overflow:hidden
}
#paymentHistoryPage .ph-avatar img{
  width:100%;height:100%;object-fit:cover
}
#paymentHistoryPage .ph-profile-info{
  min-width:0;flex:1
}
#paymentHistoryPage .ph-profile-info strong{
  display:block;font-size:12px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap
}
#paymentHistoryPage .ph-profile-info small{
  display:block;color:var(--ph-muted);
  font-size:10px;margin-top:4px
}
#paymentHistoryPage .ph-profile-count{
  font-size:10px;color:var(--ph-muted);
  white-space:nowrap
}
#paymentHistoryPage .ph-all-profile{
  display:flex;align-items:center;justify-content:center;
  min-height:64px;border:1px dashed var(--ph-border);
  border-radius:12px;padding:10px;font-size:12px;
  font-weight:800;color:var(--ph-muted);cursor:pointer
}
#paymentHistoryPage .ph-all-profile.active{
  color:var(--ph-primary);border-color:var(--ph-primary);
  background:var(--ph-bg)
}
#paymentHistoryPage .ph-toolbar{
  display:grid;
  grid-template-columns:minmax(180px,1fr) repeat(2,minmax(130px,auto));
  gap:10px;margin-bottom:15px
}
#paymentHistoryPage .ph-toolbar input{
  width:100%;min-width:0;border:1px solid var(--ph-border);
  border-radius:10px;padding:10px 12px;
  background:var(--ph-bg);color:var(--ph-text);
  outline:none;min-height:42px;font-size:12px
}
#paymentHistoryPage .ph-toolbar input:focus{
  border-color:var(--ph-primary)
}

/* HISTORY CARDS */
#paymentHistoryPage .ph-history-list{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px
}
#paymentHistoryPage .ph-history-card{
  border:1px solid var(--ph-border);
  background:var(--ph-card);border-radius:13px;padding:14px;
  min-width:0
}
#paymentHistoryPage .ph-history-user{
  display:flex;align-items:center;gap:10px;
  padding-bottom:12px;border-bottom:1px solid var(--ph-border)
}
#paymentHistoryPage .ph-history-user .ph-avatar{
  width:42px;height:42px;flex-basis:42px
}
#paymentHistoryPage .ph-history-user-info{
  flex:1;min-width:0
}
#paymentHistoryPage .ph-history-user-info strong{
  display:block;font-size:13px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap
}
#paymentHistoryPage .ph-history-user-info small{
  display:block;color:var(--ph-muted);
  font-size:10px;margin-top:4px
}
#paymentHistoryPage .ph-history-details{
  display:grid;grid-template-columns:1fr 1fr;
  gap:12px;margin:13px 0
}
#paymentHistoryPage .ph-history-details span{
  display:block;color:var(--ph-muted);
  font-size:10px;margin-bottom:5px
}
#paymentHistoryPage .ph-history-details strong{
  font-size:12px;overflow-wrap:anywhere
}
#paymentHistoryPage .ph-view-btn{
  width:100%;border:1px solid var(--ph-primary);
  background:var(--ph-primary);color:#fff;
  border-radius:9px;padding:10px;font-size:12px;
  font-weight:800
}
#paymentHistoryPage .ph-view-btn:hover{opacity:.9}
#paymentHistoryPage .ph-loading{
  display:none;text-align:center;padding:22px;
  color:var(--ph-muted);font-size:13px
}
#paymentHistoryPage .ph-loading.show{display:block}
#paymentHistoryPage .ph-empty{
  text-align:center;padding:30px;color:var(--ph-muted);
  font-size:13px;grid-column:1/-1
}
#paymentHistoryPage .ph-pagination{
  display:flex;justify-content:space-between;align-items:center;
  gap:10px;flex-wrap:wrap;margin-top:15px;
  font-size:12px;color:var(--ph-muted)
}
#paymentHistoryPage .ph-pagination-actions{display:flex;gap:7px}

/* VIEW POPUP */
#paymentHistoryPage .ph-modal{
  display:none;position:fixed;inset:0;background:#0008;
  z-index:9999;align-items:center;justify-content:center;padding:15px
}
#paymentHistoryPage .ph-modal.show{display:flex}
#paymentHistoryPage .ph-modal-box{
  width:min(520px,100%);max-height:90vh;overflow:auto;
  background:var(--ph-card);color:var(--ph-text);
  border-radius:16px;padding:20px;
  border:1px solid var(--ph-border);
  box-shadow:0 20px 60px #0003
}
#paymentHistoryPage .ph-modal-head{
  display:flex;justify-content:space-between;
  align-items:center;gap:10px;margin-bottom:17px
}
#paymentHistoryPage .ph-modal-head h3{
  margin:0;font-size:17px
}
#paymentHistoryPage .ph-close{
  border:0;background:transparent;color:var(--ph-muted);
  font-size:24px;line-height:1;padding:3px 7px
}
#paymentHistoryPage .ph-view-profile{
  display:flex;align-items:center;gap:13px;
  padding:14px;background:var(--ph-bg);
  border-radius:12px;margin-bottom:15px
}
#paymentHistoryPage .ph-view-profile .ph-avatar{
  width:58px;height:58px;flex-basis:58px;font-size:17px
}
#paymentHistoryPage .ph-view-profile strong{
  display:block;font-size:15px
}
#paymentHistoryPage .ph-view-profile small{
  display:block;color:var(--ph-muted);
  font-size:11px;margin-top:5px
}
#paymentHistoryPage .ph-detail-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:10px
}
#paymentHistoryPage .ph-detail{
  padding:11px;border:1px solid var(--ph-border);
  border-radius:10px;min-width:0
}
#paymentHistoryPage .ph-detail span{
  display:block;color:var(--ph-muted);
  font-size:10px;margin-bottom:6px
}
#paymentHistoryPage .ph-detail strong{
  font-size:12px;overflow-wrap:anywhere
}
#paymentHistoryPage .ph-detail.full{grid-column:1/-1}
#paymentHistoryPage .ph-toast{
  position:fixed;right:20px;bottom:20px;z-index:10001;
  background:#172033;color:#fff;padding:12px 17px;
  border-radius:10px;font-size:13px;
  box-shadow:0 5px 20px #0003;display:none;max-width:90vw
}
#paymentHistoryPage .ph-toast.show{display:block}
#paymentHistoryPage .ph-spinner{
  display:inline-block;width:14px;height:14px;
  border:2px solid #ffffff70;border-top-color:#fff;
  border-radius:50%;vertical-align:middle;
  animation:phSpin .7s linear infinite;margin-right:7px
}
@keyframes phSpin{to{transform:rotate(360deg)}}

@media(max-width:850px){
  #paymentHistoryPage .ph-stats{
    grid-template-columns:repeat(2,minmax(0,1fr))
  }
}
@media(max-width:650px){
  #paymentHistoryPage .ph-wrap{padding:0}
  #paymentHistoryPage .ph-heading h2{font-size:20px}
  #paymentHistoryPage .ph-panel{padding:13px}
  #paymentHistoryPage .ph-stat{padding:12px}
  #paymentHistoryPage .ph-stat strong{font-size:18px}
  #paymentHistoryPage .ph-stat small{font-size:10px}
  #paymentHistoryPage .ph-profile-grid{
    grid-template-columns:repeat(2,minmax(0,1fr))
  }
  #paymentHistoryPage .ph-profile-card{padding:9px;gap:8px}
  #paymentHistoryPage .ph-profile-card .ph-avatar{
    width:36px;height:36px;flex-basis:36px
  }
  #paymentHistoryPage .ph-toolbar{
    grid-template-columns:1fr 1fr
  }
  #paymentHistoryPage .ph-toolbar input:first-child{
    grid-column:1/-1
  }
  #paymentHistoryPage .ph-history-list{grid-template-columns:1fr}
  #paymentHistoryPage .ph-modal{padding:10px}
  #paymentHistoryPage .ph-modal-box{
    padding:16px;border-radius:16px;max-height:90dvh
  }
}
@media(max-width:360px){
  #paymentHistoryPage .ph-profile-grid{grid-template-columns:1fr}
}
</style>
</head>

<body>
<div id="paymentHistoryPage">
<div class="ph-wrap">

  <div class="ph-heading">
    <div>
      <h2>Payment History</h2>
      <div class="ph-sub">View user payment records and history</div>
    </div>
    <button class="ph-btn" id="phRefreshBtn" type="button">↻ Refresh</button>
  </div>

  <div class="ph-stats">
    <div class="ph-stat">
      <small>Total History</small>
      <strong id="phTotal">0</strong>
    </div>
    <div class="ph-stat">
      <small>Total Users</small>
      <strong id="phUserCount">0</strong>
    </div>
    <div class="ph-stat">
      <small>Total Payment Amount</small>
      <strong id="phAmount">0</strong>
    </div>
    <div class="ph-stat">
      <small>Selected User Records</small>
      <strong id="phSelectedCount">0</strong>
    </div>
  </div>

  <!-- SEARCH PROFILE -->
  <div class="ph-panel">
    <div class="ph-panel-head">
      <h3>Search Profile</h3>
      <span class="ph-pill" id="phProfileCount">0 USERS</span>
    </div>

    <div class="ph-profile-search">
      <input
        type="search"
        id="phProfileSearch"
        placeholder="Search profile by name or user ID..."
      >
      <button class="ph-btn primary" type="button" id="phProfileSearchBtn">
        Search
      </button>
    </div>

    <div class="ph-profile-grid" id="phProfileGrid">
      <div class="ph-empty">Loading profiles...</div>
    </div>
  </div>

  <!-- HISTORY -->
  <div class="ph-panel">
    <div class="ph-panel-head">
      <h3 id="phHistoryTitle">All Payment History</h3>
      <span class="ph-pill" id="phRecordCount">0 RECORDS</span>
    </div>

    <div class="ph-toolbar">
      <input
        type="search"
        id="phHistorySearch"
        placeholder="Search payment ID, transaction ID..."
      >
      <input type="date" id="phFromDate" title="From Date">
      <input type="date" id="phToDate" title="To Date">
    </div>

    <div class="ph-loading" id="phLoading">
      <span class="ph-spinner" style="border-color:#087f5b40;border-top-color:#087f5b"></span>
      Loading payment history...
    </div>

    <div class="ph-history-list" id="phHistoryList"></div>

    <div class="ph-pagination">
      <span id="phPageInfo">Showing 0 records</span>
      <div class="ph-pagination-actions">
        <button class="ph-btn" id="phPrev" type="button">Previous</button>
        <button class="ph-btn" id="phNext" type="button">Next</button>
      </div>
    </div>
  </div>

</div>

<!-- PAYMENT VIEW POPUP -->
<div class="ph-modal" id="phDetailsModal">
  <div class="ph-modal-box">
    <div class="ph-modal-head">
      <h3>Payment Details</h3>
      <button class="ph-close" type="button" id="phCloseDetails">×</button>
    </div>

    <div id="phDetailsContent"></div>

    <div style="display:flex;justify-content:flex-end;margin-top:17px">
      <button class="ph-btn primary" type="button" id="phDetailsOK">Close</button>
    </div>
  </div>
</div>

<div class="ph-toast" id="phToast"></div>
</div>

<script>
(function(){
"use strict";

const ROOT=document.getElementById("paymentHistoryPage");
if(!ROOT || ROOT.dataset.initialized==="yes") return;
ROOT.dataset.initialized="yes";

/* API URL */
const PAYMENT_API=
"https://script.google.com/macros/s/AKfycbwTP0v21FArPYP3SN2Ch2gTBXTplbkRDDu49iAp4C5mSEN0BAxxmtlAPJxGXRSIaF-p/exec";

const USER_API=
"https://script.google.com/macros/s/AKfycbzlabjyglodpoiPmupmA2buZqMyFiSPScIrTPm0T8Il7Z7bKtAkZglsfDk9WZAFOHgk/exec";

/* STATE */
let historyRecords=[];
let users=[];
let profiles=[];
let selectedUserId="";
let currentPage=1;
const pageSize=10;

const $=id=>document.getElementById(id);

/* HELPERS */
function escapeHTML(value){
  return String(value==null?"":value).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function money(value){
  return Number(value||0).toLocaleString(undefined,{
    maximumFractionDigits:2
  });
}

function toast(message){
  const el=$("phToast");
  el.textContent=message;
  el.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer=setTimeout(()=>el.classList.remove("show"),3200);
}

function showLoading(show){
  $("phLoading").classList.toggle("show",!!show);
}

function formatDate(value){
  if(!value) return "—";
  const d=new Date(value);
  if(isNaN(d.getTime())) return String(value);
  return d.toLocaleDateString();
}

function formatDateTime(value){
  if(!value) return "—";
  const d=new Date(value);
  if(isNaN(d.getTime())) return String(value);
  return d.toLocaleString();
}

function initials(name){
  const parts=String(name||"?").trim().split(/\s+/).filter(Boolean);
  return parts.slice(0,2).map(x=>x.charAt(0).toUpperCase()).join("")||"?";
}

function getImageURL(value){
  let url=String(value||"").trim();
  if(!url) return "";

  if(/^[a-zA-Z0-9_-]{20,}$/.test(url)){
    return "https://drive.google.com/thumbnail?id="+
      encodeURIComponent(url)+"&sz=w300";
  }

  let match=url.match(/\/file\/d\/([^/]+)/);
  if(!match) match=url.match(/[?&]id=([^&]+)/);

  if(match && match[1]){
    return "https://drive.google.com/thumbnail?id="+
      encodeURIComponent(match[1])+"&sz=w300";
  }

  return url;
}

function avatarHTML(user,size=""){
  const name=user?.userName||"Unknown User";
  const image=getImageURL(user?.profilePicture);

  if(image){
    return `<span class="ph-avatar ${size}">
      <img src="${escapeHTML(image)}" alt="${escapeHTML(name)}"
        referrerpolicy="no-referrer"
        onerror="this.parentElement.textContent='${escapeHTML(initials(name))}'">
    </span>`;
  }

  return `<span class="ph-avatar ${size}">${escapeHTML(initials(name))}</span>`;
}

/* LOAD PAYMENT HISTORY */
async function loadHistory(){
  const response=await fetch(PAYMENT_API+"?api=history",{
    method:"GET",
    cache:"no-store"
  });

  if(!response.ok){
    throw new Error("History API request failed: "+response.status);
  }

  const data=await response.json();

  if(data.success===false){
    throw new Error(data.message||"Could not load history.");
  }

  if(Array.isArray(data.history)){
    historyRecords=data.history;
  }else if(Array.isArray(data.data)){
    historyRecords=data.data;
  }else{
    historyRecords=[];
  }
}

/* LOAD USERS WITH PROFILE PICTURES */
async function loadUsers(){
  const response=await fetch(USER_API+"?api=active",{
    method:"GET",
    cache:"no-store"
  });

  if(!response.ok){
    throw new Error("User API request failed: "+response.status);
  }

  const data=await response.json();

  users=Array.isArray(data.users)?data.users:[];
}

/* CREATE UNIQUE HISTORY PROFILES */
function buildProfiles(){
  const map=new Map();

  historyRecords.forEach(h=>{
    const id=String(h.userId||"").trim();
    if(!id) return;

    const existing=map.get(id);
    if(existing){
      existing.count++;
      if(!existing.profilePicture && h.profilePicture){
        existing.profilePicture=h.profilePicture;
      }
      if(!existing.userName && h.userName){
        existing.userName=h.userName;
      }
      return;
    }

    map.set(id,{
      userId:id,
      userName:h.userName||"",
      profilePicture:h.profilePicture||"",
      count:1
    });
  });

  profiles=Array.from(map.values()).map(p=>{
    const user=users.find(u=>String(u.userId)===p.userId);

    return {
      ...p,
      userName:user?.userName||p.userName||"Unknown User",
      profilePicture:
        user?.profilePicture||p.profilePicture||""
    };
  });

  profiles.sort((a,b)=>
    a.userName.localeCompare(b.userName)
  );

  $("phProfileCount").textContent=profiles.length+" USERS";
  $("phUserCount").textContent=profiles.length;
}

/* PROFILE SEARCH */
function renderProfiles(){
  const q=$("phProfileSearch").value.trim().toLowerCase();

  const filtered=profiles.filter(p=>
    p.userName.toLowerCase().includes(q)||
    p.userId.toLowerCase().includes(q)
  );

  let html=`
    <button type="button"
      class="ph-all-profile ${!selectedUserId?"active":""}"
      data-profile-id="">
      All Profiles
    </button>
  `;

  if(!filtered.length){
    html+=`<div class="ph-empty">No matching profiles found.</div>`;
  }else{
    html+=filtered.map(p=>`
      <button type="button"
        class="ph-profile-card ${selectedUserId===p.userId?"active":""}"
        data-profile-id="${escapeHTML(p.userId)}">

        ${avatarHTML(p)}

        <span class="ph-profile-info">
          <strong>${escapeHTML(p.userName)}</strong>
          <small>${escapeHTML(p.userId)}</small>
        </span>

        <span class="ph-profile-count">${p.count}</span>
      </button>
    `).join("");
  }

  $("phProfileGrid").innerHTML=html;
}

function selectProfile(userId){
  selectedUserId=String(userId||"");
  currentPage=1;

  const selected=profiles.find(p=>p.userId===selectedUserId);

  $("phHistoryTitle").textContent=selected
    ?selected.userName+"'s Payment History"
    :"All Payment History";

  renderProfiles();
  renderHistory();
}

$("phProfileGrid").addEventListener("click",e=>{
  const btn=e.target.closest("[data-profile-id]");
  if(!btn) return;

  selectProfile(btn.dataset.profileId);
});

$("phProfileSearchBtn").addEventListener("click",()=>{
  renderProfiles();
});

$("phProfileSearch").addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    e.preventDefault();
    renderProfiles();
  }
});

$("phProfileSearch").addEventListener("input",()=>{
  renderProfiles();
});

/* PROFILE DETAILS FOR HISTORY */
function getHistoryUser(h){
  const user=profiles.find(p=>p.userId===String(h.userId||""));

  return {
    userId:h.userId||"",
    userName:user?.userName||h.userName||"Unknown User",
    profilePicture:user?.profilePicture||h.profilePicture||""
  };
}

/* FILTER HISTORY */
function getFilteredHistory(){
  const q=$("phHistorySearch").value.trim().toLowerCase();
  const from=$("phFromDate").value;
  const to=$("phToDate").value;

  return historyRecords.filter(h=>{
    const userId=String(h.userId||"");

    if(selectedUserId && userId!==selectedUserId){
      return false;
    }

    const searchable=[
      h.historyId,h.paymentId,h.userId,h.userName,
      h.transactionId,h.paymentMethod,h.currencyCode,
      h.amount,h.comment
    ].join(" ").toLowerCase();

    const date=String(h.actionDate||"").slice(0,10);

    return (!q||searchable.includes(q))&&
      (!from||date>=from)&&
      (!to||date<=to);
  }).sort((a,b)=>
    String(b.actionDate||"").localeCompare(String(a.actionDate||""))
  );
}

/* SUMMARY */
function updateStats(){
  const selected=selectedUserId
    ?historyRecords.filter(h=>String(h.userId)===selectedUserId)
    :historyRecords;

  const total=selected.reduce((sum,h)=>
    sum+Number(h.amount||0),0
  );

  $("phTotal").textContent=historyRecords.length;
  $("phAmount").textContent=money(total);
  $("phSelectedCount").textContent=selected.length;
}

/* VIEW DETAILS */
function viewPayment(h){
  const user=getHistoryUser(h);

  $("phDetailsContent").innerHTML=`
    <div class="ph-view-profile">
      ${avatarHTML(user)}
      <div>
        <strong>${escapeHTML(user.userName)}</strong>
        <small>User ID: ${escapeHTML(user.userId||"—")}</small>
      </div>
    </div>

    <div class="ph-detail-grid">

      <div class="ph-detail">
        <span>Payment ID</span>
        <strong>${escapeHTML(h.paymentId||"—")}</strong>
      </div>

      <div class="ph-detail">
        <span>Amount</span>
        <strong>${escapeHTML(h.currencyCode||"")} ${money(h.amount)}</strong>
      </div>

      <div class="ph-detail">
        <span>Currency</span>
        <strong>${escapeHTML(h.currencyName||h.currencyCode||"—")}</strong>
      </div>

      <div class="ph-detail">
        <span>Payment Method</span>
        <strong>${escapeHTML(h.paymentMethod||"—")}</strong>
      </div>

      <div class="ph-detail">
        <span>Transaction ID</span>
        <strong>${escapeHTML(h.transactionId||"—")}</strong>
      </div>

      <div class="ph-detail">
        <span>Payment Date</span>
        <strong>${escapeHTML(formatDate(h.paymentDate))}</strong>
      </div>

      <div class="ph-detail full">
        <span>Comment</span>
        <strong style="white-space:pre-wrap">${escapeHTML(h.comment||"No comment")}</strong>
      </div>

      <div class="ph-detail full">
        <span>History Date</span>
        <strong>${escapeHTML(formatDateTime(h.actionDate))}</strong>
      </div>

    </div>
  `;

  $("phDetailsModal").classList.add("show");
}

/* RENDER HISTORY CARDS */
function renderHistory(){
  updateStats();

  const list=getFilteredHistory();
  const totalPages=Math.max(1,Math.ceil(list.length/pageSize));

  currentPage=Math.min(currentPage,totalPages);

  const start=(currentPage-1)*pageSize;
  const visible=list.slice(start,start+pageSize);

  $("phRecordCount").textContent=list.length+" RECORDS";

  $("phPageInfo").textContent=list.length
    ?`Showing ${start+1}-${Math.min(start+pageSize,list.length)} of ${list.length}`
    :"Showing 0 records";

  $("phPrev").disabled=currentPage<=1;
  $("phNext").disabled=currentPage>=totalPages;

  if(!visible.length){
    $("phHistoryList").innerHTML=`
      <div class="ph-empty">No payment history found.</div>
    `;
    return;
  }

  $("phHistoryList").innerHTML=visible.map(h=>{
    const user=getHistoryUser(h);

    return `
      <div class="ph-history-card">

        <div class="ph-history-user">
          ${avatarHTML(user)}

          <div class="ph-history-user-info">
            <strong>${escapeHTML(user.userName)}</strong>
            <small>${escapeHTML(user.userId)}</small>
          </div>
        </div>

        <div class="ph-history-details">

          <div>
            <span>Amount</span>
            <strong>${escapeHTML(h.currencyCode||"")} ${money(h.amount)}</strong>
          </div>

          <div>
            <span>Payment Method</span>
            <strong>${escapeHTML(h.paymentMethod||"—")}</strong>
          </div>

          <div>
            <span>Transaction ID</span>
            <strong>${escapeHTML(h.transactionId||"—")}</strong>
          </div>

          <div>
            <span>Payment Date</span>
            <strong>${escapeHTML(formatDate(h.paymentDate))}</strong>
          </div>

          <div>
            <span>History Date</span>
            <strong>${escapeHTML(formatDateTime(h.actionDate))}</strong>
          </div>

          <div>
            <span>Payment ID</span>
            <strong>${escapeHTML(h.paymentId||"—")}</strong>
          </div>

        </div>

        <button class="ph-view-btn" data-view-id="${historyRecords.indexOf(h)}">
          View Payment
        </button>

      </div>
    `;
  }).join("");
}

/* VIEW BUTTON */
$("phHistoryList").addEventListener("click",e=>{
  const btn=e.target.closest("[data-view-id]");
  if(!btn) return;

  const index=Number(btn.dataset.viewId);
  const h=historyRecords[index];

  if(h) viewPayment(h);
});

/* HISTORY SEARCH */
["phHistorySearch","phFromDate","phToDate"].forEach(id=>{
  $(id).addEventListener(id==="phHistorySearch"?"input":"change",()=>{
    currentPage=1;
    renderHistory();
  });
});

/* PAGINATION */
$("phPrev").addEventListener("click",()=>{
  if(currentPage>1){
    currentPage--;
    renderHistory();
  }
});

$("phNext").addEventListener("click",()=>{
  currentPage++;
  renderHistory();
});

/* CLOSE POPUP */
function closeDetails(){
  $("phDetailsModal").classList.remove("show");
}

$("phCloseDetails").addEventListener("click",closeDetails);
$("phDetailsOK").addEventListener("click",closeDetails);

$("phDetailsModal").addEventListener("click",e=>{
  if(e.target===$("phDetailsModal")) closeDetails();
});

document.addEventListener("keydown",e=>{
  if(e.key==="Escape") closeDetails();
});

/* REFRESH */
async function refreshHistory(){
  const btn=$("phRefreshBtn");

  btn.disabled=true;
  btn.innerHTML='<span class="ph-spinner"></span>Loading...';

  showLoading(true);

  try{
    await Promise.all([
      loadHistory(),
      loadUsers()
    ]);

    buildProfiles();
    renderProfiles();
    renderHistory();

  }catch(err){
    console.error("Payment History Error:",err);
    toast(err.message||"Could not load payment history.");

    $("phHistoryList").innerHTML=`
      <div class="ph-empty">
        Could not load payment history. Please refresh.
      </div>
    `;

  }finally{
    showLoading(false);
    btn.disabled=false;
    btn.textContent="↻ Refresh";
  }
}

$("phRefreshBtn").addEventListener("click",refreshHistory);

refreshHistory();

})();
</script>
</body>
</html>
