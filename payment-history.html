
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#087f5b">
<title>Payment History</title>

<style>
:root{
  --primary:var(--primary,#087f5b);
  --accent:var(--accent,#12b886);
  --bg:var(--bg,#f5f7fb);
  --card:var(--card,#ffffff);
  --text:var(--text,#172033);
  --muted:var(--muted,#8490a3);
  --border:var(--border,#e8edf3);
  --shadow:0 5px 20px rgba(20,40,60,.06);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  width:100%;
  overflow-x:hidden;
}

body{
  margin:0;
  width:100%;
  overflow-x:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,input{
  font:inherit;
}

button{
  touch-action:manipulation;
}

.ph-wrap{
  width:100%;
  max-width:1500px;
  margin:auto;
  padding:20px;
}

.ph-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:20px;
}

.ph-title{
  font-size:24px;
  font-weight:800;
  margin:0 0 5px;
}

.ph-subtitle{
  color:var(--muted);
  font-size:12px;
}

.ph-refresh{
  border:0;
  background:var(--primary);
  color:white;
  padding:11px 15px;
  border-radius:9px;
  cursor:pointer;
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
}

.ph-stats{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:13px;
  margin-bottom:18px;
}

.ph-stat{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:13px;
  padding:16px;
  min-width:0;
  box-shadow:var(--shadow);
}

.ph-stat-label{
  color:var(--muted);
  font-size:12px;
  margin-bottom:9px;
}

.ph-stat-value{
  font-size:23px;
  font-weight:800;
  overflow-wrap:anywhere;
}

.ph-panel{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:13px;
  padding:18px;
  margin-bottom:17px;
  box-shadow:var(--shadow);
  min-width:0;
}

.ph-section-title{
  font-size:16px;
  font-weight:800;
  margin:0 0 14px;
}

/* SEARCH */

.ph-search-row{
  display:flex;
  gap:9px;
  align-items:center;
  width:100%;
}

.ph-search-wrap{
  flex:1;
  min-width:0;
  position:relative;
}

.ph-search{
  width:100%;
  height:46px;
  border:1px solid var(--border);
  background:var(--bg);
  color:var(--text);
  outline:none;
  border-radius:9px;
  padding:0 12px;
  font-size:14px;
  min-width:0;
}

.ph-search:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(8,127,91,.08);
}

.ph-select-btn{
  height:46px;
  min-width:140px;
  border:0;
  border-radius:9px;
  padding:0 12px;
  background:var(--primary);
  color:#fff;
  font-weight:700;
  font-size:13px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  white-space:nowrap;
}

.ph-dropdown{
  display:none;
  position:absolute;
  top:53px;
  left:0;
  width:100%;
  min-width:270px;
  max-height:330px;
  overflow-y:auto;
  overscroll-behavior:contain;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:11px;
  box-shadow:0 12px 30px rgba(0,0,0,.15);
  padding:6px;
  z-index:1000;
}

.ph-dropdown.show{
  display:block;
}

.ph-profile-option{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  border-radius:9px;
  cursor:pointer;
  min-height:58px;
}

.ph-profile-option:hover,
.ph-profile-option.active{
  background:rgba(8,127,91,.09);
}

.ph-avatar{
  width:42px;
  height:42px;
  flex:0 0 42px;
  border-radius:50%;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(8,127,91,.12);
  color:var(--primary);
  font-size:16px;
  font-weight:800;
}

.ph-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.ph-profile-info{
  flex:1;
  min-width:0;
}

.ph-profile-name{
  font-size:13px;
  font-weight:800;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.ph-profile-id{
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
  overflow:hidden;
  text-overflow:ellipsis;
}

.ph-profile-count{
  font-size:10px;
  font-weight:700;
  color:var(--primary);
  white-space:nowrap;
}

.ph-dropdown-empty{
  padding:20px 8px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

/* SELECTED PROFILE */

.ph-selected{
  display:none;
  align-items:center;
  gap:10px;
  background:rgba(8,127,91,.07);
  border:1px solid rgba(8,127,91,.18);
  padding:11px;
  border-radius:10px;
  margin-top:12px;
  min-width:0;
}

.ph-selected.show{
  display:flex;
}

.ph-selected-info{
  flex:1;
  min-width:0;
}

.ph-selected-name{
  font-size:13px;
  font-weight:800;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.ph-selected-id{
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
}

.ph-clear{
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  border-radius:8px;
  padding:8px 11px;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
}

/* HISTORY */

.ph-history-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:14px;
}

.ph-history-count{
  color:var(--muted);
  font-size:12px;
}

.ph-history-list{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:13px;
}

.ph-history-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:14px;
  min-width:0;
}

.ph-card-user{
  display:flex;
  align-items:center;
  gap:10px;
  padding-bottom:12px;
  border-bottom:1px solid var(--border);
  min-width:0;
}

.ph-card-user-info{
  flex:1;
  min-width:0;
}

.ph-card-user-name{
  font-size:14px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.ph-card-user-id{
  font-size:11px;
  color:var(--muted);
  margin-top:4px;
  overflow-wrap:anywhere;
}

.ph-amount{
  font-size:18px;
  font-weight:800;
  color:var(--primary);
  white-space:nowrap;
}

.ph-details{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:13px 10px;
  padding:13px 0;
}

.ph-detail-label{
  color:var(--muted);
  font-size:10px;
  margin-bottom:5px;
}

.ph-detail-value{
  font-size:12px;
  font-weight:700;
  overflow-wrap:anywhere;
}

.ph-card-footer{
  border-top:1px solid var(--border);
  padding-top:11px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.ph-date{
  font-size:10px;
  color:var(--muted);
}

.ph-view-btn{
  border:0;
  background:var(--primary);
  color:white;
  border-radius:8px;
  padding:10px 13px;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
  white-space:nowrap;
}

.ph-empty{
  grid-column:1/-1;
  text-align:center;
  padding:35px 12px;
  border:1px dashed var(--border);
  border-radius:11px;
  color:var(--muted);
}

.ph-empty-icon{
  font-size:30px;
  margin-bottom:10px;
}

/* MODAL */

.ph-modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:9999;
  background:rgba(10,20,30,.58);
  align-items:center;
  justify-content:center;
  padding:15px;
}

.ph-modal.show{
  display:flex;
}

.ph-modal-box{
  width:100%;
  max-width:460px;
  max-height:90dvh;
  overflow-y:auto;
  background:var(--card);
  border-radius:16px;
  padding:20px;
  box-shadow:0 20px 60px rgba(0,0,0,.2);
}

.ph-modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}

.ph-modal-title{
  font-size:17px;
  font-weight:800;
}

.ph-close{
  border:0;
  width:34px;
  height:34px;
  border-radius:8px;
  background:var(--bg);
  color:var(--text);
  font-size:20px;
  cursor:pointer;
}

.ph-modal-user{
  text-align:center;
  padding:10px 0 17px;
  border-bottom:1px solid var(--border);
}

.ph-modal-avatar{
  width:76px;
  height:76px;
  border-radius:50%;
  margin:0 auto 10px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(8,127,91,.12);
  color:var(--primary);
  font-size:25px;
  font-weight:800;
}

.ph-modal-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.ph-modal-user-name{
  font-size:16px;
  font-weight:800;
}

.ph-modal-user-id{
  color:var(--muted);
  font-size:11px;
  margin-top:5px;
}

.ph-modal-amount{
  text-align:center;
  padding:17px 0;
}

.ph-modal-amount-label{
  color:var(--muted);
  font-size:12px;
  margin-bottom:6px;
}

.ph-modal-amount-value{
  color:var(--primary);
  font-size:29px;
  font-weight:900;
  overflow-wrap:anywhere;
}

.ph-modal-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
}

.ph-modal-item{
  padding:12px 6px;
  border-top:1px solid var(--border);
  min-width:0;
}

.ph-modal-label{
  color:var(--muted);
  font-size:11px;
  margin-bottom:5px;
}

.ph-modal-value{
  font-size:12px;
  font-weight:700;
  overflow-wrap:anywhere;
}

.ph-modal-done{
  width:100%;
  border:0;
  background:var(--primary);
  color:white;
  border-radius:9px;
  padding:13px;
  margin-top:15px;
  font-size:13px;
  font-weight:800;
  cursor:pointer;
}

.ph-loading{
  text-align:center;
  padding:35px 10px;
  color:var(--muted);
  font-size:13px;
}

/* TABLET */

@media(max-width:900px){
  .ph-stats{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .ph-history-list{
    grid-template-columns:1fr;
  }
}

/* MOBILE */

@media(max-width:600px){

  .ph-wrap{
    padding:12px;
  }

  .ph-header{
    margin-bottom:15px;
    align-items:center;
  }

  .ph-title{
    font-size:20px;
  }

  .ph-subtitle{
    font-size:11px;
  }

  .ph-refresh{
    padding:10px 12px;
    font-size:12px;
  }

  .ph-stats{
    gap:9px;
    margin-bottom:13px;
  }

  .ph-stat{
    padding:12px;
    border-radius:11px;
  }

  .ph-stat-label{
    font-size:10px;
    margin-bottom:7px;
    line-height:1.4;
  }

  .ph-stat-value{
    font-size:19px;
  }

  .ph-panel{
    padding:13px;
    margin-bottom:13px;
    border-radius:11px;
  }

  .ph-section-title{
    font-size:14px;
    margin-bottom:12px;
  }

  .ph-search-row{
    gap:7px;
  }

  .ph-search{
    height:43px;
    font-size:12px;
    padding:0 10px;
  }

  .ph-select-btn{
    height:43px;
    min-width:112px;
    padding:0 8px;
    font-size:11px;
  }

  .ph-dropdown{
    top:49px;
    min-width:0;
    width:calc(100vw - 26px);
    max-width:420px;
    max-height:45dvh;
  }

  .ph-profile-option{
    min-height:56px;
    padding:8px;
    gap:8px;
  }

  .ph-avatar{
    width:38px;
    height:38px;
    flex-basis:38px;
    font-size:14px;
  }

  .ph-profile-name{
    font-size:12px;
  }

  .ph-profile-id{
    font-size:10px;
  }

  .ph-profile-count{
    font-size:9px;
  }

  .ph-selected{
    padding:9px;
    gap:8px;
  }

  .ph-selected-name{
    font-size:12px;
  }

  .ph-clear{
    padding:8px 9px;
    font-size:11px;
  }

  .ph-history-head{
    margin-bottom:11px;
  }

  .ph-history-count{
    font-size:10px;
  }

  .ph-history-list{
    gap:10px;
  }

  .ph-history-card{
    padding:12px;
    border-radius:10px;
  }

  .ph-card-user{
    gap:9px;
    padding-bottom:10px;
  }

  .ph-card-user-name{
    font-size:13px;
  }

  .ph-card-user-id{
    font-size:10px;
  }

  .ph-amount{
    font-size:16px;
  }

  .ph-details{
    gap:11px 8px;
    padding:11px 0;
  }

  .ph-detail-label{
    font-size:9px;
  }

  .ph-detail-value{
    font-size:11px;
  }

  .ph-card-footer{
    padding-top:10px;
  }

  .ph-date{
    font-size:9px;
  }

  .ph-view-btn{
    padding:10px 11px;
    font-size:11px;
  }

  .ph-modal{
    padding:10px;
    align-items:flex-end;
  }

  .ph-modal-box{
    max-width:100%;
    max-height:88dvh;
    padding:17px;
    border-radius:17px 17px 12px 12px;
  }

  .ph-modal-title{
    font-size:16px;
  }

  .ph-modal-avatar{
    width:68px;
    height:68px;
  }

  .ph-modal-amount-value{
    font-size:26px;
  }

  .ph-modal-item{
    padding:11px 5px;
  }

  .ph-modal-label{
    font-size:10px;
  }

  .ph-modal-value{
    font-size:11px;
  }

  .ph-modal-done{
    padding:13px;
  }
}

/* VERY SMALL MOBILE */

@media(max-width:360px){

  .ph-wrap{
    padding:9px;
  }

  .ph-title{
    font-size:18px;
  }

  .ph-refresh{
    padding:9px;
    font-size:11px;
  }

  .ph-stat{
    padding:10px;
  }

  .ph-stat-value{
    font-size:17px;
  }

  .ph-select-btn{
    min-width:102px;
    font-size:10px;
  }

  .ph-search{
    font-size:11px;
  }

  .ph-card-user-name{
    font-size:12px;
  }

  .ph-amount{
    font-size:14px;
  }

  .ph-view-btn{
    padding:9px;
    font-size:10px;
  }
}
</style>
</head>

<body>

<div class="ph-wrap">

  <div class="ph-header">
    <div>
      <h1 class="ph-title">Payment History</h1>
      <div class="ph-subtitle">View payment records and details</div>
    </div>
    <button class="ph-refresh" id="phRefresh">↻ Refresh</button>
  </div>

  <div class="ph-stats">

    <div class="ph-stat">
      <div class="ph-stat-label">Total History</div>
      <div class="ph-stat-value" id="phTotalHistory">0</div>
    </div>

    <div class="ph-stat">
      <div class="ph-stat-label">Total Users</div>
      <div class="ph-stat-value" id="phTotalUsers">0</div>
    </div>

    <div class="ph-stat">
      <div class="ph-stat-label">Total Payment Amount</div>
      <div class="ph-stat-value" id="phTotalAmount">৳0</div>
    </div>

    <div class="ph-stat">
      <div class="ph-stat-label">Selected User Records</div>
      <div class="ph-stat-value" id="phSelectedRecords">All</div>
    </div>

  </div>

  <!-- SEARCH PROFILE -->
  <div class="ph-panel">

    <h3 class="ph-section-title">Search Profile</h3>

    <div class="ph-search-row">

      <div class="ph-search-wrap">

        <input
          type="search"
          class="ph-search"
          id="phProfileSearch"
          placeholder="Search profile..."
          autocomplete="off"
        >

        <div class="ph-dropdown" id="phProfileDropdown">
          <div id="phProfileOptions"></div>
        </div>

      </div>

      <button class="ph-select-btn" id="phSelectButton" type="button">
        Select Profile⌄
      </button>

    </div>

    <div class="ph-selected" id="phSelectedProfile">

      <div class="ph-avatar" id="phSelectedAvatar"></div>

      <div class="ph-selected-info">
        <div class="ph-selected-name" id="phSelectedName"></div>
        <div class="ph-selected-id" id="phSelectedId"></div>
      </div>

      <button class="ph-clear" id="phClearProfile" type="button">
        Clear
      </button>

    </div>

  </div>

  <!-- HISTORY -->
  <div class="ph-panel">

    <div class="ph-history-head">
      <h3 class="ph-section-title" style="margin:0">
        Payment History Records
      </h3>

      <div class="ph-history-count" id="phHistoryCount">
        Loading...
      </div>
    </div>

    <div class="ph-history-list" id="phHistoryList">
      <div class="ph-loading">Loading payment history...</div>
    </div>

  </div>

</div>

<!-- DETAILS MODAL -->
<div class="ph-modal" id="phViewModal">

  <div class="ph-modal-box">

    <div class="ph-modal-head">
      <div class="ph-modal-title">Payment Details</div>
      <button class="ph-close" id="phModalClose">×</button>
    </div>

    <div class="ph-modal-user">
      <div class="ph-modal-avatar" id="phModalAvatar"></div>
      <div class="ph-modal-user-name" id="phModalName"></div>
      <div class="ph-modal-user-id" id="phModalUserId"></div>
    </div>

    <div class="ph-modal-amount">
      <div class="ph-modal-amount-label">Payment Amount</div>
      <div class="ph-modal-amount-value" id="phModalAmount">৳0</div>
    </div>

    <div class="ph-modal-grid" id="phModalDetails"></div>

    <button class="ph-modal-done" id="phModalDone">
      Close
    </button>

  </div>

</div>

<script>
"use strict";

/* API */

const PAYMENT_API =
"https://script.google.com/macros/s/AKfycbwTP0v21FArPYP3SN2Ch2gTBXTplbkRDDu49iAp4C5mSEN0BAxxmtlAPJxGXRSIaF-p/exec";

const USER_API =
"https://script.google.com/macros/s/AKfycbzlabjyglodpoiPmupmA2buZqMyFiSPScIrTPm0T8Il7Z7bKtAkZglsfDk9WZAFOHgk/exec";


/* STATE */

let paymentHistory=[];
let allProfiles=[];
let selectedUserId="";
let isDropdownOpen=false;

const $=id=>document.getElementById(id);


/* HELPERS */

function esc(value){
  return String(value??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));
}

function getValue(obj,keys,fallback=""){
  for(const key of keys){
    if(obj && obj[key]!==undefined &&
       obj[key]!==null && obj[key]!==""){
      return obj[key];
    }
  }
  return fallback;
}

function money(value){
  return "৳"+Number(value||0).toLocaleString("en-BD",{
    maximumFractionDigits:2
  });
}

function formatDate(value){
  if(!value)return "—";
  const d=new Date(value);
  if(Number.isNaN(d.getTime()))return String(value);

  return d.toLocaleDateString("en-GB",{
    day:"2-digit",
    month:"short",
    year:"numeric"
  });
}

function getUserId(x){
  return String(getValue(x,["userId","User ID","userid"],""));
}

function getUserName(x){
  return String(getValue(x,["userName","User Name","name","Name"],"Unknown User"));
}

function getProfilePicture(x){
  return String(getValue(x,[
    "profilePicture",
    "Profile Picture",
    "photoURL",
    "photoUrl",
    "image",
    "avatar"
  ],""));
}

function getImageURL(value){
  if(!value)return "";

  let url=String(value).trim();

  if(!url.startsWith("http")&&!url.startsWith("data:")){
    return "https://drive.google.com/thumbnail?id="+
      encodeURIComponent(url)+"&sz=w300";
  }

  const match=url.match(/\/d\/([a-zA-Z0-9_-]+)/);

  if(match){
    return "https://drive.google.com/thumbnail?id="+
      match[1]+"&sz=w300";
  }

  const idMatch=url.match(/[?&]id=([a-zA-Z0-9_-]+)/);

  if(idMatch&&url.includes("drive.google.com")){
    return "https://drive.google.com/thumbnail?id="+
      idMatch[1]+"&sz=w300";
  }

  return url;
}

function avatarHTML(name,picture,extraClass=""){
  const initial=esc(
    String(name||"U").trim().charAt(0).toUpperCase()
  );

  const image=getImageURL(picture);

  if(!image){
    return `<div class="${extraClass}">${initial}</div>`;
  }

  return `
    <div class="${extraClass}">
      <img
        src="${esc(image)}"
        alt="${esc(name)}"
        referrerpolicy="no-referrer"
        onerror="this.parentElement.innerHTML='${initial}'"
      >
    </div>
  `;
}

async function apiGet(url){
  const response=await fetch(url,{
    method:"GET",
    cache:"no-store"
  });

  if(!response.ok){
    throw new Error("API request failed: "+response.status);
  }

  return await response.json();
}


/* LOAD */

async function loadPaymentHistory(){

  $("phHistoryList").innerHTML=
    `<div class="ph-loading">Loading payment history...</div>`;

  $("phHistoryCount").textContent="Loading...";

  try{

    const [historyResponse,userResponse]=await Promise.all([
      apiGet(PAYMENT_API+"?api=history&t="+Date.now()),
      apiGet(USER_API+"?api=active&t="+Date.now())
    ]);

    if(historyResponse.success===false){
      throw new Error(historyResponse.message||"History loading failed.");
    }

    const historyData=
      historyResponse.history||
      historyResponse.data||
      historyResponse.entries||
      [];

    const usersData=
      userResponse.users||
      userResponse.data||
      [];

    paymentHistory=Array.isArray(historyData)?historyData:[];

    buildProfiles(usersData);

    updateSummary();
    renderProfileDropdown();
    renderHistory();

  }catch(error){

    console.error(error);

    $("phHistoryList").innerHTML=`
      <div class="ph-empty">
        <div class="ph-empty-icon">⚠️</div>
        <b>Unable to load payment history</b>
        <p>${esc(error.message)}</p>
      </div>
    `;

    $("phHistoryCount").textContent="Loading failed";
  }
}


/* BUILD PROFILES */

function buildProfiles(users){

  const map=new Map();

  paymentHistory.forEach(h=>{

    const id=getUserId(h);
    if(!id)return;

    map.set(id,{
      userId:id,
      userName:getUserName(h),
      profilePicture:getProfilePicture(h),
      count:0
    });

  });

  (Array.isArray(users)?users:[]).forEach(user=>{

    const id=getUserId(user);
    if(!id)return;

    const old=map.get(id);

    if(old){

      old.userName=getUserName(user)||old.userName;

      old.profilePicture=
        getProfilePicture(user)||
        old.profilePicture;

    }

  });

  paymentHistory.forEach(h=>{
    const p=map.get(getUserId(h));
    if(p)p.count++;
  });

  allProfiles=Array.from(map.values()).sort((a,b)=>
    a.userName.localeCompare(b.userName)
  );
}


/* SUMMARY */

function updateSummary(){

  const totalAmount=paymentHistory.reduce((sum,h)=>
    sum+Number(getValue(h,["amount","Amount","paymentAmount"],0)),0
  );

  $("phTotalHistory").textContent=paymentHistory.length;
  $("phTotalUsers").textContent=allProfiles.length;
  $("phTotalAmount").textContent=money(totalAmount);

  updateSelectedCount();
}

function updateSelectedCount(){

  $("phSelectedRecords").textContent=selectedUserId
    ?paymentHistory.filter(h=>getUserId(h)===selectedUserId).length
    :"All";
}


/* PROFILE DROPDOWN */

function renderProfileDropdown(){

  const search=$("phProfileSearch").value.trim().toLowerCase();

  const profiles=allProfiles.filter(p=>
    p.userName.toLowerCase().includes(search)||
    p.userId.toLowerCase().includes(search)
  );

  let html=`
    <div class="ph-profile-option ${!selectedUserId?"active":""}"
         data-user-id="">
      <div class="ph-avatar">ALL</div>
      <div class="ph-profile-info">
        <div class="ph-profile-name">All Profiles</div>
        <div class="ph-profile-id">Show all payment history</div>
      </div>
      <div class="ph-profile-count">${paymentHistory.length}</div>
    </div>
  `;

  profiles.forEach(p=>{

    html+=`
      <div class="ph-profile-option ${
        selectedUserId===p.userId?"active":""
      }" data-user-id="${esc(p.userId)}">

        ${avatarHTML(p.userName,p.profilePicture,"ph-avatar")}

        <div class="ph-profile-info">
          <div class="ph-profile-name">${esc(p.userName)}</div>
          <div class="ph-profile-id">${esc(p.userId)}</div>
        </div>

        <div class="ph-profile-count">${p.count} Payments</div>

      </div>
    `;

  });

  if(!profiles.length&&search){
    html+=`<div class="ph-dropdown-empty">No matching profile found.</div>`;
  }

  if(!allProfiles.length){
    html+=`<div class="ph-dropdown-empty">No profiles found.</div>`;
  }

  $("phProfileOptions").innerHTML=html;

  $("phProfileOptions")
    .querySelectorAll("[data-user-id]")
    .forEach(item=>{
      item.addEventListener("click",()=>{
        selectProfile(item.dataset.userId);
      });
    });
}

function toggleDropdown(force){

  isDropdownOpen=typeof force==="boolean"
    ?force
    :!isDropdownOpen;

  $("phProfileDropdown").classList.toggle("show",isDropdownOpen);

  if(isDropdownOpen){
    renderProfileDropdown();
    $("phProfileSearch").focus();
  }
}

function selectProfile(userId){

  selectedUserId=String(userId||"");

  toggleDropdown(false);

  if(selectedUserId){

    const p=allProfiles.find(x=>x.userId===selectedUserId);

    if(p){

      $("phSelectedProfile").classList.add("show");

      $("phSelectedAvatar").innerHTML=
        avatarHTML(p.userName,p.profilePicture,"ph-avatar");

      $("phSelectedName").textContent=p.userName;
      $("phSelectedId").textContent="User ID: "+p.userId;

      $("phProfileSearch").value=p.userName;

      $("phSelectButton").textContent="Change Profile ⌄";
    }

  }else{

    $("phSelectedProfile").classList.remove("show");
    $("phProfileSearch").value="";
    $("phSelectButton").textContent="Select Profile ⌄";

  }

  updateSelectedCount();
  renderProfileDropdown();
  renderHistory();
}


/* HISTORY */

function renderHistory(){

  let list=paymentHistory.slice();

  if(selectedUserId){
    list=list.filter(h=>getUserId(h)===selectedUserId);
  }

  list.sort((a,b)=>{

    const da=new Date(getValue(
      a,["actionDate","createdAt","timestamp","date","paymentDate"],0
    )).getTime()||0;

    const db=new Date(getValue(
      b,["actionDate","createdAt","timestamp","date","paymentDate"],0
    )).getTime()||0;

    return db-da;
  });

  $("phHistoryCount").textContent=list.length+" record(s) found";

  if(!list.length){

    $("phHistoryList").innerHTML=`
      <div class="ph-empty">
        <div class="ph-empty-icon">📭</div>
        <b>No Payment History Found</b>
        <p>No payment records available for this selection.</p>
      </div>
    `;

    return;
  }

  $("phHistoryList").innerHTML=list.map((h,index)=>{

    const id=getUserId(h);
    const p=allProfiles.find(x=>x.userId===id);

    const name=p?.userName||getUserName(h);
    const picture=p?.profilePicture||getProfilePicture(h);

    const amount=getValue(h,["amount","Amount","paymentAmount"],0);
    const method=getValue(h,["paymentMethod","method","Method"],"—");
    const trx=getValue(h,["transactionId","Transaction ID","trxId"],"—");
    const date=getValue(h,["paymentDate","date","Date"],"");
    const historyDate=getValue(h,["actionDate","createdAt","timestamp","Created At"],"");
    const paymentId=getValue(h,["paymentId","Payment ID","historyId","entryId"],"—");

    return `
      <div class="ph-history-card">

        <div class="ph-card-user">

          ${avatarHTML(name,picture,"ph-avatar")}

          <div class="ph-card-user-info">
            <div class="ph-card-user-name">${esc(name)}</div>
            <div class="ph-card-user-id">User ID: ${esc(id)}</div>
          </div>

          <div class="ph-amount">${money(amount)}</div>

        </div>

        <div class="ph-details">

          <div>
            <div class="ph-detail-label">Payment Method</div>
            <div class="ph-detail-value">${esc(method)}</div>
          </div>

          <div>
            <div class="ph-detail-label">Transaction ID</div>
            <div class="ph-detail-value">${esc(trx)}</div>
          </div>

          <div>
            <div class="ph-detail-label">Payment Date</div>
            <div class="ph-detail-value">${esc(formatDate(date))}</div>
          </div>

          <div>
            <div class="ph-detail-label">Payment ID</div>
            <div class="ph-detail-value">${esc(paymentId)}</div>
          </div>

        </div>

        <div class="ph-card-footer">
          <div class="ph-date">History: ${esc(formatDate(historyDate))}</div>

          <button class="ph-view-btn" type="button" data-view="${index}">
            View Payment
          </button>
        </div>

      </div>
    `;

  }).join("");

  $("phHistoryList")
    .querySelectorAll("[data-view]")
    .forEach(button=>{
      button.addEventListener("click",()=>{
        const item=list[Number(button.dataset.view)];
        if(item)openPaymentDetails(item);
      });
    });
}


/* DETAILS */

function openPaymentDetails(h){

  const id=getUserId(h);
  const p=allProfiles.find(x=>x.userId===id);

  const name=p?.userName||getUserName(h);
  const picture=p?.profilePicture||getProfilePicture(h);

  $("phModalAvatar").innerHTML=
    avatarHTML(name,picture,"ph-modal-avatar");

  $("phModalName").textContent=name;
  $("phModalUserId").textContent="User ID: "+id;

  $("phModalAmount").textContent=money(
    getValue(h,["amount","Amount","paymentAmount"],0)
  );

  const details=[

    ["Payment ID",getValue(h,["paymentId","Payment ID","historyId","entryId"],"—")],

    ["Payment Method",getValue(h,["paymentMethod","method","Method"],"—")],

    ["Transaction ID",getValue(h,["transactionId","Transaction ID","trxId"],"—")],

    ["Payment Date",formatDate(getValue(h,["paymentDate","date","Date"],""))],

    ["History Date",formatDate(getValue(h,["actionDate","createdAt","timestamp","Created At"],""))],

    ["Currency",getValue(h,["currencyName","currencyCode"],"BDT")],

    ["Description",getValue(h,["comment","description","note","Description"],"—")]

  ];

  $("phModalDetails").innerHTML=details.map(item=>`
    <div class="ph-modal-item">
      <div class="ph-modal-label">${esc(item[0])}</div>
      <div class="ph-modal-value">${esc(item[1])}</div>
    </div>
  `).join("");

  $("phViewModal").classList.add("show");
}

function closePaymentModal(){
  $("phViewModal").classList.remove("show");
}


/* EVENTS */

$("phSelectButton").addEventListener("click",()=>{
  toggleDropdown();
});

$("phProfileSearch").addEventListener("focus",()=>{
  if(!isDropdownOpen)toggleDropdown(true);
});

$("phProfileSearch").addEventListener("input",()=>{
  if(!isDropdownOpen)toggleDropdown(true);
  renderProfileDropdown();
});

$("phClearProfile").addEventListener("click",()=>{
  selectProfile("");
});

$("phRefresh").addEventListener("click",()=>{
  loadPaymentHistory();
});

$("phModalClose").addEventListener("click",closePaymentModal);
$("phModalDone").addEventListener("click",closePaymentModal);

$("phViewModal").addEventListener("click",event=>{
  if(event.target===$("phViewModal"))closePaymentModal();
});

document.addEventListener("click",event=>{

  const dropdown=$("phProfileDropdown");
  const wrap=document.querySelector(".ph-search-wrap");
  const button=$("phSelectButton");

  if(
    isDropdownOpen&&
    !dropdown.contains(event.target)&&
    !wrap.contains(event.target)&&
    !button.contains(event.target)
  ){
    toggleDropdown(false);
  }

});

document.addEventListener("keydown",event=>{
  if(event.key==="Escape"){
    toggleDropdown(false);
    closePaymentModal();
  }
});


/* START */

loadPaymentHistory();

</script>

</body>
</html>
