
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Add User</title>
<style>
.au-page{color:var(--text);font-family:Arial,sans-serif}
.au-page *{box-sizing:border-box}
.au-card{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:22px}
.au-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.au-head h2{font-size:20px;margin:0 0 5px}
.au-muted,.au-hint{color:var(--muted);font-size:12px}
.au-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.au-field{display:flex;flex-direction:column;gap:7px}
.au-field label{font-size:12px;font-weight:700}
.au-field input,.au-field select,.au-field textarea{
 width:100%;padding:12px;border:1px solid var(--border);
 border-radius:9px;background:var(--bg);color:var(--text);
 font:inherit;font-size:13px;outline:none
}
.au-field textarea{min-height:85px;resize:vertical}
.au-field input:focus,.au-field select:focus,.au-field textarea:focus{border-color:var(--primary)}
.au-full{grid-column:1/-1}
.au-btn{padding:11px 16px;border:0;border-radius:9px;cursor:pointer;font-weight:700;font-size:12px}
.au-primary{background:var(--primary);color:white}
.au-secondary{background:var(--hover);color:var(--text)}
.au-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}
.au-message{display:none;padding:11px;border-radius:8px;margin-bottom:14px;font-size:12px}
.au-message.ok{display:block;background:#e8f7ef;color:#087f5b}
.au-message.err{display:block;background:#fff0ee;color:#c0392b}
.au-photo-area{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.au-preview{width:90px;height:90px;border-radius:50%;object-fit:cover;border:2px solid var(--border);background:var(--bg);display:none}
.au-upload-label{display:inline-flex;align-items:center;gap:8px;background:var(--primary-light);color:var(--primary);padding:12px 15px;border-radius:9px;cursor:pointer;font-size:12px;font-weight:800}
.au-upload-label input{display:none}
.au-remove{font-size:11px;color:#c0392b;background:transparent;border:0;cursor:pointer}
.au-progress{height:6px;background:var(--border);border-radius:10px;overflow:hidden;margin-top:9px;display:none}
.au-progress span{display:block;height:100%;width:0;background:var(--primary);transition:width .2s}
@media(max-width:650px){.au-grid{grid-template-columns:1fr}.au-full{grid-column:auto}.au-card{padding:15px}}
</style>
</head>
<body>
<div class="au-page">
  <div class="au-head">
    <div>
      <h2 id="auTitle">Add New User</h2>
      <div class="au-muted">Create or update a user profile</div>
    </div>
    <button class="au-btn au-secondary" type="button" onclick="window.loadPage('user-list')">View Users</button>
  </div>

  <div class="au-card">
    <div id="auMessage" class="au-message"></div>

    <form id="auForm">
      <div class="au-grid">

        <div class="au-field">
          <label>User ID *</label>
          <input id="auUserId" required placeholder="Permanent User ID">
          <span class="au-hint">User ID cannot be changed later.</span>
        </div>

        <div class="au-field">
          <label>User Name *</label>
          <input id="auUserName" required placeholder="Enter user name">
        </div>

        <div class="au-field">
          <label>Password <span id="auPassLabel">*</span></label>
          <input id="auPassword" type="password" placeholder="Minimum 8 characters">
          <span class="au-hint" id="auPassHint">Required for a new user.</span>
        </div>

        <div class="au-field">
          <label>Phone</label>
          <input id="auPhone" type="tel" placeholder="Phone number">
        </div>

        <div class="au-field">
          <label>Gmail</label>
          <input id="auGmail" type="email" placeholder="example@gmail.com">
        </div>

        <div class="au-field">
          <label>Area</label>
          <input id="auArea" placeholder="User area">
        </div>

        <div class="au-field">
          <label>Active Date</label>
          <input id="auActiveDate" type="date">
        </div>

        <div class="au-field">
          <label>Status</label>
          <select id="auStatus">
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
          </select>
        </div>

        <div class="au-field au-full">
          <label>Profile Picture</label>
          <div class="au-photo-area">
            <img id="auPreview" class="au-preview" alt="Profile preview">
            <div>
              <label class="au-upload-label">
                <span>📷 Choose Picture</span>
                <input id="auPhoto" type="file" accept="image/*">
              </label>
              <div class="au-hint" style="margin-top:8px">Phone Gallery বা Camera থেকে ছবি নির্বাচন করো। JPG, PNG, WEBP সমর্থিত।</div>
              <button type="button" class="au-remove" id="auRemovePhoto">Remove selected picture</button>
            </div>
          </div>
          <div class="au-progress" id="auProgress"><span id="auProgressBar"></span></div>
          <div class="au-hint" id="auPhotoStatus"></div>
        </div>

        <div class="au-field au-full">
          <label>Comment / Note</label>
          <textarea id="auComment" placeholder="Additional information..."></textarea>
        </div>

      </div>

      <div class="au-actions">
        <button class="au-btn au-primary" id="auSubmit" type="submit">Save User</button>
        <button class="au-btn au-secondary" type="button" id="auReset">Reset</button>
        <button class="au-btn au-secondary" type="button" onclick="window.loadPage('user-list')">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script>
(function(){
  const API_URL="https://script.google.com/macros/s/AKfycbzlabjyglodpoiPmupmA2buZqMyFiSPScIrTPm0T8Il7Z7bKtAkZglsfDk9WZAFOHgk/exec";
  const $=id=>document.getElementById(id);

  let editing=false;
  let originalUserId="";
  let existingPicture="";
  let selectedFile=null;
  let removePicture=false;

  function message(text,type){
    $("auMessage").textContent=text;
    $("auMessage").className="au-message "+type;
  }

  function field(obj,keys){
    for(const k of keys) if(obj && obj[k]!==undefined && obj[k]!==null) return obj[k];
    return "";
  }

  function showPicture(url){
    const img=$("auPreview");
    if(url){img.src=url;img.style.display="block";}
    else{img.removeAttribute("src");img.style.display="none";}
  }

  async function request(payload){
    const response=await fetch(API_URL,{
      method:"POST",
      body:JSON.stringify(payload)
    });
    const data=await response.json();
    if(!data.success) throw new Error(data.message||"Request failed.");
    return data;
  }

  function compressImage(file){
    return new Promise((resolve,reject)=>{
      const reader=new FileReader();
      reader.onerror=()=>reject(new Error("Could not read image."));
      reader.onload=()=>{
        const img=new Image();
        img.onerror=()=>reject(new Error("Invalid image file."));
        img.onload=()=>{
          const max=1000;
          const scale=Math.min(1,max/Math.max(img.width,img.height));
          const canvas=document.createElement("canvas");
          canvas.width=Math.round(img.width*scale);
          canvas.height=Math.round(img.height*scale);
          const ctx=canvas.getContext("2d");
          ctx.drawImage(img,0,0,canvas.width,canvas.height);
          resolve(canvas.toDataURL("image/jpeg",0.82));
        };
        img.src=reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  $("auPhoto").addEventListener("change",function(){
    const file=this.files[0];
    if(!file)return;
    if(!file.type.startsWith("image/")){
      message("Please select an image file.","err");
      this.value="";
      return;
    }
    selectedFile=file;
    removePicture=false;
    showPicture(URL.createObjectURL(file));
    $("auPhotoStatus").textContent=file.name+" selected. It will upload when you save.";
  });

  $("auRemovePhoto").addEventListener("click",function(){
    selectedFile=null;
    removePicture=true;
    $("auPhoto").value="";
    showPicture("");
    $("auPhotoStatus").textContent="Picture removed. Save to update profile.";
  });

  async function loadEditUser(){
    const id=new URLSearchParams(location.search).get("userId")||window.__wageEditUserId||"";
    if(!id)return;

    editing=true;
    originalUserId=id;
    $("auTitle").textContent="Loading User...";
    $("auSubmit").disabled=true;

    try{
      const response=await fetch(API_URL+"?api=profile&userId="+encodeURIComponent(id),{cache:"no-store"});
      const data=await response.json();
      if(!data.success)throw new Error(data.message||"User not found.");

      const u=data.user||data.profile||data.data;
      if(!u)throw new Error("User information missing.");

      $("auUserId").value=field(u,["userId","User ID"]);
      $("auUserName").value=field(u,["userName","User Name"]);
      $("auPhone").value=field(u,["phone","Phone"]);
      $("auGmail").value=field(u,["gmail","Gmail"]);
      $("auArea").value=field(u,["area","Area"]);
      $("auActiveDate").value=String(field(u,["activeDate","Active Date"])||"").slice(0,10);
      $("auStatus").value=field(u,["status","Status"])||"Active";
      $("auComment").value=field(u,["comment","Comment"]);

      existingPicture=field(u,["profilePicture","Profile Picture"]);
      showPicture(existingPicture);

      $("auUserId").readOnly=true;
      $("auPassword").required=false;
      $("auPassLabel").textContent="(Optional)";
      $("auPassHint").textContent="Leave blank to keep the current password.";
      $("auTitle").textContent="Edit User";
      $("auSubmit").textContent="Update User";
      window.__wageEditUserId="";

    }catch(err){
      message(err.message,"err");
    }finally{
      $("auSubmit").disabled=false;
    }
  }

  $("auReset").addEventListener("click",()=>{
    if(editing){loadEditUser();return;}
    $("auForm").reset();
    selectedFile=null;
    removePicture=false;
    existingPicture="";
    showPicture("");
    $("auPhotoStatus").textContent="";
    $("auMessage").className="au-message";
  });

  $("auForm").addEventListener("submit",async event=>{
    event.preventDefault();

    const id=$("auUserId").value.trim();
    const name=$("auUserName").value.trim();
    const password=$("auPassword").value;

    if(!id||!name){message("User ID and User Name are required.","err");return;}
    if(!editing&&password.length<8){message("Password must be at least 8 characters.","err");return;}
    if(editing&&id!==originalUserId){message("User ID cannot be changed.","err");return;}

    const button=$("auSubmit");
    button.disabled=true;

    try{
      let picture=removePicture?"":existingPicture;

      if(selectedFile){
        button.textContent="Preparing Picture...";
        $("auProgress").style.display="block";
        $("auProgressBar").style.width="25%";

        const imageData=await compressImage(selectedFile);

        $("auProgressBar").style.width="55%";
        button.textContent="Uploading Picture...";

        const uploaded=await request({
          action:"uploadProfilePicture",
          userId:id,
          imageData:imageData
        });

        picture=uploaded.profilePicture;
        $("auProgressBar").style.width="100%";
        $("auPhotoStatus").textContent="Picture uploaded successfully.";
      }

      button.textContent=editing?"Updating User...":"Saving User...";

      const payload={
        action:editing?"editUser":"addUser",
        userId:id,
        userName:name,
        password:password,
        phone:$("auPhone").value.trim(),
        gmail:$("auGmail").value.trim(),
        area:$("auArea").value.trim(),
        activeDate:$("auActiveDate").value,
        profilePicture:picture,
        status:$("auStatus").value,
        comment:$("auComment").value.trim()
      };

      const result=await request(payload);
      message(result.message||"User saved successfully.","ok");

      if(!editing){
        $("auForm").reset();
        selectedFile=null;
        existingPicture="";
        removePicture=false;
        showPicture("");
        $("auPhotoStatus").textContent="";
        $("auProgress").style.display="none";
      }else{
        existingPicture=picture;
        selectedFile=null;
        removePicture=false;
        $("auPassword").value="";
      }

    }catch(err){
      message(err.message,"err");
    }finally{
      button.disabled=false;
      button.textContent=editing?"Update User":"Save User";
      setTimeout(()=>{$("auProgress").style.display="none";},1000);
    }
  });

  loadEditUser();
})();
</script>
</body>
</html>
