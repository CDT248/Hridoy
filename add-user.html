
<style>
.user-page{max-width:900px;margin:auto}
.user-page-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.user-page-head h2{font-size:21px}
.user-page-head p{font-size:12px;color:var(--muted);margin-top:5px}
.user-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;box-shadow:var(--shadow)}
.user-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.user-field{display:flex;flex-direction:column;gap:8px}
.user-field.full{grid-column:1/-1}
.user-field label{font-size:12px;font-weight:700}
.user-field input,.user-field textarea{width:100%;padding:12px 13px;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:9px;outline:none;font:inherit;font-size:13px}
.user-field input:focus,.user-field textarea:focus{border-color:var(--primary)}
.user-field textarea{min-height:90px;resize:vertical}
.user-hint{font-size:10px;color:var(--muted)}
.user-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px;flex-wrap:wrap}
.user-btn{border:0;border-radius:8px;padding:11px 19px;font-weight:700;font-size:12px;cursor:pointer}
.user-btn.primary{background:var(--primary);color:white}
.user-btn.secondary{background:var(--bg);color:var(--text);border:1px solid var(--border)}
.user-message{display:none;padding:12px;border-radius:8px;font-size:12px;margin-bottom:16px}
.user-message.success{display:block;background:#e8f7ef;color:#087f5b}
.user-message.error{display:block;background:#fff0f0;color:#c0392b}
@media(max-width:600px){.user-grid{grid-template-columns:1fr}.user-field.full{grid-column:auto}.user-card{padding:16px}}
</style>

<div class="user-page">

  <div class="user-page-head">
    <div>
      <h2 id="userFormTitle">Add New User</h2>
      <p>Create and manage user information</p>
    </div>
    <button class="user-btn secondary" onclick="window.loadPage('user-list')">
      ← Back to Users
    </button>
  </div>

  <div class="user-card">

    <div id="userFormMessage" class="user-message"></div>

    <form id="userForm">

      <div class="user-grid">

        <div class="user-field">
          <label>User ID</label>
          <input id="u_userId" placeholder="Auto Generate">
          <span class="user-hint">Leave blank to generate automatically</span>
        </div>

        <div class="user-field">
          <label>User Name *</label>
          <input id="u_userName" required placeholder="Enter user name">
        </div>

        <div class="user-field">
          <label>Password <span id="passwordRequired">*</span></label>
          <input id="u_password" type="password" placeholder="Minimum 8 characters">
          <span class="user-hint" id="passwordHint">Required for new users</span>
        </div>

        <div class="user-field">
          <label>Phone Number *</label>
          <input id="u_phone" required placeholder="Enter phone number">
        </div>

        <div class="user-field">
          <label>Gmail</label>
          <input id="u_gmail" type="email" placeholder="example@gmail.com">
        </div>

        <div class="user-field">
          <label>Area</label>
          <input id="u_area" placeholder="Enter area">
        </div>

        <div class="user-field">
          <label>Active Date</label>
          <input id="u_activeDate" type="date">
        </div>

        <div class="user-field">
          <label>Profile Picture URL</label>
          <input id="u_profilePicture" type="url" placeholder="https://example.com/photo.jpg">
        </div>

        <div class="user-field full">
          <label>Comment</label>
          <textarea id="u_comment" placeholder="Write user notes..."></textarea>
        </div>

      </div>

      <div class="user-actions">
        <button type="button" class="user-btn secondary"
          onclick="window.loadPage('user-list')">
          Cancel
        </button>

        <button type="submit" class="user-btn primary" id="userSubmitBtn">
          Save User
        </button>
      </div>

    </form>
  </div>
</div>

<script>
(function(){

  const API_URL =
    "https://script.google.com/macros/s/AKfycbzlabjyglodpoiPmupmA2buZqMyFiSPScIrTPm0T8Il7Z7bKtAkZglsfDk9WZAFOHgk/exec";

  const form = document.getElementById("userForm");
  const message = document.getElementById("userFormMessage");

  let editId = window.__wageEditUserId || "";

  const params = new URLSearchParams(location.search);

  if(!editId){
    editId = params.get("edit") || "";
  }

  function showMessage(text,type){

    message.textContent = text;
    message.className = "user-message " + type;

  }

  function setValue(id,value){

    document.getElementById(id).value = value || "";

  }

  async function loadEditUser(){

    if(!editId) return;

    document.getElementById("userFormTitle").textContent =
      "Edit User";

    document.getElementById("userSubmitBtn").textContent =
      "Update User";

    document.getElementById("passwordRequired").textContent = "";

    document.getElementById("passwordHint").textContent =
      "Leave blank to keep current password";

    document.getElementById("u_userId").readOnly = true;

    try{

      const response = await fetch(
        API_URL + "?api=profile&userId=" +
        encodeURIComponent(editId)
      );

      const result = await response.json();

      if(!result.success){
        throw new Error(result.message || "User not found");
      }

      const u = result.user;

      setValue("u_userId",u.userId);
      setValue("u_userName",u.userName);
      setValue("u_phone",u.phone);
      setValue("u_gmail",u.gmail);
      setValue("u_area",u.area);
      setValue("u_activeDate",u.activeDate);
      setValue("u_profilePicture",u.profilePicture);
      setValue("u_comment",u.comment);

    }catch(error){

      showMessage(error.message,"error");

    }

  }


  form.addEventListener("submit",async function(e){

    e.preventDefault();

    const password =
      document.getElementById("u_password").value;

    if(!editId && password.length < 8){
      showMessage("Password must be at least 8 characters","error");
      return;
    }

    if(editId && password && password.length < 8){
      showMessage("Password must be at least 8 characters","error");
      return;
    }

    const data = {

      action: editId ? "edit" : "add",

      userId: document.getElementById("u_userId").value.trim(),

      userName: document.getElementById("u_userName").value.trim(),

      password: password,

      phone: document.getElementById("u_phone").value.trim(),

      gmail: document.getElementById("u_gmail").value.trim(),

      area: document.getElementById("u_area").value.trim(),

      activeDate: document.getElementById("u_activeDate").value,

      profilePicture: document.getElementById("u_profilePicture").value.trim(),

      comment: document.getElementById("u_comment").value.trim()

    };

    const button = document.getElementById("userSubmitBtn");

    button.disabled = true;
    button.textContent = "Please wait...";

    try{

      const response = await fetch(API_URL,{
        method:"POST",
        body:JSON.stringify(data)
      });

      const result = await response.json();

      if(!result.success){
        throw new Error(result.message || "Operation failed");
      }

      showMessage(result.message,"success");

      button.textContent = "Success";

      window.__wageEditUserId = "";

      setTimeout(function(){
        window.loadPage("user-list");
      },900);

    }catch(error){

      showMessage(error.message,"error");

      button.disabled = false;
      button.textContent = editId ? "Update User" : "Save User";

    }

  });


  loadEditUser();

})();
</script>
