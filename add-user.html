
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add User</title>

<style>
.au-page{
  color:var(--text,#172033);
  font-family:Inter,Arial,sans-serif;
}
.au-page *{box-sizing:border-box}
.au-page .au-card{
  background:var(--card,#fff);
  border:1px solid var(--border,#e8edf3);
  border-radius:15px;
  padding:23px;
  box-shadow:var(--shadow,0 3px 15px rgba(20,35,60,.04));
}
.au-page .au-heading{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:20px;
}
.au-page h2{font-size:20px;margin-bottom:5px}
.au-page .au-sub{font-size:12px;color:var(--muted,#8490a3)}
.au-page .au-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:17px;
}
.au-page .au-field{display:flex;flex-direction:column;gap:7px}
.au-page label{font-size:12px;font-weight:700}
.au-page input,
.au-page select,
.au-page textarea{
  width:100%;
  padding:12px 13px;
  border:1px solid var(--border,#e8edf3);
  border-radius:9px;
  background:var(--bg,#f5f7fb);
  color:var(--text,#172033);
  outline:none;
  font:inherit;
  font-size:13px;
}
.au-page input:focus,
.au-page select:focus,
.au-page textarea:focus{
  border-color:var(--primary,#087f5b);
}
.au-page textarea{min-height:85px;resize:vertical}
.au-page .full{grid-column:1/-1}
.au-page .au-actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:22px;
}
.au-page button{
  border:0;
  border-radius:9px;
  padding:12px 18px;
  cursor:pointer;
  font-weight:700;
  font-size:12px;
}
.au-page .primary{
  background:var(--primary,#087f5b);
  color:white;
}
.au-page .secondary{
  background:var(--hover,#f1f8f5);
  color:var(--text,#172033);
}
.au-page .au-message{
  display:none;
  padding:12px;
  border-radius:9px;
  font-size:12px;
  margin-bottom:15px;
}
.au-page .success{
  display:block;
  color:#087f5b;
  background:#e8f7ef;
}
.au-page .error{
  display:block;
  color:#c0392b;
  background:#fff0ee;
}
.au-page .hint{
  font-size:10px;
  color:var(--muted,#8490a3);
}
.au-page .required{color:#e05252}
.au-page .au-photo{
  width:65px;height:65px;border-radius:50%;
  object-fit:cover;background:var(--hover);
  border:1px solid var(--border);
  display:none;
}
@media(max-width:650px){
  .au-page .au-grid{grid-template-columns:1fr}
  .au-page .full{grid-column:auto}
  .au-page .au-card{padding:16px}
}
</style>
</head>

<body>

<div class="au-page">

  <div class="au-heading">
    <div>
      <h2 id="auTitle">Add New User</h2>
      <div class="au-sub">Create and manage user profile information</div>
    </div>
    <button class="secondary" type="button"
      onclick="window.loadPage('user-list')">
      View Users
    </button>
  </div>

  <div class="au-card">

    <div id="auMessage" class="au-message"></div>

    <form id="auForm">

      <div class="au-grid">

        <div class="au-field">
          <label>User ID <span class="required">*</span></label>
          <input id="auUserId" required
            placeholder="Enter permanent User ID">
          <span class="hint">User ID cannot be changed after creation.</span>
        </div>

        <div class="au-field">
          <label>User Name <span class="required">*</span></label>
          <input id="auUserName" required
            placeholder="Enter user name">
        </div>

        <div class="au-field">
          <label>Password <span id="auPasswordRequired" class="required">*</span></label>
          <input id="auPassword" type="password"
            placeholder="Minimum 8 characters">
          <span class="hint" id="auPasswordHint">
            Password is required for a new user.
          </span>
        </div>

        <div class="au-field">
          <label>Phone Number</label>
          <input id="auPhone" type="tel"
            placeholder="Enter phone number">
        </div>

        <div class="au-field">
          <label>Gmail</label>
          <input id="auGmail" type="email"
            placeholder="example@gmail.com">
        </div>

        <div class="au-field">
          <label>Area</label>
          <input id="auArea" placeholder="Enter area">
        </div>

        <div class="au-field">
          <label>Active Date</label>
          <input id="auActiveDate" type="date">
        </div>

        <div class="au-field">
          <label>Status</label>
          <select id="auStatus">
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
          </select>
        </div>

        <div class="au-field full">
          <label>Profile Picture URL</label>
          <input id="auPicture"
            placeholder="https://example.com/photo.jpg">
          <img id="auPreview" class="au-photo" alt="Profile preview">
          <span class="hint">Optional: paste a publicly accessible image URL.</span>
        </div>

        <div class="au-field full">
          <label>Comment / Note</label>
          <textarea id="auComment"
            placeholder="Write any additional information..."></textarea>
        </div>

      </div>

      <div class="au-actions">

        <button class="primary" id="auSubmit" type="submit">
          Save User
        </button>

        <button class="secondary" type="button" id="auReset">
          Reset Form
        </button>

        <button class="secondary" type="button"
          onclick="window.loadPage('user-list')">
          Cancel
        </button>

      </div>

    </form>

  </div>
</div>

<script>
(function(){

  const API_URL =
    "https://script.google.com/macros/s/AKfycbzlabjyglodpoiPmupmA2buZqMyFiSPScIrTPm0T8Il7Z7bKtAkZglsfDk9WZAFOHgk/exec";

  const $ = id => document.getElementById(id);

  let editing = false;
  let originalUserId = "";

  function showMessage(message,type){

    const box = $("auMessage");
    box.textContent = message;
    box.className = "au-message " + type;

  }

  function getValue(obj,keys){

    for(const key of keys){
      if(obj && obj[key] !== undefined && obj[key] !== null){
        return obj[key];
      }
    }

    return "";
  }

  function setForm(user){

    $("auUserId").value =
      getValue(user,["userId","userID","User ID","id"]);

    $("auUserName").value =
      getValue(user,["userName","name","User Name"]);

    $("auPhone").value =
      getValue(user,["phone","Phone"]);

    $("auGmail").value =
      getValue(user,["gmail","email","Gmail"]);

    $("auArea").value =
      getValue(user,["area","Area"]);

    $("auActiveDate").value =
      String(getValue(user,["activeDate","Active Date"]) || "").slice(0,10);

    $("auPicture").value =
      getValue(user,["profilePicture","picture","Profile Picture"]);

    $("auStatus").value =
      getValue(user,["status","Status"]) || "Active";

    $("auComment").value =
      getValue(user,["comment","Comment"]);

    $("auUserId").readOnly = true;

    $("auPassword").required = false;

    $("auPasswordRequired").textContent = "(Optional)";

    $("auPasswordHint").textContent =
      "Leave blank to keep the existing password.";

    $("auTitle").textContent = "Edit User";

    $("auSubmit").textContent = "Update User";

    const image = $("auPicture").value;

    if(image){
      $("auPreview").src = image;
      $("auPreview").style.display = "block";
    }

  }

  async function loadEditUser(){

    const userId =
      new URLSearchParams(location.search).get("userId") ||
      window.__wageEditUserId ||
      "";

    if(!userId) return;

    editing = true;
    originalUserId = userId;

    $("auTitle").textContent = "Loading User...";
    $("auSubmit").disabled = true;

    try{

      const response = await fetch(
        API_URL + "?api=profile&userId=" +
        encodeURIComponent(userId),
        {cache:"no-store"}
      );

      const data = await response.json();

      if(!data.success){
        throw new Error(data.message || "User not found.");
      }

      const user = data.user || data.profile || data.data;

      if(!user){
        throw new Error("User information not found in API response.");
      }

      setForm(user);

      window.__wageEditUserId = "";

    }catch(error){

      showMessage(error.message,"error");

    }finally{

      $("auSubmit").disabled = false;

    }

  }

  $("auPicture").addEventListener("input",function(){

    const url = this.value.trim();

    if(url){
      $("auPreview").src = url;
      $("auPreview").style.display = "block";
    }else{
      $("auPreview").style.display = "none";
    }

  });

  $("auPreview").addEventListener("error",function(){
    this.style.display = "none";
  });

  $("auReset").addEventListener("click",function(){

    if(editing){
      loadEditUser();
    }else{
      $("auForm").reset();
      $("auMessage").className = "au-message";
      $("auPreview").style.display = "none";
    }

  });

  $("auForm").addEventListener("submit",async function(event){

    event.preventDefault();

    const userId = $("auUserId").value.trim();
    const userName = $("auUserName").value.trim();
    const password = $("auPassword").value;

    if(!userId || !userName){
      showMessage("User ID and User Name are required.","error");
      return;
    }

    if(!editing && password.length < 8){
      showMessage("Password must be at least 8 characters.","error");
      return;
    }

    if(editing && userId !== originalUserId){
      showMessage("User ID cannot be changed.","error");
      return;
    }

    const payload = {

      action: editing ? "editUser" : "addUser",

      userId:userId,
      userName:userName,
      password:password,

      phone:$("auPhone").value.trim(),
      gmail:$("auGmail").value.trim(),
      area:$("auArea").value.trim(),
      activeDate:$("auActiveDate").value,
      profilePicture:$("auPicture").value.trim(),
      status:$("auStatus").value,
      comment:$("auComment").value.trim()

    };

    const button = $("auSubmit");

    button.disabled = true;
    button.textContent = "Saving...";

    try{

      const response = await fetch(API_URL,{
        method:"POST",
        body:JSON.stringify(payload)
      });

      const data = await response.json();

      if(!data.success){
        throw new Error(data.message || "Unable to save user.");
      }

      showMessage(
        data.message || (editing ? "User updated successfully." : "User added successfully."),
        "success"
      );

      if(!editing){

        $("auForm").reset();
        $("auPreview").style.display = "none";

      }else{

        $("auPassword").value = "";

      }

    }catch(error){

      showMessage(error.message,"error");

    }finally{

      button.disabled = false;
      button.textContent = editing ? "Update User" : "Save User";

    }

  });

  loadEditUser();

})();
</script>

</body>
</html>
