
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Add User | Wage Management</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f7f5;font-family:Arial,sans-serif;color:#172b25}
.container{max-width:850px;margin:30px auto;padding:20px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
h2{margin:0;color:#116149}
.sub{color:#718078;font-size:13px;margin-top:7px}
.card{background:#fff;border:1px solid #e2ebe6;border-radius:16px;padding:25px;box-shadow:0 5px 20px #163d2b0b}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:17px}
.field{display:flex;flex-direction:column;gap:7px}
.field.full{grid-column:1/-1}
label{font-size:13px;font-weight:700;color:#40574d}
input,select,textarea{width:100%;padding:12px 13px;border:1px solid #dce6e0;border-radius:9px;background:#fff;font-size:14px;outline:none;color:#203b30}
input:focus,select:focus,textarea:focus{border-color:#15966d;box-shadow:0 0 0 3px #15966d15}
textarea{min-height:85px;resize:vertical}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
button,.btn{border:0;border-radius:9px;padding:12px 20px;font-weight:700;cursor:pointer;text-decoration:none;font-size:14px}
.primary{background:#087f5b;color:#fff}
.secondary{background:#eaf2ed;color:#315b49}
button:disabled{opacity:.6;cursor:wait}
.message{padding:12px;border-radius:9px;margin-bottom:15px;display:none;font-size:14px}
.success{display:block;background:#e7f8ef;color:#087443}
.error{display:block;background:#fff0ed;color:#b42318}
.hint{font-size:12px;color:#829087}
@media(max-width:600px){.container{padding:13px;margin:12px auto}.card{padding:17px}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>
</head>
<body>
<div class="container">
  <div class="top">
    <div>
      <h2 id="pageTitle">Add New User</h2>
      <div class="sub">Create and manage user information</div>
    </div>
    <a class="btn secondary" href="user-list.html">← User List</a>
  </div>

  <div class="card">
    <div id="message" class="message"></div>

    <form id="userForm">
      <div class="grid">

        <div class="field">
          <label>User Name *</label>
          <input id="userName" required placeholder="Enter user name">
        </div>

        <div class="field">
          <label>User ID</label>
          <input id="userId" placeholder="Auto generated if empty">
          <div class="hint" id="idHint">Leave empty to generate automatically.</div>
        </div>

        <div class="field">
          <label>Password <span id="passwordRequired">*</span></label>
          <input id="password" type="password" minlength="8" placeholder="Minimum 8 characters">
          <div class="hint" id="passwordHint">Required for a new user.</div>
        </div>

        <div class="field">
          <label>Phone</label>
          <input id="phone" type="tel" placeholder="Phone number">
        </div>

        <div class="field">
          <label>Gmail</label>
          <input id="gmail" type="email" placeholder="user@gmail.com">
        </div>

        <div class="field">
          <label>Area</label>
          <input id="area" placeholder="Enter area">
        </div>

        <div class="field">
          <label>Active Date</label>
          <input id="activeDate" type="date">
        </div>

        <div class="field">
          <label>Status</label>
          <select id="status">
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
            <option value="Pending">Pending</option>
          </select>
        </div>

        <div class="field full">
          <label>Profile Picture URL</label>
          <input id="picture" type="url" placeholder="https://example.com/photo.jpg">
        </div>

        <div class="field full">
          <label>Comment</label>
          <textarea id="comment" placeholder="Write user notes..."></textarea>
        </div>

      </div>

      <div class="actions">
        <button class="primary" id="saveBtn" type="submit">Save User</button>
        <button class="secondary" type="reset">Reset</button>
        <a class="btn secondary" href="user-list.html">Cancel</a>
      </div>
    </form>
  </div>
</div>

<script>
const API_URL = window.WAGE_API ||
"https://script.google.com/macros/s/AKfycbzlabjyglodpoiPmupmA2buZqMyFiSPScIrTPm0T8Il7Z7bKtAkZglsfDk9WZAFOHgk/exec";

const params = new URLSearchParams(location.search);
const editUserId = params.get("userId");
const $ = id => document.getElementById(id);

async function apiGet(query) {
  const response = await fetch(API_URL + "?api=" + encodeURIComponent(query.api) +
    (query.userId ? "&userId=" + encodeURIComponent(query.userId) : ""));
  return response.json();
}

async function apiPost(data) {
  const response = await fetch(API_URL, {
    method: "POST",
    headers: {"Content-Type":"text/plain;charset=utf-8"},
    body: JSON.stringify(data)
  });
  return response.json();
}

function showMessage(text, type) {
  $("message").textContent = text;
  $("message").className = "message " + type;
}

function setValue(id, value) {
  $(id).value = value || "";
}

async function loadEditUser() {
  if (!editUserId) return;

  $("pageTitle").textContent = "Edit User";
  $("saveBtn").textContent = "Update User";
  $("userId").readOnly = true;
  $("idHint").textContent = "User ID cannot be changed.";
  $("passwordRequired").textContent = "(Optional)";
  $("password").removeAttribute("required");
  $("passwordHint").textContent = "Leave empty to keep the current password.";

  try {
    const result = await apiGet({api:"profile",userId:editUserId});
    if (!result.success || !result.user) {
      showMessage(result.message || "User not found","error");
      return;
    }

    const u = result.user;
    setValue("userName",u.userName);
    setValue("userId",u.userId);
    setValue("phone",u.phone);
    setValue("gmail",u.gmail);
    setValue("area",u.area);
    setValue("activeDate",u.activeDate);
    setValue("picture",u.picture);
    setValue("status",u.status);
    setValue("comment",u.comment);

  } catch(error) {
    showMessage("Could not load user: " + error.message,"error");
  }
}

$("userForm").addEventListener("submit",async function(event) {
  event.preventDefault();

  const password = $("password").value;

  if (!editUserId && password.length < 8) {
    showMessage("Password must be at least 8 characters.","error");
    return;
  }

  if (editUserId && password && password.length < 8) {
    showMessage("New password must be at least 8 characters.","error");
    return;
  }

  const data = {
    action: editUserId ? "editUser" : "addUser",
    userId: $("userId").value.trim(),
    userName: $("userName").value.trim(),
    password: password,
    phone: $("phone").value.trim(),
    gmail: $("gmail").value.trim(),
    area: $("area").value.trim(),
    activeDate: $("activeDate").value,
    picture: $("picture").value.trim(),
    status: $("status").value,
    comment: $("comment").value.trim()
  };

  $("saveBtn").disabled = true;
  $("saveBtn").textContent = "Saving...";

  try {
    const result = await apiPost(data);

    if (!result.success) {
      throw new Error(result.message || "Operation failed");
    }

    showMessage(result.message || "Saved successfully","success");

    if (!editUserId) {
      $("userForm").reset();
      setTimeout(() => location.href="user-list.html",900);
    } else {
      $("password").value = "";
    }

  } catch(error) {
    showMessage(error.message,"error");
  } finally {
    $("saveBtn").disabled = false;
    $("saveBtn").textContent = editUserId ? "Update User" : "Save User";
  }
});

loadEditUser();
</script>
</body>
</html>
