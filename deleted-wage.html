
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deleted Wage</title>

<style>
#deletedWagePage{
  font-family:inherit;
  color:var(--text,#172033);
  max-width:950px;
  margin:auto;
  background:transparent;
}
#deletedWagePage *{box-sizing:border-box}

#deletedWagePage .hero{
  padding:25px;
  border-radius:18px;
  color:white;
  background:linear-gradient(120deg,#4338ca,#6366f1,#8b5cf6);
  margin-bottom:22px;
}
#deletedWagePage .hero h2{
  margin:0 0 7px;
  font-size:25px;
  color:white;
}
#deletedWagePage .hero p{
  margin:0;
  color:#e0e7ff;
  font-size:13px;
}

#deletedWagePage .card{
  background:var(--card,#fff);
  color:var(--text,#172033);
  border:1px solid var(--border,#e5e7eb);
  border-radius:17px;
  padding:24px;
  box-shadow:0 7px 25px #00000008;
  margin-bottom:20px;
}

#deletedWagePage .heading{
  font-size:18px;
  font-weight:800;
  margin:0 0 22px;
  padding-bottom:16px;
  border-bottom:1px solid var(--border,#e5e7eb);
}

#deletedWagePage .stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-bottom:20px;
}

#deletedWagePage .stat{
  background:var(--card,#fff);
  color:var(--text,#172033);
  border:1px solid var(--border,#e5e7eb);
  border-radius:14px;
  padding:17px;
  box-shadow:0 7px 25px #00000008;
}

#deletedWagePage .stat-label{
  font-size:12px;
  color:var(--muted,#888);
  margin-bottom:9px;
}

#deletedWagePage .stat-value{
  font-size:23px;
  font-weight:800;
  color:var(--text,#172033);
  overflow-wrap:anywhere;
}

#deletedWagePage .toolbar{
  display:grid;
  grid-template-columns:1fr auto;
  gap:12px;
  margin-bottom:18px;
}

#deletedWagePage input{
  width:100%;
  min-height:46px;
  padding:12px 13px;
  border-radius:10px;
  border:1px solid var(--border,#ddd);
  background:var(--bg,#f8fafc);
  color:var(--text,#172033);
  font:inherit;
  font-size:14px;
  outline:none;
}

#deletedWagePage input:focus{
  border-color:#6366f1;
  box-shadow:0 0 0 3px #6366f11c;
}

#deletedWagePage input::placeholder{
  color:var(--muted,#888);
}

#deletedWagePage button{
  border:0;
  border-radius:10px;
  padding:13px 20px;
  font-weight:800;
  cursor:pointer;
  font:inherit;
}

#deletedWagePage button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

#deletedWagePage .primary{
  background:linear-gradient(120deg,#4338ca,#7c3aed);
  color:white;
}

#deletedWagePage .secondary{
  background:var(--bg,#f1f5f9);
  border:1px solid var(--border,#ddd);
  color:var(--text,#172033);
}

#deletedWagePage .restore{
  background:#dcfce7;
  color:#166534;
}

#deletedWagePage .danger{
  background:#fee2e2;
  color:#991b1b;
}

#deletedWagePage .message{
  display:none;
  padding:12px 14px;
  border-radius:10px;
  margin-bottom:18px;
  font-size:13px;
}

#deletedWagePage .message.success{
  display:block;
  background:#dcfce7;
  color:#166534;
}

#deletedWagePage .message.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

#deletedWagePage .count{
  font-size:12px;
  color:var(--muted,#888);
  margin-bottom:12px;
}

#deletedWagePage .table-wrap{
  width:100%;
  overflow-x:auto;
  background:var(--card,#fff);
  border-radius:10px;
}

#deletedWagePage table{
  width:100%;
  border-collapse:collapse;
  min-width:850px;
  font-size:13px;
  background:var(--card,#fff);
  color:var(--text,#172033);
}

#deletedWagePage th{
  background:var(--bg,#f8fafc);
  color:var(--muted,#777);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.4px;
  text-align:left;
  padding:14px 12px;
  border-bottom:1px solid var(--border,#ddd);
  white-space:nowrap;
}

#deletedWagePage td{
  padding:14px 12px;
  border-bottom:1px solid var(--border,#eee);
  color:var(--text,#172033);
  vertical-align:middle;
}

#deletedWagePage tbody tr:hover{
  background:var(--hover,rgba(99,102,241,.04));
}

#deletedWagePage .company{
  font-weight:800;
  color:var(--text,#172033);
}

#deletedWagePage .sub{
  font-size:11px;
  color:var(--muted,#888);
  margin-top:4px;
}

#deletedWagePage .amount{
  font-weight:800;
  white-space:nowrap;
}

#deletedWagePage .actions{
  display:flex;
  gap:7px;
  white-space:nowrap;
}

#deletedWagePage .actions button{
  font-size:11px;
  padding:9px 11px;
}

#deletedWagePage .empty,
#deletedWagePage .loading{
  text-align:center;
  padding:35px 15px;
  color:var(--muted,#888);
}

#deletedWagePage .badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  background:#fee2e2;
  color:#991b1b;
  font-size:11px;
  font-weight:800;
}

@media(max-width:650px){
  #deletedWagePage .stats{
    grid-template-columns:1fr 1fr;
  }
  #deletedWagePage .stat:last-child{
    grid-column:1/-1;
  }
  #deletedWagePage .card{
    padding:17px;
  }
  #deletedWagePage .toolbar{
    grid-template-columns:1fr;
  }
  #deletedWagePage .toolbar button{
    width:100%;
  }
  #deletedWagePage .hero{
    padding:22px;
  }
}
</style>
</head>

<body>

<div id="deletedWagePage">

  <div class="hero">
    <h2>🗑️ Deleted Wage</h2>
    <p>View, restore and permanently delete your removed wage records.</p>
  </div>

  <div class="stats">

    <div class="stat">
      <div class="stat-label">Deleted Records</div>
      <div class="stat-value" id="dwTotal">0</div>
    </div>

    <div class="stat">
      <div class="stat-label">Latest Wage Date</div>
      <div class="stat-value" id="dwLatest" style="font-size:17px">—</div>
    </div>

    <div class="stat">
      <div class="stat-label">Available Actions</div>
      <div class="stat-value" style="font-size:17px">Restore / Delete</div>
    </div>

  </div>

  <div class="card">

    <h3 class="heading">Deleted Wage Information</h3>

    <div id="dwMessage" class="message"></div>

    <div class="toolbar">
      <input
        id="dwSearch"
        type="search"
        placeholder="Search company, wage ID, transaction ID..."
      >

      <button type="button" class="primary" id="dwRefresh">
        ↻ Refresh Records
      </button>
    </div>

    <div class="count" id="dwCount">Showing 0 records</div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>SL</th>
            <th>Company / Wage ID</th>
            <th>Wage Amount</th>
            <th>Transaction ID</th>
            <th>Date</th>
            <th>Comment</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody id="dwTable">
          <tr>
            <td colspan="8" class="loading">Loading deleted wages...</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

</div>

<script>
(function(){

  const root=document.getElementById("deletedWagePage");

  if(!root || root.dataset.ready==="1")return;

  root.dataset.ready="1";

  const API="https://script.google.com/macros/s/AKfycbygdxmo_sur5KYs3XhYHnyaMGQQ_G5_Prc9NUozP9dxRVhrwVmezX2ozhkhqQ4KeWKxPQ/exec";

  const $=id=>root.querySelector("#"+id);

  let wages=[];
  let busy=false;

  function esc(value){
    return String(value??"").replace(/[&<>"']/g,c=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c]));
  }

  function msg(text,type){
    $("dwMessage").textContent=text;
    $("dwMessage").className="message "+type;
  }

  function clearMsg(){
    $("dwMessage").textContent="";
    $("dwMessage").className="message";
  }

  async function get(api){

    const response=await fetch(
      API+"?api="+encodeURIComponent(api)+"&_="+Date.now(),
      {cache:"no-store"}
    );

    if(!response.ok){
      throw Error("HTTP "+response.status);
    }

    return response.json();
  }

  async function post(data){

    const response=await fetch(API,{
      method:"POST",
      headers:{
        "Content-Type":"text/plain;charset=utf-8"
      },
      body:JSON.stringify(data)
    });

    if(!response.ok){
      throw Error("HTTP "+response.status);
    }

    return response.json();
  }

  function amountText(w){

    const amount=Number(w.amount||0);

    return (w.currencySymbol||"")+" "+
      amount.toLocaleString(undefined,{
        maximumFractionDigits:2
      });
  }

  function updateStats(){

    $("dwTotal").textContent=wages.length;

    const dates=wages
      .map(w=>String(w.date||""))
      .filter(Boolean)
      .sort();

    $("dwLatest").textContent=
      dates.length?dates[dates.length-1]:"—";
  }

  function render(){

    const q=$("dwSearch").value.trim().toLowerCase();

    const filtered=wages.filter(w=>{

      const searchText=[
        w.companyName,
        w.wageId,
        w.transactionId,
        w.currencyCode,
        w.currencySymbol,
        w.comment,
        w.date,
        w.amount
      ].join(" ").toLowerCase();

      return searchText.includes(q);

    });

    $("dwCount").textContent=
      "Showing "+filtered.length+" of "+wages.length+" records";

    if(!filtered.length){

      $("dwTable").innerHTML=
        '<tr><td colspan="8" class="empty">'+
        (wages.length
          ?"No matching wage records found."
          :"No deleted wage records found.")+
        '</td></tr>';

      return;
    }

    $("dwTable").innerHTML=filtered.map((w,i)=>`

      <tr>

        <td>${i+1}</td>

        <td>
          <div class="company">
            ${esc(w.companyName||"No Company Name")}
          </div>
          <div class="sub">
            ID: ${esc(w.wageId||"")}
          </div>
        </td>

        <td class="amount">
          ${esc(amountText(w))}
        </td>

        <td>${esc(w.transactionId||"—")}</td>

        <td>${esc(w.date||"—")}</td>

        <td>${esc(w.comment||"—")}</td>

        <td>
          <span class="badge">Deleted</span>
        </td>

        <td>
          <div class="actions">

            <button
              type="button"
              class="restore"
              data-action="restore"
              data-id="${esc(w.wageId||"")}"
              data-row="${Number(w._row||0)}"
              ${busy?"disabled":""}>
              ↶ Restore
            </button>

            <button
              type="button"
              class="danger"
              data-action="permanent"
              data-id="${esc(w.wageId||"")}"
              data-row="${Number(w._row||0)}"
              ${busy?"disabled":""}>
              Delete Forever
            </button>

          </div>
        </td>

      </tr>

    `).join("");

  }

  async function loadDeletedWages(){

    $("dwRefresh").disabled=true;

    $("dwTable").innerHTML=
      '<tr><td colspan="8" class="loading">Loading deleted wages...</td></tr>';

    try{

      const data=await get("deletedWages");

      if(!data.success){
        throw Error(data.message||"Could not load deleted wages");
      }

      wages=Array.isArray(data.deletedWages)
        ?data.deletedWages:[ ];

      updateStats();
      render();

    }catch(error){

      $("dwTable").innerHTML=
        '<tr><td colspan="8" class="empty">Failed to load: '+
        esc(error.message)+'</td></tr>';

      msg("Load failed: "+error.message,"error");

    }finally{

      $("dwRefresh").disabled=false;

    }

  }

  async function performAction(action,button){

    if(busy)return;

    const wageId=button.dataset.id;
    const deletedRow=Number(button.dataset.row||0);

    if(action==="restore"){

      if(!confirm("Are you sure you want to restore this wage?")){
        return;
      }

    }else{

      if(!confirm(
        "WARNING: This wage will be permanently deleted. This action cannot be undone. Continue?"
      )){
        return;
      }

    }

    busy=true;
    render();
    clearMsg();

    try{

      const result=await post({

        action:action==="restore"
          ?"restoreWage"
          :"permanentDeleteWage",

        wageId:wageId,
        deletedRow:deletedRow

      });

      if(!result.success){
        throw Error(result.message||"Action failed");
      }

      msg(
        "✓ "+(result.message||"Action completed successfully."),
        "success"
      );

      await loadDeletedWages();

    }catch(error){

      msg("Action failed: "+error.message,"error");

    }finally{

      busy=false;
      render();

    }

  }

  $("dwTable").addEventListener("click",function(event){

    const button=event.target.closest("button[data-action]");

    if(!button || busy)return;

    performAction(button.dataset.action,button);

  });

  $("dwSearch").addEventListener("input",render);

  $("dwRefresh").addEventListener("click",function(){

    clearMsg();
    loadDeletedWages();

  });

  loadDeletedWages();

})();
</script>

</body>
</html>
